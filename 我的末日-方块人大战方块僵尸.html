<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>我的末日 · 方块人大战方块僵尸</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0b1020;
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  touch-action:manipulation;overscroll-behavior:none}
#cv{position:fixed;left:0;top:0;display:block;touch-action:none}

/* ---------- 通用按钮 ---------- */
button{font-family:inherit;cursor:pointer;border:0}
.big{height:clamp(64px,9vh,88px);padding:0 clamp(28px,5vw,54px);border-radius:999px;
  font-size:clamp(24px,3.4vw,36px);font-weight:900;color:#fff;background:#43a047;
  box-shadow:0 7px 0 #2c6b2f;letter-spacing:2px}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 #2c6b2f}
.big.blue{background:#3d7bd9;box-shadow:0 7px 0 #25518f}
.big.blue:active{box-shadow:0 2px 0 #25518f}
.big.gray{background:#5b6b85;box-shadow:0 7px 0 #3a4759}
.big.gray:active{box-shadow:0 2px 0 #3a4759}
.mini{height:46px;padding:0 18px;border-radius:999px;font-size:16px;font-weight:800;
  color:#fff;background:#4a5a78;box-shadow:0 4px 0 #33405a}
.mini:active{transform:translateY(3px);box-shadow:0 1px 0 #33405a}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;top:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
  padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 10px calc(14px + env(safe-area-inset-left));
  pointer-events:none;z-index:5}
#hud.hide{display:none}
.hudL{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hudR{display:flex;gap:10px;pointer-events:auto}
.plate{background:rgba(8,14,28,.62);border:2px solid rgba(255,255,255,.16);border-radius:16px;
  padding:6px 14px;color:#fff;font-size:clamp(15px,2vw,20px);font-weight:800;display:flex;align-items:center;gap:6px}
.plate b{font-size:clamp(20px,2.8vw,28px);color:#ffd54f;font-weight:900;min-width:1.2em;text-align:center}
#hearts{font-size:clamp(22px,3.2vw,32px);letter-spacing:3px;
  background:rgba(8,14,28,.62);border:2px solid rgba(255,255,255,.16);border-radius:16px;padding:4px 12px}
.ic{width:56px;height:56px;border-radius:18px;font-size:26px;color:#fff;
  background:rgba(8,14,28,.62);border:2px solid rgba(255,255,255,.2)}
.ic:active{transform:translateY(3px)}

/* ---------- 屏幕层 ---------- */
.scr{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;gap:12px;overflow:hidden;
  /* 顶/底固定留 30px 兜底：状态栏/导航栏盖不住字；env() 生效的设备再叠加安全区 */
  padding:calc(30px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));
  background:radial-gradient(circle at 50% 40%,rgba(16,28,52,.86),rgba(4,8,18,.96))}
.scr.hide{display:none}
/* 藏宝图扩到四行之后，菜单在 768 高的平板横屏上也会超出一屏。
   .scr 是「居中 + overflow:hidden」，内容一超高就上下各切一半（标题削顶、第四行看不见），
   所以菜单单独改成「贴顶排 + 整屏可滚」，再在头尾各垫一块可伸缩的空白：
   装得下时两块均分余量，看起来和原来的居中一模一样；
   装不下时两块自动塌成 0，内容从顶部开始排，第四行「世界尽头」滚一下就到，永远不会被切掉。 */
#scrMenu{justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#scrMenu::before,#scrMenu::after{content:'';flex:1 1 0;min-height:0;align-self:stretch}
/* 目标平板档（高 761–1060，主力机 MatePad Air 横屏可视约 1370×920 就在这档）：
   满尺寸（地图 340）时首页自然总高约 1010px，比 920 还高一截，
   第四行「世界尽头」会被切掉约 90px，孩子不滑一下根本看不见终章——
   而藏宝图必须一屏看全（四个篇章四行是一眼要读出来的进度）。
   所以这一档按"量出来的数字"压到刚好一屏（1370×920 实测 scrollHeight=920、overflow=0）：
   地图 340→280、格子 58→48、主按钮 9vh→56、标题 86→54，
   字号取满尺寸档与矮屏档的中间值，行距 69 > 格高 48，⭐/🔒 角标仍有位置。
   电脑大屏（高 >1060）不吃这条规则，仍是下面的满尺寸版。 */
@media (min-height:761px) and (max-height:1060px){
  #scrMenu{gap:10px;padding-top:calc(22px + env(safe-area-inset-top));padding-bottom:calc(22px + env(safe-area-inset-bottom))}
  #scrMenu h1{font-size:clamp(40px,5.9vw,54px);letter-spacing:4px}
  #scrMenu .tagline{font-size:17px;margin-top:-2px}
  #scrMenu .chars{margin:2px 0}
  #scrMenu .chc{width:clamp(126px,15.8vw,148px);padding:5px 9px 6px;border-radius:18px}
  #scrMenu .cn{font-size:15px;margin-top:4px}
  #scrMenu .mapTitle{font-size:16px}
  #scrMenu .mapWrap{height:280px;width:min(620px,92vw)}
  #scrMenu .spot,#scrMenu .gift{height:48px;font-size:11px}
  #scrMenu .spot span{font-size:20px}
  #scrMenu .gift span{font-size:18px}
  #scrMenu .spot i,#scrMenu .gift i{font-size:11px}
  /* 行距 69 − 格高 48 只剩 21px 空隙，⭐ 角标往上抬 16 会顶到上一行的卡片下沿，这档收一点 */
  #scrMenu .spot.sel::before{top:-13px;font-size:14px}
  #scrMenu .spot .no{font-size:8px;padding:0 4px;top:-8px;left:-4px}
  #scrMenu .big{height:56px;font-size:18px;padding:0 22px}
  #scrMenu .menuRow{font-size:14px}
  #fitRow .fit{width:56px}
  #fitRow .fit canvas{width:46px;height:54px}
}
/* 矮屏两档：菜单是 position:fixed，纵向空间一紧就得把「头部三件套」和卡片一起压下来；
   最矮那档（横屏手机）连压带缩也装不下四行地图，靠上面那条整屏滚动兜底。 */
@media (max-height:760px){
  #scrMenu{gap:8px;padding-top:calc(22px + env(safe-area-inset-top));padding-right:calc(10px + env(safe-area-inset-right));
    padding-bottom:calc(22px + env(safe-area-inset-bottom));padding-left:calc(10px + env(safe-area-inset-left))}
  #scrMenu h1{font-size:clamp(28px,5.6vw,44px);letter-spacing:3px}
  #scrMenu .tagline{font-size:clamp(12px,1.7vw,15px);margin-top:-2px}
  #scrMenu .chars{margin:0}
  #scrMenu .chc{width:clamp(112px,17vw,150px);padding:4px 8px 6px;border-radius:18px}
  #scrMenu .cn{font-size:12px;margin-top:3px}
  #scrMenu .mapTitle{font-size:12px}
  #scrMenu .mapWrap{height:250px;width:min(560px,90vw)}
  #scrMenu .spot{height:44px;font-size:10px;border-width:2.5px;border-radius:11px}
  #scrMenu .spot span{font-size:18px}
  #scrMenu .spot i{font-size:10px}
  #scrMenu .spot .no{font-size:8px;padding:0 4px;top:-8px;left:-4px}
  #scrMenu .spot.sel::before{top:-13px;font-size:14px}
  #scrMenu .spot.lock::after{top:-9px;right:-7px;font-size:13px}
  #scrMenu .gift{height:44px;font-size:9px;border-width:2.5px}
  #scrMenu .gift span{font-size:17px}
  #scrMenu .big{height:50px;font-size:20px;padding:0 20px}
  #scrMenu .menuRow{font-size:13px}
  #fitRow .fit{width:50px}
  #fitRow .fit canvas{width:42px;height:48px}
}
/* 手机横屏（高 ≤520）：藏宝图四行很挤，人物卡压成「头像＋名字」横条，副标题让位。
   头像仍是真实立绘 canvas（38×44＝200×230 的原比例，不拉伸），不是 emoji 占位。
   这一档视口最矮（真机常见 375），四行地图怎么压都装不下，
   靠上面那条「贴顶排＋整屏可滚」兜底：滚一下就能看到「世界尽头」那一格。 */
@media (max-height:520px){
  #scrMenu{gap:4px;
    padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  #scrMenu h1{font-size:22px;letter-spacing:2px}
  #scrMenu .tagline{display:none}
  #scrMenu .chars{gap:8px}
  #scrMenu .chc{display:flex;align-items:center;gap:7px;width:auto;padding:2px 9px 2px 2px;border-radius:12px;border-width:3px}
  #scrMenu .chc canvas{width:38px;height:44px;flex:0 0 auto;border-radius:8px}
  #scrMenu .cn{margin-top:0;font-size:11px;white-space:nowrap}
  #scrMenu .mapTitle{font-size:11px}
  #scrMenu .mapWrap{height:196px;width:min(540px,94vw)}
  #scrMenu .spot{height:34px;font-size:9px;padding:0 4px;border-radius:10px}
  #scrMenu .spot i{font-size:9px}
  #scrMenu .spot span{font-size:15px}
  #scrMenu .gift{height:34px;font-size:8px}
  #scrMenu .gift span{font-size:14px}
  #scrMenu .big{height:42px;font-size:18px;padding:0 16px}
  #scrMenu .menuRow{font-size:12px}
  #scrMenu .best b{font-size:14px}
  #fitRow{gap:6px;margin:0 auto}
  #fitRow .fit{width:42px}
  #fitRow .fit canvas{width:31px;height:36px}
  #fitRow .fit .fn{font-size:9px}
}
/* 标题和副标题也可点击发声：小朋友点哪儿都有声音 */
#scrMenu h1,#scrMenu .tagline{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s}
#scrMenu h1:active,#scrMenu .tagline:active{transform:scale(.94)}
h1{margin:0;font-size:clamp(38px,8vw,86px);line-height:1;font-weight:900;letter-spacing:6px;
  background:linear-gradient(90deg,#aed581,#ffd54f,#4fc3f7);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 6px 0 rgba(0,0,0,.25)}
.tagline{color:#a9c0e8;font-size:clamp(15px,2.2vw,22px);font-weight:700;margin-top:-4px}
.chars{display:flex;gap:clamp(12px,3vw,34px);justify-content:center;margin:6px 0}
.chc{background:rgba(255,255,255,.07);border:4px solid transparent;border-radius:20px;padding:6px 12px 8px;
  width:clamp(126px,15vw,182px);cursor:pointer}
.chc.sel{border-color:#ffca28;background:rgba(255,202,40,.14)}
.chc canvas{width:100%;height:auto;display:block;border-radius:14px;background:#101a2e;touch-action:none}
.cn{color:#fff;font-weight:900;font-size:clamp(14px,2vw,20px);margin-top:6px}
.chc.sel .cn{color:#ffd54f}
/* 衣服条（4.12）：选角第二步，只给焕宸换衣服；整行 dim＝当前选的是爸爸 */
#fitRow{display:flex;align-items:flex-start;justify-content:center;flex-wrap:wrap;gap:8px;margin:8px auto 0}
#fitRow .tag{font-size:12px;color:#cfe8ff;align-self:center}
#fitRow .fit{position:relative;width:62px;cursor:pointer;text-align:center}
#fitRow .fit canvas{display:block;width:52px;height:60px;margin:0 auto;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.18);border-radius:10px}
#fitRow .fit .fn{font-size:11px;color:#bcd7f0;margin-top:2px}
#fitRow .fit.sel canvas{border-color:#ffd54f;box-shadow:0 0 8px rgba(255,213,79,.5)}
#fitRow .fit.sel .fn{color:#ffd54f}
#fitRow .fit.lock{cursor:default;filter:grayscale(1) brightness(.62)}
#fitRow .fit.lock::after{content:'🔒';position:absolute;top:3px;right:3px;font-size:13px}
#fitRow.dim{opacity:.45;pointer-events:none}
.menuRow{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;color:#9fb4d8;font-size:16px;font-weight:700}
.best b{color:#ffd54f;font-size:20px}
.emo{font-size:clamp(56px,11vw,104px);line-height:1}
.ttl{font-size:clamp(30px,6vw,58px);font-weight:900;color:#ffd54f;margin:0}
.subttl{font-size:clamp(16px,2.6vw,26px);color:#cfe0ff;font-weight:700;margin:0}
.btnRow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:6px}
/* ---------- 藏宝图小地图：像探险一样选战场 ---------- */
#mapBox{display:flex;flex-direction:column;gap:6px;align-items:center}
.mapTitle{color:#ffe082;font-weight:900;font-size:clamp(14px,2vw,20px)}
/* 藏宝图四行四格：一行一个篇章，卡片扁长、格与格之间只留一小段连线。
   flex:none 是刚需——.scr 是纵向 flex，地图超高时会被压缩，底行直接溢出羊皮纸。
   340＝四行按 12.5/37.5/62.5/87.5% 排：卡片高 58，行距 85，行间还剩 27 给连线和⭐。 */
.mapWrap{position:relative;flex:none;width:min(700px,92vw);height:340px;border-radius:16px;
  background:linear-gradient(160deg,#f0dfae,#dcc189 60%,#cfae74);
  border:3px dashed #8d6e63;box-shadow:inset 0 0 26px rgba(120,84,40,.35)}
.mapWrap svg{position:absolute;inset:0;width:100%;height:100%}

.spot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:0;width:clamp(96px,15.5vw,150px);height:58px;padding:0 6px;border-radius:14px;
  background:rgba(255,251,235,.9);border:3px solid #6d4c41;color:#4e342e;font-weight:900;
  font-size:clamp(10px,1.15vw,13px);line-height:1.15}
.spot i{font-style:normal;white-space:nowrap}
.spot span{font-size:clamp(19px,2.4vw,26px)}
/* 一格＝一关，左上角挂关号；终章格（第四行世界尽头）紫框；第一行第四格是第一章宝藏（打完发光，不能点） */
.spot .no{position:absolute;top:-9px;left:-6px;background:#6d4c41;color:#fff8e1;font-size:9px;font-weight:900;
  border-radius:8px;padding:1px 5px;letter-spacing:0}
.spot.fin{border-color:#7e57c2;background:#f3ecff}
.spot.fin .no{background:#7e57c2}
.gift{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:0;width:clamp(96px,15.5vw,150px);height:58px;border-radius:14px;color:#8d6e63;
  border:3px dashed #a1887f;background:rgba(255,251,235,.34);font-weight:900;font-size:clamp(9px,1.05vw,12px);
  line-height:1.15}
.gift span{font-size:clamp(17px,2.2vw,24px)}
.gift i{font-style:normal;white-space:nowrap}
/* 宝藏开过箱（存档 moday_gift）：虚线涂鸦→金色实框＋一枚 ✔，让小朋友看出这块已经领过了 */
.gift.opened{border-style:solid;border-color:#ffb300;background:rgba(255,244,214,.92);color:#6d4c41;
  box-shadow:0 0 0 3px rgba(255,179,0,.22)}
.gift.opened::after{content:'✔';position:absolute;top:-11px;right:-8px;font-size:15px;color:#2e7d32}
.spot.sel{border-color:#e65100;background:#fff3cd}
.spot.sel::before{content:'⭐';position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:16px}
.spot.lock{filter:grayscale(1);opacity:.55}
.spot.lock::after{content:'🔒';position:absolute;top:-12px;right:-10px;font-size:16px}
.spot.next{animation:spotP 1.2s ease-in-out infinite}
@keyframes spotP{0%,100%{box-shadow:0 0 0 3px rgba(230,81,0,.30)}50%{box-shadow:0 0 0 10px rgba(230,81,0,.06)}}
.spot.lock{cursor:not-allowed}
/* ---------- 打败 BOSS 庆祝结算：烟花继续放，面板浮现 ---------- */
#scrWin{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;transition:opacity .9s ease}
#scrWin.show{opacity:1;pointer-events:auto}
.winCard{background:rgba(8,14,28,.82);border:3px solid rgba(255,213,79,.5);border-radius:26px;
  padding:16px 34px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;
  box-shadow:0 12px 40px rgba(0,0,0,.5)}
.winCard .emo{font-size:clamp(44px,8vw,72px);line-height:1}
/* 宝藏那一行只在「刚开箱」的那局出现。本文件没有通用 .hide 规则，
   所以这行自带默认 display:none，靠 .show 显形（同 #scrWin 的写法）。 */
.winGift{display:none;color:#ffe082;border:2px solid rgba(255,213,79,.5);border-radius:14px;
  padding:3px 14px;background:rgba(255,213,79,.1)}
.winGift.show{display:block}

/* 关卡横幅 */
#banner{position:fixed;left:0;right:0;top:34%;z-index:8;text-align:center;pointer-events:none;
  font-size:clamp(34px,7vw,72px);font-weight:900;color:#ffd54f;letter-spacing:4px;
  text-shadow:0 4px 0 rgba(0,0,0,.45);opacity:0}
#banner.go{animation:bn 1.5s ease-out}
@keyframes bn{0%{opacity:0;transform:scale(.5)}18%{opacity:1;transform:scale(1.08)}
  32%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1.05)}}

/* 家长诊断面板：长按首页标题 0.8 秒打开。
   隔着一台摸不到的平板猜音频问题不如让它自己交代，所以把运行时真相直接打在屏幕上 */
#scrDiag{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
  background:rgba(4,8,18,.92);padding:14px}
#scrDiag.show{display:flex}
.diagCard{background:#0b1226;border:2px solid rgba(255,213,79,.4);border-radius:18px;padding:12px 16px;
  max-width:min(780px,96vw);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.diagCard .dt{color:#ffd54f;font-weight:900;font-size:20px}
#diagTxt{margin:0;color:#cfe0ff;font-size:13px;line-height:1.75;white-space:pre-wrap;word-break:break-all;
  font-family:ui-monospace,Consolas,monospace}
.dbRow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.dbRow .big{height:46px;font-size:17px;padding:0 16px}

/* ---------- 金币盘（HUD 左侧） ---------- */
#coinPlate b{color:#ffd54f}
/* ---------- 武器栏：战斗中底部一排，半透明不挡路 ---------- */
#wbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(6px + env(safe-area-inset-bottom));
  z-index:6;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;align-items:center;padding:6px 10px;border-radius:20px;
  /* max-content 关掉 shrink-to-fit：绝对定位 + left:50% 时浏览器只给半屏可用宽，武器买多了就折行，把行军路线压掉一两排 */
  background:rgba(8,14,28,.42);border:2px solid rgba(255,255,255,.14);width:-webkit-max-content;width:max-content;max-width:96vw;max-height:44vh;overflow:auto}
#wbar.hide{display:none}
.wb{width:clamp(40px,6vw,52px);height:clamp(40px,6vw,52px);border-radius:14px;font-size:clamp(18px,2.7vw,25px);
  line-height:1;flex:0 0 auto;padding:0;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.22);color:#fff;position:relative}
/* 手绘 SVG 图标（激光枪/双飞镖）跟着字号缩放，和 emoji 一样占一格 */
.wb svg,.wi svg{width:1em;height:1em;display:block}
.wb:active{transform:translateY(2px)}
.wb.sel{border-color:#ffd54f;background:rgba(255,202,40,.28)}
.wb.wshop{border-color:rgba(255,213,79,.6);background:rgba(255,202,40,.18)}  /* 武器商店入口：金色描边一眼认出 */
.wb.empty{opacity:.35}
.wb .cnt{position:absolute;right:3px;bottom:1px;font-size:12px;font-weight:900;color:#ffd54f}
.wsep{width:2px;height:36px;border-radius:2px;background:rgba(255,255,255,.18);flex:0 0 auto}
/* ---------- 武器库商店 ---------- */
#btnArsenal b{color:#ffd54f}

<script>
/* =========================================================
   《我的末日》第 1 个小游戏：方块人大战方块僵尸
   已锁定：主角 焕宸 · 迷彩小战士 / 僵尸 经典绿 / 武器 星星飞镖
           特效 噗！一团烟 / 背景 发光森林(可解锁) / 音效 咚咚卡通音
   ========================================================= */

/* ---------- 逻辑尺寸 ---------- */
const GW=960, GH=540;              // 游戏逻辑画布
const W=400, H=232, GROUND=196;    // 背景绘制空间（沿用第6步）
const BS=Math.max(GW/W, GH/H);     // cover 缩放
const BX=(GW-W*BS)/2, BY=(GH-H*BS)/2;
/* ---------- 5 条路：占下半屏，每条路只能打这条路的僵尸 ---------- */
const LANES=5;
const LANE_TOP=Math.round(GH*0.47), LANE_BOT=GH-6;   // 254 ~ 534
const LANE_H=(LANE_BOT-LANE_TOP)/LANES;              // 每条路 56px
function laneY(i){return LANE_TOP+LANE_H*(i+0.5);}   // 第 i 条路的脚底 y
function laneOf(y){return Math.max(0,Math.min(LANES-1,Math.round((y-LANE_TOP)/LANE_H-0.5-1e-9)));}  // 正中间偏向上面那条路，手感对称
const BAND_TOP=LANE_TOP, BAND_BOT=LANE_BOT;          // 纵深插值范围
const XMIN=90, XMAX=GW*0.52;       // 主角左右范围（左半屏安全区）
/* 守护红旗：僵尸走到最左边就拔掉一面旗＝扣一颗心 */
const BASE_X=70;                   // 僵尸身体前沿越过这条线＝拔旗
const FLAG_X=44;                   // 旗杆 x：每条路一面旗，被拔后星星落下来变成新旗插回
const FLAGS=[0,1,2,3,4].map(i=>{
  const y=laneY(i);
  return {y,k:0.78+(y-LANE_TOP)/(LANE_BOT-LANE_TOP)*0.34,st:0,t:0,sy:0,svy:0};
});
function resetFlags(){for(const f of FLAGS){f.st=0;f.t=0;}}

const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const bgc=document.createElement('canvas');
bgc.width=W;bgc.height=H;
const bgx=bgc.getContext('2d');

/* ---------- 通用绘制 ---------- */
function rrect(ctx,x,y,w,h,r){
  r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function star(ctx,x,y,r,c,rot){
  ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);ctx.fillStyle=c;ctx.beginPath();
  for(let i=0;i<10;i++){
    const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r*0.45:r;
    ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);
  }
  ctx.closePath();ctx.fill();ctx.restore();
}
/* 四角闪星（十字星光）：快快飞镖的弹体，和五角星的星星飞镖明显区分 */
function spark4(ctx,x,y,r,rot,c){
  ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);ctx.fillStyle=c;ctx.beginPath();
  for(let i=0;i<8;i++){
    const a=-Math.PI/2+i*Math.PI/4, rr=i%2?r*0.3:r;
    ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);
  }
  ctx.closePath();ctx.fill();ctx.restore();
}
function updParts(a,dt){
  for(let i=a.length-1;i>=0;i--){
    const p=a[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.g!==0)p.vy+=300*dt;
    if(p.vr)p.rot=(p.rot||0)+p.vr*dt;
    /* 会缩小的粒子（gr 为负，比如火箭尾焰）缩到 0 就退休，别让它变成负数：
       半径为负时 ctx.arc 会抛 IndexSizeError，异常穿出去会把 render() 整帧打断，
       后果是 ctx.restore() 被跳过——震屏位移和 globalAlpha 一层层累积下来，画面就是「闪」。 */
    if(p.gr){p.r+=p.gr*dt;if(p.r<=0){a.splice(i,1);continue;}}
    if(p.t>=p.life)a.splice(i,1);
  }
}
function drawParts(ctx,a){
  for(const p of a){
    const al=Math.max(0,1-p.t/p.life);
    ctx.globalAlpha=al;
    if(p.kind==='ring'){
      ctx.strokeStyle=p.c;ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.stroke();
    }else if(p.kind==='smoke'){
      ctx.fillStyle=p.c;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
    }else if(p.kind==='star'){
      star(ctx,p.x,p.y,p.r,p.c,p.rot||0);
    }else if(p.kind==='conf'){
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot||0);
      ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);   // 转着飘的小彩纸
      ctx.restore();
    }else if(p.kind==='fwR'){                                    // 烟花火箭：小亮点拖着尾
      ctx.globalAlpha=al*0.6;ctx.strokeStyle=p.c;ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(p.x,p.y+13);ctx.lineTo(p.x,p.y);ctx.stroke();
      ctx.globalAlpha=al;ctx.fillStyle='#ffffff';
      ctx.beginPath();ctx.arc(p.x,p.y,2.4,0,7);ctx.fill();
    }else if(p.kind==='fwS'){                                    // 烟花火星：外圈光晕＋内亮点
      ctx.globalAlpha=al*0.32;ctx.fillStyle=p.c;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*2.1,0,7);ctx.fill();
      ctx.globalAlpha=al;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
    }else{
      ctx.fillStyle=p.c;ctx.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r);
    }
  }
  ctx.globalAlpha=1;
}
const SMOKE_COLORS=['#eceff1','#cfd8dc','#b0bec5'];
/* 噗！一团烟（k = 尺寸倍率，游戏里放大用） */
function puffFX(a,x,y,k){
  k=k||1;
  a.push({kind:'ring',x,y,vx:0,vy:0,life:0.24,t:0,c:'#ffffff',r:7*k,gr:120*k,g:0});
  for(let i=0;i<9;i++){
    const an=Math.random()*Math.PI*2,v=(22+Math.random()*46)*k;
    a.push({kind:'smoke',x,y,vx:Math.cos(an)*v,vy:Math.sin(an)*v-14*k,life:0.55+Math.random()*0.3,t:0,
            c:SMOKE_COLORS[i%3],r:(5+Math.random()*4)*k,gr:26*k,g:0});
  }
  for(let i=0;i<5;i++){
    const an=Math.random()*Math.PI*2,v=(50+Math.random()*60)*k;
    a.push({kind:'star',x,y,vx:Math.cos(an)*v,vy:Math.sin(an)*v-40*k,life:0.5,t:0,
            c:'#fff176',r:3.4*k,rot:Math.random()*6,vr:(Math.random()-0.5)*12});
  }
}
/* 放彩花：从屏幕顶上撒一拨转着飘的小彩纸 */
const CONF_COLORS=['#ff5252','#ffd740','#69f0ae','#40c4ff','#ff4081','#e040fb'];
function confetti(n){
  for(let i=0;i<n;i++){
    G.ps.push({kind:'conf',x:Math.random()*GW,y:-20-Math.random()*70,
      vx:(Math.random()-0.5)*40,vy:100+Math.random()*130,life:2.6+Math.random()*1.4,t:0,
      c:CONF_COLORS[i%CONF_COLORS.length],r:7+Math.random()*7,rot:Math.random()*6,
      vr:(Math.random()-0.5)*10,g:0});
  }
}
/* 放烟花：先升一颗火箭，到高度炸成一圈火星 */
const FW_COLORS=['#ff5252','#ffd740','#69f0ae','#40c4ff','#ff4081','#e040fb','#fff176'];
function launchFw(){
  G.ps.push({kind:'fwR',x:GW*0.12+Math.random()*GW*0.76,y:GH*0.88,
    vx:(Math.random()-0.5)*26,vy:-(300+Math.random()*150),ty:GH*0.10+Math.random()*GH*0.34,
    life:3,t:0,c:FW_COLORS[Math.floor(Math.random()*FW_COLORS.length)],g:0});
}
function boomFw(p){
  G.ps.push({kind:'ring',x:p.x,y:p.y,vx:0,vy:0,life:0.45,t:0,c:p.c,r:6,gr:240,g:0});
  const n=22+Math.floor(Math.random()*10);
  for(let i=0;i<n;i++){
    const an=i/n*Math.PI*2+Math.random()*0.25,v=80+Math.random()*130;
    G.ps.push({kind:'fwS',x:p.x,y:p.y,vx:Math.cos(an)*v,vy:Math.sin(an)*v,
      life:0.7+Math.random()*0.7,t:0,c:i%3?p.c:'#ffffff',r:2.2+Math.random()*1.8,g:0.35});
  }
  sfx('fw');
}
function drawMoon(ctx,x,y,r){
  ctx.save();ctx.globalAlpha=.85;ctx.fillStyle='#fff9c4';
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  ctx.globalAlpha=.16;ctx.beginPath();ctx.arc(x,y,r*2.1,0,7);ctx.fill();
  ctx.globalAlpha=.22;ctx.fillStyle='#e6d9a8';
  ctx.beginPath();ctx.arc(x-r*0.3,y-r*0.2,r*0.22,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(x+r*0.28,y+r*0.3,r*0.16,0,7);ctx.fill();
  ctx.restore();
}
function vg(ctx){
  const g=ctx.createRadialGradient(W/2,H/2,58,W/2,H/2,250);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.34)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

/* =========================================================
   4.12 衣服层：三套皮肤（山谷游侠 A／裂谷星铠 B／星核机甲 C）
   从「我的末日-新主角装扮-三版挑选.html」逐字移植，只改接口：
   · 签名统一成 (ctx,x,y,s,sk,t,fire)，和 CHARS[*].draw 一模一样；
   · sk 不接色板——每套的配色画在函数内部（整身重绘，不是换色层）；
   · 挑选页的 rig(t,act) 换成 rigRun(t,fire)：主游戏永远按走路节拍动，
     火光由第 7 参 fire 驱动（同 drawSoldier 的 h.fire 口径）；
   · 挑选页里 RM?静态:动画 的三元一律取动画分支。
   纯外观：数值、枪、弹道全都不碰，衣服只给焕宸穿，爸爸保持原造型。
   ========================================================= */
function ell(ctx,x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fill();}
function rigRun(t,fire){
  const R={bob:-Math.abs(Math.sin(t*7.4))*2.4,
    liftL:Math.max(0,Math.sin(t*7.4))*4.2,liftR:Math.max(0,-Math.sin(t*7.4))*4.2,
    sway:1,fire:fire||0,blink:Math.sin(t*1.6+1)>0.985};
  R.bob-=R.fire*1.2;
  return R;
}
function eyes(ctx,u,R){
  ctx.fillStyle='#2b2b2b';
  if(R.blink){ctx.fillRect(-5.5*u,-66.5*u,4*u,1.4*u);ctx.fillRect(2*u,-66.5*u,4*u,1.4*u);}
  else{ell(ctx,-3.5*u,-66*u,1.9*u,1.9*u);ell(ctx,4*u,-66*u,1.9*u,1.9*u);}
}
function blush(ctx,u){
  ctx.fillStyle='rgba(244,143,117,.55)';
  ell(ctx,-7*u,-61*u,2*u,2*u);ell(ctx,7.5*u,-61*u,2*u,2*u);
}
function smile(ctx,u){
  ctx.strokeStyle='#a1503c';ctx.lineWidth=1.6*u;ctx.lineCap='round';
  ctx.beginPath();ctx.arc(1.2*u,-62*u,3.4*u,Math.PI*0.16,Math.PI*0.84);ctx.stroke();
}
function gun(ctx,u,R,c1,c2){
  ctx.fillStyle=c1;rrect(ctx,12*u,-49*u,20*u,3.2*u,1.6*u);ctx.fill();
  ctx.fillStyle=c2;ctx.fillRect(15*u,-45.5*u,3.5*u,6*u);
  const f=R.fire;
  if(f>0){
    ctx.save();ctx.globalAlpha=Math.min(1,f)*0.55;
    ctx.shadowColor='#fff176';ctx.shadowBlur=14*u;ctx.fillStyle='#fff176';
    ell(ctx,33.5*u,-47.4*u,6*u,6*u);ctx.restore();
  }
  star(ctx,33.5*u,-47.4*u,5.5*u+f*1.6*u,'#ffd54f');
}
function arms(ctx,u,bodyC,toneC){
  ctx.fillStyle=bodyC;rrect(ctx,-13.5*u,-52*u,4.5*u,14*u,2.2*u);ctx.fill();
  rrect(ctx,5*u,-50*u,11*u,5*u,2.2*u);ctx.fill();
  ctx.fillStyle=toneC;rrect(ctx,14*u,-51*u,5.5*u,6.5*u,2.2*u);ctx.fill();
}

const RA={cloak:'#6b7f63',cloakDark:'#4f6152',body:'#7d8f6b',bodyDark:'#5d6f4f',
  leg:'#5d6f4f',boot:'#4e342e',leather:'#4e342e',leatherLt:'#6d4c41',

function drawRanger(ctx,x,y,s,sk,t,fire){
  var u=s/84,R=rigRun(t,fire);
  ctx.save();ctx.translate(x,y);

  ctx.quadraticCurveTo(-6*u+hem,-21*u,0,-25.5*u+hem*0.4);
  ctx.quadraticCurveTo(6.5*u,-28.5*u,10*u+hem*0.5,-31*u);

  ctx.fillStyle=RA.cloak;

  ctx.bezierCurveTo(-14.5*u,-48.5*u,-15.5*u,-37.5*u,-12.5*u+hem,-27*u);
  ctx.quadraticCurveTo(-5.5*u+hem,-23.5*u,0.5*u,-27.5*u+hem*0.4);
  ctx.quadraticCurveTo(6*u,-30.5*u,9.2*u+hem*0.5,-32.5*u);
  ctx.bezierCurveTo(10*u,-41*u,9*u,-49*u,7.5*u,-54*u);
  ctx.closePath();ctx.fill();
  /* 下摆深色边 + 米色缝线 */
  ctx.strokeStyle=RA.cloakDark;ctx.lineWidth=2.6*u;ctx.lineJoin='round';ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-12.5*u+hem,-27*u);
  ctx.quadraticCurveTo(-5.5*u+hem,-23.5*u,0.5*u,-27.5*u+hem*0.4);
  ctx.quadraticCurveTo(6*u,-30.5*u,9.2*u+hem*0.5,-32.5*u);
  ctx.stroke();
  ctx.strokeStyle=RA.cream;ctx.lineWidth=1*u;ctx.setLineDash([2.4*u,2.2*u]);

  ctx.fillStyle=RA.cloak;rrect(ctx,-8.5*u,-58.5*u,17*u,3.2*u,1.6*u);ctx.fill();

  rrect(ctx,-9*u,-15*u-R.liftL*u,7*u,2.6*u,1.2*u);ctx.fill();
  rrect(ctx,2*u,-15*u-R.liftR*u,7*u,2.6*u,1.2*u);ctx.fill();

  rrect(ctx,1*u,-5*u-R.liftR*u,9*u,5*u,2*u);ctx.fill();
  /* 上身 */

  ctx.fillStyle=RA.bodyDark;rrect(ctx,-10*u,-32*u,20*u,9*u,3*u);ctx.fill();

  ctx.fillStyle=RA.leather;rrect(ctx,3.5*u,-33*u,7.5*u,2.4*u,1.2*u);ctx.fill();

  ctx.fillStyle=RA.leather;ctx.fillRect(-10*u,-30.5*u,20*u,4.2*u);

  ctx.fillStyle=RA.strap;rrect(ctx,-11.6*u,-76.5*u,23.2*u,4.4*u,2*u);ctx.fill();

/* ---------- B 版：裂谷星铠（银色铠甲 + 发光星星 + 粉紫披风） ---------- */
const RF={cape:'#6a3a99',capeEdge:'#ff6ea1',plate:'#cfd8e8',plateDark:'#9aa8c6',
  inner:'#2a2f45',boot:'#232838',tone:'#ffe0b2',cyan:'#7ee8ff',star:'#ffd54f',helm:'#cfd8e8'};
function drawRift(ctx,x,y,s,sk,t,fire){
  var u=s/84,R=rigRun(t,fire);
  var gp=0.55+0.45*Math.sin(t*3.1);
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.25)';ell(ctx,0,1,15*u,3.4*u);
  ctx.translate(0,R.bob*u);
  /* 能量披风（下摆到膝盖上方，小腿和靴子露出来） */
  var sw=2.6+R.sway*2, hem=-sw*u;
  ctx.fillStyle='#3f1f63';
  ctx.beginPath();
  ctx.moveTo(-8.6*u,-53*u);
  ctx.bezierCurveTo(-15*u,-42*u,-16*u,-28*u,-12.4*u+hem,-18*u);
  ctx.quadraticCurveTo(-4.4*u+hem,-13.4*u,0.6*u,-18*u+hem*0.4);
  ctx.quadraticCurveTo(6.5*u,-21.6*u,9.6*u+hem*0.5,-23.6*u);
  ctx.bezierCurveTo(10.6*u,-35*u,9.4*u,-46*u,8.6*u,-53*u);
  ctx.closePath();ctx.fill();
  ctx.fillStyle=RF.cape;
  ctx.beginPath();
  ctx.moveTo(-8*u,-53*u);
  ctx.bezierCurveTo(-14*u,-42*u,-15*u,-26*u,-11.5*u+hem,-20*u);
  ctx.quadraticCurveTo(-4*u+hem,-15.5*u,0.5*u,-20*u+hem*0.4);
  ctx.quadraticCurveTo(6*u,-23.5*u,9*u+hem*0.5,-25.5*u);
  ctx.bezierCurveTo(10*u,-34*u,9*u,-46*u,8*u,-53*u);
  ctx.closePath();ctx.fill();
  /* 披风上的青色星纹 */
  ctx.globalAlpha=0.5+0.4*gp;ctx.fillStyle=RF.cyan;
  star(ctx,-7.5*u,-38*u,1.7*u,RF.cyan);star(ctx,-4.5*u,-27*u,1.3*u,RF.cyan);
  star(ctx,3*u,-32*u,1.4*u,RF.cyan);
  ctx.globalAlpha=1;
  ctx.globalAlpha=0.5+0.5*gp;ctx.fillStyle=RF.capeEdge;
  ctx.beginPath();
  ctx.moveTo(-11.5*u+hem,-20*u);
  ctx.quadraticCurveTo(-4*u+hem,-15.5*u,0.5*u,-20*u+hem*0.4);
  ctx.quadraticCurveTo(6*u,-23.5*u,9*u+hem*0.5,-25.5*u);
  ctx.lineTo(9.6*u+hem*0.5,-28.5*u);
  ctx.quadraticCurveTo(6*u,-26.5*u,0.4*u,-23*u+hem*0.4);
  ctx.quadraticCurveTo(-4.4*u+hem,-18.5*u,-11*u+hem,-23*u);
  ctx.closePath();ctx.fill();ctx.globalAlpha=1;
  for(var i=0;i<3;i++){
    var p=((t*0.7+i*0.33)%1);
    ctx.globalAlpha=(1-p)*0.55;ctx.fillStyle=RF.capeEdge;
    ell(ctx,-6*u+hem*p-i*2*u+p*3*u,-21*u-p*13*u,0.9*u,0.9*u);
  }
  ctx.globalAlpha=1;
  /* 腿 */
  ctx.fillStyle=RF.inner;
  rrect(ctx,-9*u,-24*u,7*u,20*u-R.liftL*u,2.5*u);ctx.fill();

  /* 胸口菱形红宝石：第四章主色，一亮一暗 */

  ctx.beginPath();ctx.moveTo(0,-49.5*u);ctx.lineTo(4.2*u,-45*u);ctx.lineTo(0,-40.5*u);ctx.lineTo(-4.2*u,-45*u);

  ctx.closePath();ctx.fill();
  /* 赤金肩甲（亮金面 + 深金边 + 下沿暗条） */

  rrect(ctx,7.6*u,-56*u,7.6*u,9*u,3.4*u);ctx.fill();

  rrect(ctx,7.6*u,-73.5*u,3.4*u,4.5*u,1.6*u);ctx.fill();
  /* 三尖赤金王冠：先出三个尖，再压住一圈冠带 */
  ctx.fillStyle=KG.gold;
  ctx.beginPath();
  ctx.moveTo(-11.2*u,-81.2*u);ctx.lineTo(-8*u,-85.4*u);ctx.lineTo(-4.6*u,-81.4*u);
  ctx.lineTo(0,-86.2*u);ctx.lineTo(4.6*u,-81.4*u);ctx.lineTo(8*u,-85.4*u);ctx.lineTo(11.2*u,-81.2*u);

  ctx.fillStyle=(Math.sin(t*3)>0)?KG.gem:'#ff6f91';
  ell(ctx,0,-78.6*u,1.9*u,1.9*u);ctx.restore();

  ell(ctx,-8*u,-85.4*u,1*u,1*u);ell(ctx,0,-86.2*u,1.1*u,1.1*u);ell(ctx,8*u,-85.4*u,1*u,1*u);
  /* 脸 */
  eyes(ctx,u,R);blush(ctx,u);smile(ctx,u);
  ctx.restore();
}

function drawZombieV(ctx,x,y,s,zk,t,ph){
  const u=s/58;

  ctx.save();ctx.translate(x,y+bob);ctx.rotate(rot);
  ctx.fillStyle='rgba(0,0,0,.25)';
  ctx.beginPath();ctx.ellipse(0,1,16*u,3.6*u,0,0,7);ctx.fill();
  const bw=13;
  ctx.fillStyle=zk.cloth;
  rrect(ctx,(-bw+2)*u,-18*u,9*u,18*u-liftL,2*u);ctx.fill();
  rrect(ctx,(bw-11)*u,-18*u,9*u,18*u-liftR,2*u);ctx.fill();
  ctx.fillStyle=zk.skinDark;
  rrect(ctx,(-bw+1)*u,-4.5*u-liftL,10*u,4.5*u,1.6*u);ctx.fill();
  rrect(ctx,(bw-12)*u,-4.5*u-liftR,10*u,4.5*u,1.6*u);ctx.fill();
  if(zk.patch){
    ctx.fillStyle=zk.patch;
    rrect(ctx,(-bw+2.6)*u,-13.5*u-liftL,6.8*u,6*u,1.6*u);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=0.8*u;
    ctx.beginPath();
    ctx.moveTo((-bw+2.6)*u,-11.4*u-liftL);ctx.lineTo((-bw+9.4)*u,-11.4*u-liftL);
    ctx.moveTo((-bw+2.6)*u,-9*u-liftL);ctx.lineTo((-bw+9.4)*u,-9*u-liftL);
    ctx.stroke();
  }
  const sw=Math.sin(ph)*1.6*u;
  ctx.fillStyle=zk.skin;
  rrect(ctx,(-bw-17)*u,-36*u+sw,19*u,7.5*u,3.5*u);ctx.fill();
  rrect(ctx,(-bw-15)*u,-28*u-sw,17*u,7.5*u,3.5*u);ctx.fill();
  ctx.fillStyle=zk.skinDark;
  rrect(ctx,(-bw-21)*u,-37*u+sw,6*u,9*u,2.4*u);ctx.fill();
  rrect(ctx,(-bw-19)*u,-29*u-sw,6*u,9*u,2.4*u);ctx.fill();
  ctx.fillStyle=zk.skin;
  rrect(ctx,-bw*u,-38*u,2*bw*u,21*u,4.5*u);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.12)';
  rrect(ctx,-bw*u,-26*u,2*bw*u,9*u,3.5*u);ctx.fill();
  ctx.fillStyle=zk.skin;
  rrect(ctx,-12*u,-56*u,24*u,19*u,5*u);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.1)';
  rrect(ctx,5*u,-55*u,7*u,18*u,4*u);ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(-5.5*u,-49*u,4.4*u,0,7);ctx.arc(4.5*u,-49.6*u,3.6*u,0,7);ctx.fill();
  ctx.fillStyle=zk.pupil;
  ctx.beginPath();ctx.arc(-6.6*u,-49*u,2.2*u,0,7);ctx.arc(3.6*u,-49.6*u,1.8*u,0,7);ctx.fill();
  ctx.fillStyle='#3a2b20';
  rrect(ctx,-7*u,-43*u,14*u,5.5*u,2*u);ctx.fill();
  ctx.fillStyle='#f1f8e9';
  for(let i=0;i<4;i++)ctx.fillRect((-6+i*3.4)*u,-43*u,2*u,2.6*u);
  if(zk.tongue){
    const tl=7*u+Math.sin(ph*1.3)*1.2*u, wag=Math.sin(ph*0.9)*0.16;
    ctx.save();ctx.translate(1.5*u,-38.5*u);ctx.rotate(wag);
    ctx.fillStyle='#ef9a9a';
    rrect(ctx,-2.5*u,0,5*u,tl,2.4*u);ctx.fill();
    ctx.fillStyle='#e57373';
    rrect(ctx,-0.7*u,1.6*u,1.4*u,Math.max(1*u,tl-3.2*u),0.7*u);ctx.fill();
    ctx.restore();
  }
  if(zk.hat==='leaf'){                          // 森林 BOSS：头顶三片绿叶＋小红果
    ctx.fillStyle='#43a047';
    ctx.beginPath();ctx.moveTo(-9*u,-55*u);ctx.lineTo(-5*u,-66*u);ctx.lineTo(-1*u,-55*u);ctx.fill();
    ctx.beginPath();ctx.moveTo(-2*u,-55*u);ctx.lineTo(2*u,-69*u);ctx.lineTo(6*u,-55*u);ctx.fill();
    ctx.beginPath();ctx.moveTo(5*u,-55*u);ctx.lineTo(9*u,-64*u);ctx.lineTo(12*u,-55*u);ctx.fill();
    ctx.fillStyle='#e53935';
    ctx.beginPath();ctx.arc(-3.5*u,-58*u,1.6*u,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(7*u,-57*u,1.4*u,0,7);ctx.fill();
  }else if(zk.hat==='helmet'){                  // 城市 BOSS：黄色安全帽
    ctx.fillStyle='#ff8f00';
    rrect(ctx,-13*u,-63*u,26*u,8*u,3*u);ctx.fill();
    rrect(ctx,-3*u,-67*u,6*u,5*u,2*u);ctx.fill();
    ctx.fillStyle='#ffa726';
    ctx.fillRect(-15*u,-56.6*u,30*u,2.6*u);

    ctx.fillStyle='#b71c1c';
    rrect(ctx,-12.5*u,-61*u,25*u,6*u,2.5*u);ctx.fill();
    ctx.beginPath();ctx.arc(12.5*u,-58*u,2.8*u,0,7);ctx.fill();
    ctx.fillRect(11.5*u,-56*u,3*u,6*u);

/* ---------- 第二章丧尸小兵：全直角 + 黑眼窝发光方瞳（焕宸从五版里选的） ----------
   和第一章的圆角绿僵尸彻底分开：方块身体、黑眼窝里一盏方灯、嘴里一排方块牙、绝不吐舌头。
   键名与 KIND 表一一对应；kind 决定这一版独有的外形记号：
   notch 头顶被咬掉一角 / oneeye 超大眼窝＋头顶木棍 / hole 胸口方洞露骨头＋断臂 /
   ice 一身白冰晶＋冻紧的眉毛 / fire 炭灰身体＋头顶阶梯火苗＋走路掉火星 */
const KIND_SK={
  notch :{kind:'notch', skin:'#689f38', skinDark:'#33691e', cloth:'#4e342e', clothDark:'#3b2420',
          socket:'#1f1608', glow:'#e6ee9c', tooth:'#ece5d8', teeth:'gap'},
  oneeye:{kind:'oneeye',skin:'#8d6e63', skinDark:'#5d4037', cloth:'#37474f', clothDark:'#263238',
          socket:'#1f1608', glow:'#ffe0b2', tooth:'#ece5d8', teeth:'gap', patch:'#455a64', stick:'#a1887f'},
  hole  :{kind:'hole',  skin:'#a5d6a7', skinDark:'#81c784', cloth:'#455a64', clothDark:'#37474f',
          socket:'#1f1608', glow:'#c5e1a5', tooth:'#ece5d8', teeth:'none'},
  ice   :{kind:'ice',   skin:'#90caf9', skinDark:'#42a5f5', cloth:'#1565c0', clothDark:'#0d47a1',
          socket:'#0d2b45', glow:'#f8fdff', tooth:'#e1f5fe', teeth:'ice', brow:'#1565c0'},
  fire  :{kind:'fire',  skin:'#616161', skinDark:'#424242', cloth:'#3e2723', clothDark:'#2b1a16',
          socket:'#1b1110', glow:'#ffee58', tooth:'#ff7043', teeth:'fire'}
};
function drawBlockZombie(ctx,x,y,s,zk,t,ph){
  const u=s/58;
  const bob=Math.sin(ph)*1.4*u, rot=Math.sin(ph)*0.05;
  const liftL=Math.max(0,Math.sin(ph))*3.4*u, liftR=Math.max(0,-Math.sin(ph))*3.4*u;
  const sw=Math.sin(ph)*1.6*u;
  ctx.save();ctx.translate(x,y+bob);ctx.rotate(rot);
  /* 地面影子 */
  ctx.fillStyle='rgba(0,0,0,.25)';
  ctx.beginPath();ctx.ellipse(0,1,16*u,3.6*u,0,0,7);ctx.fill();
  /* 火星（只有火焰丧尸）：脚边两个小方块往下掉 */
  if(zk.kind==='fire'){
    for(let i=0;i<2;i++){
      const p=(t*0.7+i*0.5)%1;
      ctx.globalAlpha=1-p;
      ctx.fillStyle=i?'#ffb300':'#ff8a65';
      ctx.fillRect((13-i*26)*u,-1*u+p*9*u,2.2*u,2.2*u);
    }
    ctx.globalAlpha=1;
  }
  /* 腿：后腿压暗一档，前腿亮；全是直角 */
  ctx.fillStyle=zk.clothDark;ctx.fillRect(2*u,-18*u,9*u,18*u-liftR);
  ctx.fillStyle=zk.skinDark;ctx.fillRect(1*u,-5*u-liftR,10*u,5*u);
  ctx.fillStyle='rgba(0,0,0,.15)';ctx.fillRect(1*u,-5*u-liftR,10*u,5*u);
  ctx.fillStyle=zk.cloth;ctx.fillRect(-11*u,-18*u,9*u,18*u-liftL);
  ctx.fillStyle=zk.skinDark;ctx.fillRect(-12*u,-5*u-liftL,10*u,5*u);
  /* 手臂：前平举（僵尸招牌姿势），破洞版一只手断成两截 */
  if(zk.kind==='hole'){
    ctx.fillStyle=zk.skin;
    ctx.fillRect(-28*u,-28*u-sw,17*u,7.5*u);
    ctx.fillRect(-26*u,-36*u+sw,14*u,7.5*u);
    ctx.fillStyle=zk.skinDark;
    ctx.fillRect(-32*u,-29*u-sw,6*u,9*u);
    ctx.fillRect(-35*u,-35.5*u+sw,7*u,7*u);            // 悬空的手方块
  }else{
    ctx.fillStyle=zk.skin;
    ctx.fillRect(-28*u,-28*u-sw,17*u,7.5*u);
    ctx.fillRect(-30*u,-36*u+sw,19*u,7.5*u);
    ctx.fillStyle=zk.skinDark;
    ctx.fillRect(-32*u,-29*u-sw,6*u,9*u);
    ctx.fillRect(-34*u,-37*u+sw,6*u,9*u);
  }
  /* 身体 */
  ctx.fillStyle=zk.skin;ctx.fillRect(-13*u,-38*u,26*u,21*u);
  ctx.fillStyle='rgba(0,0,0,.12)';ctx.fillRect(-13*u,-26*u,26*u,9*u);
  /* 身体特征 */
  if(zk.kind==='oneeye'&&zk.patch){                   // 方形布补丁（无圆角、无缝线）
    ctx.fillStyle=zk.patch;ctx.fillRect(-9.5*u,-32*u,9*u,7*u);
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(-9.5*u,-32*u,9*u,1.4*u);
  }
  if(zk.kind==='hole'){                               // 胸口方洞 + 三根骨头
    ctx.fillStyle='#2b332b';ctx.fillRect(-4*u,-33*u,10*u,8*u);
    ctx.fillStyle='#eceff1';
    ctx.fillRect(-3.4*u,-32.2*u,8.8*u,1.7*u);
    ctx.fillRect(-3.4*u,-29.4*u,8.8*u,1.7*u);
    ctx.fillRect(-3.4*u,-26.6*u,8.8*u,1.7*u);
  }
  if(zk.kind==='ice'){                                // 白色方冰晶
    ctx.fillStyle=zk.tooth;
    ctx.fillRect(-11.5*u,-34*u,4*u,4*u);
    ctx.fillRect(5*u,-23*u,3.6*u,3.6*u);
    ctx.fillRect(-24*u,-33*u,3.4*u,3.4*u);
  }
  /* 头：缺牙咬右上角、破洞少左上角，其余整块 */
  if(zk.kind==='notch'){
    ctx.fillStyle=zk.skin;
    ctx.fillRect(-12*u,-56*u,18*u,19*u);
    ctx.fillRect(6*u,-50*u,6*u,13*u);
    ctx.fillStyle='rgba(0,0,0,.1)';ctx.fillRect(6*u,-50*u,6*u,13*u);
    ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(6*u,-50*u,6*u,1.8*u);
  }else if(zk.kind==='hole'){
    ctx.fillStyle=zk.skin;
    ctx.fillRect(-12*u,-52*u,24*u,15*u);
    ctx.fillRect(-5*u,-56*u,17*u,4*u);
    ctx.fillStyle='rgba(0,0,0,.1)';
    ctx.fillRect(5*u,-52*u,7*u,15*u);
    ctx.fillRect(5*u,-56*u,7*u,4*u);
  }else{
    ctx.fillStyle=zk.skin;ctx.fillRect(-12*u,-56*u,24*u,19*u);
    ctx.fillStyle='rgba(0,0,0,.1)';ctx.fillRect(5*u,-55*u,7*u,18*u);
  }
  /* 眼睛：黑眼窝 + 发光方瞳（和旧僵尸的白眼球彻底分开） */
  if(zk.kind==='oneeye'){                             // 一只超大眼窝
    ctx.fillStyle=zk.socket;ctx.fillRect(-11.5*u,-52*u,12*u,9.5*u);
    ctx.fillStyle=zk.glow;ctx.fillRect(-9*u,-49.6*u,6*u,4.6*u);
    ctx.fillStyle=zk.socket;ctx.fillRect(3*u,-48.5*u,4.6*u,4.6*u);
    ctx.fillStyle=zk.glow;ctx.fillRect(4*u,-47.2*u,2.4*u,2.2*u);
  }else if(zk.kind==='fire'){                         // 整格发黄光的眼
    ctx.fillStyle=zk.socket;
    ctx.fillRect(-10.6*u,-51.6*u,9.2*u,8.2*u);
    ctx.fillRect(1*u,-50*u,7.5*u,7*u);
    ctx.fillStyle=zk.glow;
    ctx.fillRect(-10*u,-51*u,8*u,7*u);
    ctx.fillRect(1.5*u,-49.5*u,6.5*u,6*u);
  }else{
    ctx.fillStyle=zk.socket;
    ctx.fillRect(-10*u,-51*u,8*u,7*u);
    ctx.fillRect(1.5*u,-49.5*u,6.5*u,6*u);
    ctx.fillStyle=zk.glow;
    ctx.fillRect(-8.4*u,-49.4*u,4*u,3.4*u);
    ctx.fillRect(2.6*u,-48*u,3.2*u,2.8*u);
  }
  if(zk.kind==='ice'){                                // 冻紧的眉毛＋额上一块冰
    ctx.fillStyle=zk.brow;
    ctx.fillRect(-10.5*u,-53.6*u,9*u,2*u);
    ctx.fillRect(1*u,-52.2*u,7.5*u,2*u);
    ctx.fillStyle=zk.tooth;ctx.fillRect(0,-55.5*u,4*u,3.2*u);
  }
  /* 嘴：一条方块嘴，绝对不吐舌头 */
  ctx.fillStyle=zk.socket;ctx.fillRect(-6.5*u,-43*u,13.5*u,5.5*u);
  if(zk.teeth==='gap'){
    ctx.fillStyle=zk.tooth;
    ctx.fillRect(-5.6*u,-43*u,3.2*u,2.6*u);
    ctx.fillRect(1.6*u,-43*u,3.2*u,2.6*u);            // 中间缺了一颗门牙
  }else if(zk.teeth==='ice'){
    ctx.fillStyle=zk.tooth;
    for(let i=0;i<3;i++)ctx.fillRect((-5.6+i*4.2)*u,-43*u,2.8*u,2.6*u);
  }else if(zk.teeth==='fire'){
    ctx.fillStyle='#ff7043';ctx.fillRect(-5.6*u,-43*u,3.2*u,2.6*u);
    ctx.fillStyle='#ffca28';ctx.fillRect(1.6*u,-43*u,3.2*u,2.6*u);
  }
  /* 头顶附件 */
  if(zk.kind==='oneeye'){                             // 斜插一根方块木棍
    ctx.save();ctx.translate(8.5*u,-56*u);ctx.rotate(0.22);
    ctx.fillStyle=zk.stick;ctx.fillRect(-1.5*u,-17*u,3.2*u,17*u);
    ctx.fillStyle=zk.skin;ctx.fillRect(-2*u,-20*u,4.2*u,4.2*u);
    ctx.restore();
  }
  if(zk.kind==='fire'){                               // 三块阶梯火苗，随时间抖
    const f1=Math.sin(t*8)*0.9*u, f2=Math.sin(t*8+2)*1.2*u, f3=Math.sin(t*8+4)*0.8*u;
    ctx.fillStyle='#ffca28';ctx.fillRect(-8*u,-68*u+f1,5*u,12*u);
    ctx.fillStyle='#ff7043';ctx.fillRect(-2*u,-75*u+f2,7*u,19*u);
    ctx.fillStyle='#ffb300';ctx.fillRect(6*u,-66*u+f3,4.5*u,10*u);
  }
  ctx.restore();
}

/* ---------- 第三章机器人（从三个挑选页的定稿画布原样搬来） ----------
   兵：8B 电焊兵 / 9A 重甲机兵 / 10B 链锯突击兵 / 浮游探针（终章主攻召唤）——小兵挑选页；
   王：8B 活塞重锤王 / 9B 钻头臂王 / 10B 机库王——大王挑选页。
   helper 两套：兵版保持原名（plate/arm/visor/legs/reactor），王版尺寸略有差异（甲片右影更宽、
   靴子更厚、面罩更大、反应核光晕更亮），加 b 前缀防串画；hexA/rr/warnStripe/glowC 两页一致，共用一份。
   四角星火花叫 sparkStar——主游戏早有一个 star()（画五角星徽章），别撞名。
   步态公式一个字没动：u=s/58、bob/rot/lift/sw 全按挑选页定稿，改它=改手感。 */

/* ===== 共用画布工具（两页一字不差的部分） ===== */
function hexA(h,a){
  const n=parseInt(h.slice(1),16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+(+a).toFixed(3)+')';
}
function rr(c,x,y,w,h,r){
  const m=Math.max(0.1,Math.min(r,w/2,h/2));
  c.beginPath();
  c.moveTo(x+m,y);
  c.arcTo(x+w,y,x+w,y+h,m);
  c.arcTo(x+w,y+h,x,y+h,m);
  c.arcTo(x,y+h,x,y,m);
  c.arcTo(x,y,x+w,y,m);
  c.closePath();
}
/* 斜纹警示条 */
function warnStripe(c,u,x,y,w,h,base,ink){
  c.save(); rr(c,x*u,y*u,w*u,h*u,Math.min(1.4*u,h*u/2)); c.clip();
  c.fillStyle=base; c.fillRect(x*u,y*u,w*u,h*u);
  c.fillStyle=ink;
  for(let i=-2;i<w+h;i+=4){
    c.beginPath();
    c.moveTo((x+i)*u,y*u); c.lineTo((x+i+2)*u,y*u);
    c.lineTo((x+i+2-h)*u,(y+h)*u); c.lineTo((x+i-h)*u,(y+h)*u);
    c.closePath(); c.fill();
  }
  c.restore();
}
/* 辉光圆点 */
function glowC(c,u,col,blur,x,y,r){
  c.save(); c.shadowColor=col; c.shadowBlur=Math.max(1,blur*u);
  c.fillStyle=col; c.beginPath(); c.arc(x*u,y*u,Math.max(0.2,r*u),0,7); c.fill(); c.fill();
  c.restore();
}
/* 四角星火花（挑选页里叫 star，这里避开主游戏的五角星 star） */
function sparkStar(c,u,x,y,r,col,rot){
  c.save(); c.translate(x*u,y*u); c.rotate(rot||0); c.fillStyle=col;
  c.beginPath();
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4, rad=(i%2? r*0.35:r)*u;
    c.lineTo(Math.cos(a)*rad,Math.sin(a)*rad);
  }
  c.closePath(); c.fill(); c.restore();
}

/* ===== 小兵版零件（原名照搬） ===== */
/* 圆角分层甲片：主体壳色 + 顶部高光 + 右侧影 + 底暗 + 描边 + 可选铆钉 */
function plate(c,u,x,y,w,h,p,rv){
  const r=Math.min(2.4*u,h*0.34,w*0.34);
  rr(c,x*u,y*u,w*u,h*u,r); c.fillStyle=p.shell; c.fill();
  c.save(); rr(c,x*u,y*u,w*u,h*u,r); c.clip();
  c.fillStyle=p.lt; c.fillRect(x*u,y*u,w*u,Math.max(1.1*u,h*0.16));
  c.fillStyle=p.dk; c.fillRect((x+w-2.1)*u,y*u,2.1*u,h*u);
  c.fillStyle='rgba(0,0,0,.2)'; c.fillRect(x*u,(y+h-1.5)*u,w*u,1.5*u);
  c.restore();
  c.strokeStyle='rgba(6,10,18,.5)'; c.lineWidth=Math.max(0.8,0.9*u);
  rr(c,x*u,y*u,w*u,h*u,r); c.stroke();
  if(rv&&w>7&&h>5){
    c.fillStyle=p.riv;
    const s=1.3*u;
    c.beginPath(); c.arc((x+1.6)*u,(y+1.7)*u,s/1.6,0,7); c.fill();
    c.beginPath(); c.arc((x+w-1.6)*u,(y+1.7)*u,s/1.6,0,7); c.fill();
    c.beginPath(); c.arc((x+1.6)*u,(y+h-1.9)*u,s/1.6,0,7); c.fill();
    c.beginPath(); c.arc((x+w-1.6)*u,(y+h-1.9)*u,s/1.6,0,7); c.fill();
  }
}
/* 手臂甲（金属色，带亮面） */
function arm(c,u,p,x,y,w,h){
  plate(c,u,x,y,w,h,{shell:p.metal,lt:p.shell,dk:p.dark,riv:p.riv},false);
}
/* 胸口能量核（脉动辉光） */
function reactor(c,u,x,y,r,col,gp){
  c.save(); c.shadowColor=col; c.shadowBlur=13*u*gp;
  c.fillStyle='#0d1420'; c.beginPath(); c.arc(x*u,y*u,r*u,0,7); c.fill();
  c.restore();
  c.strokeStyle=col; c.lineWidth=1.7*u; c.globalAlpha=0.55+0.45*gp;
  c.beginPath(); c.arc(x*u,y*u,r*u,0,7); c.stroke(); c.globalAlpha=1;
  c.fillStyle=col; c.beginPath(); c.arc(x*u,y*u,r*0.55*u,0,7); c.fill();
  c.fillStyle='#ffffff'; c.beginPath(); c.arc(x*u,y*u,r*0.22*u,0,7); c.fill();
}
/* 黑面罩 + 发光眼缝 */
function visor(c,u,p,t,ph){
  c.fillStyle='#0d1420'; rr(c,-9.6*u,-51*u,19.2*u,6.8*u,2*u); c.fill();
  const e=0.6+0.4*Math.sin(t*5+ph);
  c.save(); c.shadowColor=p.eye; c.shadowBlur=11*u*e;
  c.globalAlpha=0.55+0.45*e; c.fillStyle=p.eye;
  c.fillRect(-8.4*u,-49.4*u,16.8*u,3*u);
  c.restore(); c.globalAlpha=1;
}
/* 机甲腿：大腿+膝甲+小腿靴+靴底辉光 */
function legs(c,u,p,liftL,liftR,lw,gsw){
  lw=lw||9;
  c.fillStyle=p.metal; rr(c,1.6*u,-18*u,lw*u,13.2*u,2*u); c.fill();
  c.fillStyle=p.shell;  rr(c,2.1*u,-17.6*u,(lw-2.6)*u,4.4*u,1.8*u); c.fill(); /* 膝甲 */
  c.fillStyle=p.dark;   rr(c,0.6*u,-6.2*u-liftR,(lw+3)*u,6.2*u,2*u); c.fill(); /* 靴 */
  c.fillStyle=p.dk; rr(c,-(lw+2.4)*u,-18*u,lw*u,13.2*u,2*u); c.fill();
  c.fillStyle=p.shell; rr(c,-(lw+1.9)*u,-17.6*u,(lw-2.6)*u,4.4*u,1.8*u); c.fill();
  c.fillStyle=p.dark; rr(c,-(lw+3.4)*u,-6.2*u-liftL,(lw+3)*u,6.2*u,2*u); c.fill();
  if(gsw>0){
    c.save(); c.shadowColor=p.acc; c.shadowBlur=9*u*gsw;
    c.globalAlpha=0.45+0.4*gsw; c.fillStyle=p.acc;
    c.fillRect(1*u,-1.5*u-liftR,(lw+2)*u,1.5*u);
    c.fillRect(-(lw+2.8)*u,-1.5*u-liftL,(lw+2)*u,1.5*u);
    c.restore(); c.globalAlpha=1;
  }
}

/* ===== 小兵配色表（键名＝ZB/KIND 里用的兵种 key，配色抄挑选页 ITEMS 定稿） ===== */
const ROBOT_SK={
  weld :{kind:'weld',
    pal:{shell:'#ffdf9e',lt:'#fff3cf',dk:'#c9973f',metal:'#c56a29',dark:'#5d3317',riv:'#ffe8b8',acc:'#ffb300',trim:'#ff7043',eye:'#4dd0e1'}},
  armor:{kind:'armor',
    pal:{shell:'#d3bcff',lt:'#efe3ff',dk:'#8f6fd6',metal:'#6a4cc0',dark:'#33206b',riv:'#e6d7ff',acc:'#ffd54f',trim:'#ffd54f',eye:'#ff69d0'}},
  chain:{kind:'chain',
    pal:{shell:'#f2705c',lt:'#ffb3a1',dk:'#a13c2c',metal:'#4a4e57',dark:'#23262b',riv:'#ffd2c8',acc:'#ff5722',trim:'#ffd54f',eye:'#ffca28'}},
  drone:{kind:'drone',
    pal:{shell:'#d8f6ff',lt:'#ffffff',dk:'#8fc9e8',metal:'#4ba3d8',dark:'#215b83',riv:'#eaf8ff',acc:'#40c4ff',trim:'#ffab40',eye:'#69f0ae'}}
};

/* ---------- 小兵绘制（挑选页 drawUnit 定稿原样搬，只删了没选上的哨兵/法师两版） ---------- */
function drawRobotUnit(c,x,y,s,it,t,ph){
  const u=s/58, p=it.pal, k=it.kind;
  const bob=Math.sin(ph)*1.4*u, rot=Math.sin(ph)*0.05;
  const liftL=Math.max(0,Math.sin(ph))*3.4*u, liftR=Math.max(0,-Math.sin(ph))*3.4*u;
  const sw=Math.sin(ph)*1.6*u;
  const gp=0.55+0.45*Math.sin(t*3.4);
  const hover=(k==='drone');

  /* 地面阴影 + 身后能量光环 */
  c.fillStyle=hover?'rgba(0,0,0,.16)':'rgba(0,0,0,.3)';
  c.beginPath(); c.ellipse(x,y+1,(hover?11.5:16)*u,3.4*u,0,0,7); c.fill();
  const gy=y-(hover?64:50)*u;
  const g=c.createRadialGradient(x,gy,2*u,x,gy,46*u);
  g.addColorStop(0,hexA(p.acc,0.17*gp)); g.addColorStop(1,hexA(p.acc,0));
  c.fillStyle=g; c.fillRect(x-48*u,gy-48*u,96*u,96*u);

  c.save(); c.translate(x,y+bob-(hover?10*u:0)); c.rotate(rot+(k==='chain'?0.05:0));

  /* ===== 腿 / 推进器 ===== */
  if(k!=='drone'){
    legs(c,u,p,liftL,liftR,k==='armor'?11:9,gp);
  }else{
    /* 浮游探针：喷口 + 三层尾焰 */
    c.fillStyle=p.dark; rr(c,-9.6*u,-17*u,6.4*u,5.4*u,1.6*u); c.fill();
    rr(c,3.2*u,-17*u,6.4*u,5.4*u,1.6*u); c.fill();
    for(const nx of[-6,6.4]){
      const fl=0.6+0.4*Math.abs(Math.sin(t*11+nx));
      const jl=(9+3.5*Math.abs(Math.sin(t*11+nx)))*u;
      c.globalAlpha=0.85*fl; c.fillStyle='#ff8a3c';
      c.beginPath(); c.moveTo((nx-2.6)*u,-12*u); c.lineTo((nx+2.6)*u,-12*u); c.lineTo(nx*u,-12*u+jl); c.closePath(); c.fill();
      c.fillStyle='#ffec62';
      c.beginPath(); c.moveTo((nx-1.6)*u,-12*u); c.lineTo((nx+1.6)*u,-12*u); c.lineTo(nx*u,-12*u+jl*0.66); c.closePath(); c.fill();
      c.globalAlpha=fl; c.fillStyle=p.acc;
      c.beginPath(); c.moveTo((nx-0.9)*u,-12*u); c.lineTo((nx+0.9)*u,-12*u); c.lineTo(nx*u,-12*u+jl*0.38); c.closePath(); c.fill();
      c.globalAlpha=1;
    }
  }

  /* ===== 背挂小零件（先压在身后） ===== */
  if(k==='armor'){
    const dp=(t*0.85)%1;
    c.globalAlpha=1-dp; c.fillStyle=p.riv;
    rr(c,3.4*u,-20*u+dp*20*u,2.4*u,2.4*u,0.7*u); c.fill(); c.globalAlpha=1;
  }

  /* ===== 手臂 ===== */
  if(k==='chain'){
    arm(c,u,p,-18,-34,8,4.4); arm(c,u,p,-18,-26,8,4.4);
  }else{
    arm(c,u,p,-28,-28-sw,17,7); arm(c,u,p,-30,-36+sw,19,7);
    c.fillStyle=p.dark; rr(c,-31.6*u,-30*u-sw,4.4*u,9.4*u,1.4*u); c.fill();
    rr(c,-33.6*u,-38*u+sw,4.4*u,9.4*u,1.4*u); c.fill();
  }

  /* ===== 躯干 ===== */
  plate(c,u,-13,-38,26,21,p,true);
  if(k==='armor'){
    c.save(); rr(c,-13*u,-38*u,13*u,21*u,2.4*u); c.clip();
    c.fillStyle='rgba(0,0,0,.16)'; c.fillRect(-13*u,-38*u,13*u,21*u); c.restore();
  }
  if(k==='chain') warnStripe(c,u,-12.4,-19.6,24.8,3,p.trim,'#23262b');
  else if(k!=='weld'){ c.fillStyle=p.dark; rr(c,-10.4*u,-22.6*u,6.2*u,2*u,1*u); c.fill(); rr(c,4.2*u,-22.6*u,6.2*u,2*u,1*u); c.fill(); }
  reactor(c,u,0,-27,k==='chain'?p.trim:p.acc,4.2,gp);
  /* 肩甲 */
  plate(c,u,-21,-41.5,10.5,8.5,p,true);
  plate(c,u,10.5,-41.5,10.5,8.5,p,true);
  if(k==='armor'){
    plate(c,u,-22.5,-47,12,8.5,p,true);
    plate(c,u,10,-50,12,8.5,{...p,shell:p.trim,lt:'#fff8e1',dk:'#c79a1e'},true); /* 金色低肩 */
    plate(c,u,9.6,-45.5,12.6,9,p,true);
  }
  if(k==='weld'){
    plate(c,u,3.6,-43,10,5.4,{...p,shell:p.trim,lt:'#ffd8a8',dk:'#b3541e'},false); /* 焊枪基座 */
    c.fillStyle=p.dark; rr(c,-25.6*u,-32*u,6.4*u,5.4*u,1.5*u); c.fill();          /* 喷嘴 */
  }

  /* ===== 头 ===== */
  plate(c,u,-12,-56,24,19,p,true);
  visor(c,u,p,t,ph);
  if(k==='weld'){
    /* 电焊盔：帽檐 + 翻下来的护目板 */
    c.fillStyle=p.dk; rr(c,-13.4*u,-56.6*u,27*u,3.6*u,1.4*u); c.fill();
    c.fillStyle='#0d1420'; rr(c,-6.5*u,-53.5*u,7*u,6.4*u,1.6*u); c.fill();
    c.fillStyle=p.eye; c.globalAlpha=0.5+0.4*Math.sin(t*7);
    c.fillRect(-5.6*u,-52.4*u,5.2*u,1.6*u); c.globalAlpha=1;
  }
  if(k==='drone'){
    /* 侧耳螺旋 + 圆顶 */
    c.fillStyle=p.dk; rr(c,-13.8*u,-45*u,2.6*u,5*u,1.2*u); c.fill();
    rr(c,11.2*u,-45*u,2.6*u,5*u,1.2*u); c.fill();
    c.fillStyle=p.trim; glowC(c,u,p.trim,7,0,-58.2,1.1+0.5*Math.sin(t*6));
  }
  if(k==='chain'){
    warnStripe(c,u,-12,-58.4,24,3.4,p.trim,'#23262b');
  }
  if(k==='armor'){
    c.fillStyle=p.trim; rr(c,-4*u,-58.6*u,8*u,2.4*u,1*u); c.fill(); /* 金冠条 */
  }

  /* ===== 旋翼（探针） ===== */
  if(k==='drone'){
    for(const sx of[-1,1]){
      c.save(); c.translate(sx*15*u,-33*u);
      c.globalAlpha=0.2; c.fillStyle=p.lt;
      c.beginPath(); c.ellipse(0,0,9.2*u,2.8*u,0,0,7); c.fill(); c.globalAlpha=1;
      c.rotate(t*20*sx);
      c.fillStyle=p.dk; rr(c,-8.6*u,-1.2*u,17.2*u,2.4*u,1.1*u); c.fill();
      c.rotate(Math.PI/2);
      c.globalAlpha=0.5; rr(c,-8.6*u,-1.2*u,17.2*u,2.4*u,1.1*u); c.fill(); c.globalAlpha=1;
      c.restore();
      c.fillStyle=p.dark; c.beginPath(); c.arc(sx*15*u,-33*u,2.2*u,0,7); c.fill();
    }
  }

  /* ===== 链锯（锯盘 + 火星） ===== */
  if(k==='chain'){
    const spv=0.5+0.5*Math.sin(t*1.7);
    const ang=t*(12+12*spv);
    c.save(); c.translate(-25*u,-29.5*u); c.rotate(ang);
    c.fillStyle=p.dk; c.beginPath(); c.arc(0,0,9*u,0,7); c.fill();
    c.fillStyle=p.metal;
    for(let i=0;i<10;i++){
      const a=i*Math.PI/5;
      c.beginPath();
      c.moveTo(Math.cos(a-0.12)*9*u,Math.sin(a-0.12)*9*u);
      c.lineTo(Math.cos(a)*11.4*u,Math.sin(a)*11.4*u);
      c.lineTo(Math.cos(a+0.12)*9*u,Math.sin(a+0.12)*9*u);
      c.closePath(); c.fill();
    }
    c.strokeStyle=p.trim; c.lineWidth=1.6*u; c.globalAlpha=0.75;
    c.beginPath(); c.moveTo(-8*u,0); c.lineTo(8*u,0); c.moveTo(0,-8*u); c.lineTo(0,8*u); c.stroke();
    c.globalAlpha=1; c.restore();
    glowC(c,u,p.trim,7,-25,-29.5,2*spv+0.8);
    for(let i=0;i<6;i++){
      const pr=((t*1.15+i*0.17)%1);
      const dir=(i%2?1:-1);
      const sx=-25+dir*(6+16*pr);
      const sy=-29.5+20*pr*pr-7*pr;
      c.globalAlpha=(1-pr)*(0.4+0.6*spv);
      c.fillStyle=['#ffffff','#ffec62','#ff8a3c'][i%3];
      c.fillRect(sx*u,sy*u,1.7*u,1.7*u);
    }
    c.globalAlpha=1;
  }

  /* ===== 焊枪火花（七彩焊花） ===== */
  if(k==='weld'){
    const flash=Math.abs(Math.sin(t*9))>0.9;
    glowC(c,u,'#b9f2ff',flash?16:7,-23.2,-27.6,flash?2.6:1.5);
    if(flash) sparkStar(c,u,-23.2,-27.6,4,'#ffffff',t*2.2);
    const cols=['#ffffff','#fff59d','#ffb300','#7ff3ff','#ff8a3c'];
    for(let i=0;i<8;i++){
      const pr=((t*0.8+i*0.125)%1);
      const dir=(i%2?1:-1);
      const sx=-23.2+dir*(1.5+5*pr)*(((i*7)%5)/5+0.4);
      const sy=-27.6+27*pr*pr;
      c.globalAlpha=1-pr;
      c.fillStyle=cols[i%5];
      c.fillRect(sx*u,sy*u,(1.3+(i%3)*0.4)*u,(1.3+(i%3)*0.4)*u);
    }
    c.globalAlpha=1;
  }

  /* ===== 重甲兵：肩排汽（白色蒸汽团） ===== */
  if(k==='armor'){
    c.fillStyle=p.dark; rr(c,15*u,-48.6*u,3.6*u,3*u,1*u); c.fill();
    const q=(t*0.6)%1;
    for(let i=0;i<3;i++){
      const qq=q-i*0.16;
      if(qq<0||qq>0.6) continue;
      c.globalAlpha=(1-qq/0.6)*0.42; c.fillStyle='#eef8ff';
      c.beginPath(); c.arc((16.8+i*1.4)*u,(-49-27*qq)*u,(2+5.4*qq)*u,0,7); c.fill();
    }
    c.globalAlpha=1;
  }

  c.restore();
}

/* ---------- 第三章三位大王：彩色精致机甲（焕宸从挑选页里挑的 8B / 9B / 10B） ----------
   从挑选页照抄，只删掉没被选中的 laser/rail/shield 三个分支；步态公式与小兵一致（ph+=dt*3.2 在别处推进）。
   大王版甲片和兵版参数略有差异（右影 2.3u、铆钉 0.8*u、腿靴更宽），所以单独一套 b 前缀，不复用兵版。
   hexA/rr/warnStripe/glowC 两版逐字相同，共用上面小兵块的。 */
function bPlate(c,u,x,y,w,h,p,rv){
  const r=Math.min(2.4*u,h*0.34,w*0.34);
  rr(c,x*u,y*u,w*u,h*u,r); c.fillStyle=p.shell; c.fill();
  c.save(); rr(c,x*u,y*u,w*u,h*u,r); c.clip();
  c.fillStyle=p.lt; c.fillRect(x*u,y*u,w*u,Math.max(1.1*u,h*0.16));
  c.fillStyle=p.dk; c.fillRect((x+w-2.3)*u,y*u,2.3*u,h*u);
  c.fillStyle='rgba(0,0,0,.2)'; c.fillRect(x*u,(y+h-1.6)*u,w*u,1.6*u);
  c.restore();
  c.strokeStyle='rgba(6,10,18,.5)'; c.lineWidth=Math.max(0.8,0.9*u);
  rr(c,x*u,y*u,w*u,h*u,r); c.stroke();
  if(rv&&w>7&&h>5){
    c.fillStyle=p.riv;
    c.beginPath(); c.arc((x+1.7)*u,(y+1.8)*u,0.8*u,0,7); c.fill();
    c.beginPath(); c.arc((x+w-1.7)*u,(y+1.8)*u,0.8*u,0,7); c.fill();
    c.beginPath(); c.arc((x+1.7)*u,(y+h-2)*u,0.8*u,0,7); c.fill();
    c.beginPath(); c.arc((x+w-1.7)*u,(y+h-2)*u,0.8*u,0,7); c.fill();
  }
}
function bArm(c,u,p,x,y,w,h){
  bPlate(c,u,x,y,w,h,{shell:p.metal,lt:p.shell,dk:p.dark,riv:p.riv},false);
}
function bReactor(c,u,x,y,r,col,gp){
  c.save(); c.shadowColor=col; c.shadowBlur=15*u*gp;
  c.fillStyle='#0d1420'; c.beginPath(); c.arc(x*u,y*u,r*u,0,7); c.fill();
  c.restore();
  c.strokeStyle=col; c.lineWidth=1.9*u; c.globalAlpha=0.55+0.45*gp;
  c.beginPath(); c.arc(x*u,y*u,r*u,0,7); c.stroke(); c.globalAlpha=1;
  c.fillStyle=col; c.beginPath(); c.arc(x*u,y*u,r*0.55*u,0,7); c.fill();
  c.fillStyle='#ffffff'; c.beginPath(); c.arc(x*u,y*u,r*0.24*u,0,7); c.fill();
}
function bVisor(c,u,p,t,e){
  c.fillStyle='#0d1420'; rr(c,-11*u,-53.5*u,22*u,7.4*u,2.2*u); c.fill();
  c.save(); c.shadowColor=p.eye; c.shadowBlur=13*u*e;
  c.globalAlpha=0.55+0.45*e; c.fillStyle=p.eye;
  c.fillRect(-9.6*u,-51.9*u,19.2*u,3.4*u);
  c.restore(); c.globalAlpha=1;
}
function bLegs(c,u,p,liftL,liftR,lw,gsw){
  lw=lw||9;
  c.fillStyle=p.metal; rr(c,1.6*u,-18*u,lw*u,13.4*u,2.2*u); c.fill();
  c.fillStyle=p.shell;  rr(c,2*u,-17.6*u,(lw-2.4)*u,4.8*u,2*u); c.fill();
  c.fillStyle=p.dark;   rr(c,0.2*u,-6.4*u-liftR,(lw+3.6)*u,6.4*u,2.2*u); c.fill();
  c.fillStyle=p.dk;   rr(c,-(lw+2.8)*u,-18*u,lw*u,13.4*u,2.2*u); c.fill();
  c.fillStyle=p.shell; rr(c,-(lw+2.4)*u,-17.6*u,(lw-2.4)*u,4.8*u,2*u); c.fill();
  c.fillStyle=p.dark; rr(c,-(lw+4)*u,-6.4*u-liftL,(lw+3.6)*u,6.4*u,2.2*u); c.fill();
  if(gsw>0){
    c.save(); c.shadowColor=p.acc; c.shadowBlur=10*u*gsw;
    c.globalAlpha=0.45+0.4*gsw; c.fillStyle=p.acc;
    c.fillRect(0.6*u,-1.6*u-liftR,(lw+2.8)*u,1.6*u);
    c.fillRect(-(lw+3.4)*u,-1.6*u-liftL,(lw+2.8)*u,1.6*u);
    c.restore(); c.globalAlpha=1;
  }
}
/* 三支大王的配色（照抄挑选页 ITEMS 的 8B / 9B / 10B） */
const RBOSS_SK={
  piston:{kind:'piston',
    pal:{shell:'#fbc02d',lt:'#ffe98a',dk:'#b98600',metal:'#ff7a1a',dark:'#4e3220',riv:'#ffefb8',acc:'#ffab00',trim:'#ffd54f',eye:'#4dd0e1'}},
  drill:{kind:'drill',
    pal:{shell:'#ffbe9e',lt:'#ffe8d4',dk:'#c77b4d',metal:'#e65100',dark:'#4e2610',riv:'#ffdcc0',acc:'#ff8a3c',trim:'#ffd54f',eye:'#ffb300'}},
  hangar:{kind:'hangar',

};
function drawRobotBoss(c,x,y,s,it,t,ph){
  const u=s/58, p=it.pal, k=it.kind;
  const bob=Math.sin(ph)*1.4*u, rot=Math.sin(ph)*0.05;
  const liftL=Math.max(0,Math.sin(ph))*3.4*u, liftR=Math.max(0,-Math.sin(ph))*3.4*u;
  const sw=Math.sin(ph)*1.6*u;
  const gp=0.55+0.45*Math.sin(t*3.4);
  const pulse=0.5+0.5*Math.sin(t*5);

  c.fillStyle='rgba(0,0,0,.32)';
  c.beginPath(); c.ellipse(x,y+1,23*u,4.4*u,0,0,7); c.fill();
  const gy=y-56*u;
  const g=c.createRadialGradient(x,gy,3*u,x,gy,56*u);
  g.addColorStop(0,hexA(p.acc,0.15*gp)); g.addColorStop(1,hexA(p.acc,0));
  c.fillStyle=g; c.fillRect(x-58*u,gy-58*u,116*u,116*u);

  c.save(); c.translate(x,y+bob);
  c.rotate(rot);

  /* ===== 腿 ===== */
  bLegs(c,u,p,liftL,liftR,k==='drill'?11:10,gp);

  /* ===== 背后结构（压在身后） ===== */
  if(k==='hangar'){
    bPlate(c,u,12,-68,32,44,p,true);
    warnStripe(c,u,13,-27,30,3.4,p.trim,'#173a1c');
    const fc=3.2, q=(t%fc)/fc;
    const openA=q>0.5?Math.min(1,(q-0.5)/0.1):(q>0.92?Math.max(0,1-(q-0.92)/0.08):0);
    const gapH=2.6+8.4*openA;
    c.fillStyle='#0d1420'; rr(c,14.5*u,(-48)*u,27*u,gapH*u,1.4*u); c.fill();
    if(openA>0.05){
      c.save(); c.shadowColor=p.acc; c.shadowBlur=12*u*openA;
      c.globalAlpha=0.35+0.6*openA; c.fillStyle=p.acc;
      c.fillRect(16*u,-47.2*u,24*u,(gapH-1.6)*u);
      c.restore(); c.globalAlpha=1;
    }
    c.fillStyle=p.dark; c.fillRect(26*u,-77*u,2*u,9.4*u);
    glowC(c,u,'#ff5252',Math.sin(t*4)>0?12:3,27,-80,1.8);
    /* 放出小探针 */
    if(q>0.7){
      for(let d=0;d<2;d++){
        const b=(q-0.7)/0.3-d*0.4;
        if(b<0||b>1) continue;
        const dx=27-46*b, dy=-46-26*b+5*Math.sin(b*7+d);
        c.globalAlpha=1-b*0.75;
        c.fillStyle=p.dk; c.beginPath(); c.arc(dx*u,dy*u,2.4*u,0,7); c.fill();
        c.fillStyle=p.acc; c.beginPath(); c.arc(dx*u,dy*u,1.1*u,0,7); c.fill();
        c.strokeStyle=hexA(p.lt,0.8); c.lineWidth=0.9*u;
        c.beginPath(); c.moveTo((dx-4)*u,(dy-2.8)*u); c.lineTo((dx+4)*u,(dy-2.8)*u); c.stroke();
        c.globalAlpha=(1-b)*0.4; c.fillStyle=p.acc;
        c.fillRect((dx+2)*u,(dy+1)*u,4*u,1.2*u);
        c.globalAlpha=1;
      }
    }
  }
  if(k==='drill'){
    c.save(); c.translate(17.5*u,-36*u); c.rotate(0.38);
    bPlate(c,u,0,-16,13,34,{...p,shell:p.dk,lt:p.metal,dk:p.dark},true);
    const da=(t*10)%6;
    c.fillStyle=hexA(p.dark,0.6);
    for(let i=0;i<6;i++) c.fillRect(0.5*u,(-15+i*6+da-6)*u,12*u,1.8*u);
    c.restore();
  }

  /* ===== 前侧巨物 + 招式 ===== */
  if(k==='piston'){
    /* 液压巨臂 */
    const fc=1.8, q=(t%fc)/fc;
    let d=0;
    if(q<0.3) d=-7*(q/0.3);
    else if(q<0.42) d=-7+16*((q-0.3)/0.12);
    else if(q<0.78) d=9+0.5*Math.sin(t*30);
    else d=9*(1-(q-0.78)/0.22);
    c.fillStyle=p.dk; rr(c,-21.5*u,(-31+d*0.4)*u,5.4*u,(24+d)*u,1.6*u); c.fill(); /* 活塞杆 */
    c.fillStyle=p.riv; rr(c,-20.6*u,(-31+d*0.4)*u,1.4*u,(24+d)*u,0.6*u); c.fill();
    bPlate(c,u,-24.5,-48,12,18,p,true); /* 肩窝 */
    warnStripe(c,u,-31,-9+d,19,10.5,p.acc,'#263238'); /* 锤头（黄黑警示） */
    c.strokeStyle='rgba(6,10,18,.5)'; c.lineWidth=Math.max(0.8,0.9*u);
    rr(c,-31*u,(-9+d)*u,19*u,10.5*u,2.4*u); c.stroke();
    if(q>=0.42&&q<0.78){ /* 砸地：冲击波环 + 尘土 */
      const rq=Math.min(1,(q-0.42)/0.34);
      for(let i=0;i<2;i++){
        const rx=(7+34*(rq))+i*9, al=(1-rq)*(i?0.5:0.8);
        if(al<=0) continue;
        c.globalAlpha=al; c.strokeStyle=p.trim; c.lineWidth=(2.2-i*0.8)*u;
        c.beginPath(); c.ellipse(-21.5*u,-0.5*u,rx*u,(rx*0.28)*u,0,0,7); c.stroke();
      }
      c.globalAlpha=1;
      for(let i=0;i<7;i++){
        const pr=Math.min(1,rq*1.3), dir=(i%2?1:-1);
        c.globalAlpha=(1-pr)*0.5; c.fillStyle='#efe3c0';
        c.beginPath();
        c.arc((-21.5+dir*(5+22*pr))*u,(-2-7*pr*(1-pr*0.4))*u,(1.4+2.6*pr)*u,0,7); c.fill();
      }
      c.globalAlpha=1;
    }
    if(q>=0.42&&q<0.78&&Math.sin(t*12)>0) glowC(c,u,p.acc,14,-21.5,-4+d,3.2); /* 卡住时锤头闪灯 */
    bArm(c,u,p,-25,-27-sw,14,6.2);
  }
  if(k==='drill'){
    /* 贴地大钻头 */
    c.save(); c.translate(-2*u,0);
    c.fillStyle=p.dk;
    c.beginPath();
    c.moveTo(-26*u,-25*u); c.lineTo(-12*u,-25*u); c.lineTo(-18.5*u,-3*u); c.closePath(); c.fill();
    c.fillStyle=p.metal;
    c.beginPath();
    c.moveTo(-24.5*u,-23*u); c.lineTo(-13.5*u,-23*u); c.lineTo(-18.5*u,-6*u); c.closePath(); c.fill();
    const da=(t*16)%7;
    c.save();
    c.beginPath();
    c.moveTo(-26*u,-25*u); c.lineTo(-12*u,-25*u); c.lineTo(-18.5*u,-3*u); c.closePath(); c.clip();
    c.fillStyle=hexA(p.dark,0.55);
    for(let i=0;i<5;i++) c.fillRect(-27*u,(-25+i*7+da)*u,16*u,2.4*u);
    c.restore();
    glowC(c,u,p.trim,8,-18.5,-5.6,1.6);
    c.restore();
    bArm(c,u,p,-24,-41,12,6.2);
    /* 火星前喷 */
    for(let i=0;i<7;i++){
      const pr=((t*1.25+i*0.143)%1);
      const dir=(i%2?1:-1);
      const sx=-19+dir*(4+18*pr);
      const sy=-5-(13*pr-24*pr*pr);
      c.globalAlpha=(1-pr)*0.9;
      c.fillStyle=['#ffffff','#ffec62','#ff8a3c'][i%3];
      c.fillRect(sx*u,Math.min(-1,sy)*u,1.6*u,1.6*u);
    }
    c.globalAlpha=1;
    if(Math.abs(Math.sin(t*9))>0.75){
      c.save(); c.shadowColor=p.acc; c.shadowBlur=14*u;
      c.globalAlpha=0.6; c.fillStyle='#ff8a3c';
      c.fillRect(-26*u,-1.2*u,16*u,1.2*u); c.restore(); c.globalAlpha=1;
    }
  }
  if(k==='hangar'){
    bArm(c,u,p,-28,-28-sw,17,7); bArm(c,u,p,-30,-36+sw,19,7);
    c.fillStyle=p.dark; rr(c,-32*u,-30.5*u-sw,5*u,9.6*u,1.5*u); c.fill();
  }

  /* ===== 躯干 ===== */
  bPlate(c,u,-15,-40,30,24,p,true);
  c.fillStyle=hexA(p.dark,0.5); c.fillRect(-15*u,-30*u,30*u,1.8*u);
  bReactor(c,u,0,-25,5.2,p.acc,gp);
  warnStripe(c,u,-14.6,-20.6,29.2,3,p.trim,k==='piston'?'#263238':p.dark);
  /* 大肩甲 */
  bPlate(c,u,-25,-45,12,9.5,p,true);
  bPlate(c,u,13,-45,12,9.5,p,true);

  /* ===== 头 ===== */
  bPlate(c,u,-14,-60,28,21,p,true);
  bVisor(c,u,p,t,pulse);
  c.fillStyle=p.dk; rr(c,-15.6*u,-60*u,31.2*u,3.6*u,1.6*u); c.fill(); /* 帽檐 */
  /* 头顶能量宝石 */
  glowC(c,u,p.trim,10*gp,0,-63,1.5+0.7*gp);
  if(k==='piston'){ warnStripe(c,u,-12,-66,24,4.4,p.acc,'#263238'); }
  if(k==='drill'){ c.fillStyle=p.trim; rr(c,-5*u,-65*u,10*u,5.6*u,1.4*u); c.fill(); }
  if(k==='hangar'){ c.fillStyle=p.dark; rr(c,-9*u,-66*u,18*u,6.4*u,2*u); c.fill();
    c.fillStyle=p.acc; c.globalAlpha=0.5+0.4*Math.sin(t*4);
    c.fillRect(-7.4*u,-64.6*u,14.8*u,2*u); c.globalAlpha=1; }

  c.restore();
}

/* ---------- 第三章场景背景工具（挑选页坐标系 420x250、地平线 222，BG 里用 transform 映射进来） ---------- */
const RW=420, RH=250, RGY=222;
function rnd(i){ const x=Math.sin(i*127.1+311.7)*43758.5453; return x-Math.floor(x); }
function sky(c,stops){
  const g=c.createLinearGradient(0,0,0,RH);
  stops.forEach((s,i)=>g.addColorStop(i/(stops.length-1),s));
  c.fillStyle=g; c.fillRect(0,0,RW,RH);
}
function glow(c,col,blur,x,y,r,alpha){
  c.save();
  if(alpha!=null) c.globalAlpha=alpha;
  c.shadowColor=col; c.shadowBlur=blur; c.fillStyle=col;
  c.beginPath(); c.arc(x,y,r,0,7); c.fill(); c.fill();
  c.restore();
}

/* ---------- 第四章（终极篇章）背景工具：从挑选页原样搬来，坐标换成 RW/RH/RGY ---------- */
const E12='#8bd450', E13='#ff6a2c', E14='#b47cff', E15='#ff2f5e';
/* 烂楼顶：一条锯齿边，比纯方块更像被炸过 */
function jag(c,x,w,top,col){
  c.fillStyle=col; c.beginPath(); c.moveTo(x,RGY); c.lineTo(x,top+5);
  for(let i=0;i<=4;i++){
    const px=x+w*i/4, py=top+(i%2?8:(rnd(x+i)>0.6?1:0));
    c.lineTo(px,py);
  }
  c.lineTo(x+w,RGY); c.closePath(); c.fill();
}
/* 落下来的灰（雪、孢子、烟灰都靠它） */
function ash(c,T,n,col,spd,sway,size){
  c.fillStyle=hexA(col,0.5);
  for(let i=0;i<n;i++){
    const y=((T*spd*(0.6+rnd(i)*0.9)+rnd(i+40)*RH)%(RH+18))-9;
    const x=(rnd(i+80)*RW+Math.sin(T*0.9+i*1.3)*sway+RW)%RW;
    c.fillRect(x,y,size,size);
  }
}
/* 往上蹿的火星 */
function embers(c,T,n,col,spd,drift){
  for(let i=0;i<n;i++){
    const k=(T*spd*(0.5+rnd(i)*0.9)+rnd(i+20)*RH)%RH;
    const y=RH-6-k, x=(rnd(i+60)*RW+Math.sin(T*1.4+i*1.7)*drift+RW)%RW;
    c.fillStyle=hexA(col,0.14+0.6*(1-k/RH));
    c.beginPath(); c.arc(x,y,1.1+rnd(i+3)*1.5,0,7); c.fill();
  }
}
/* 贴地的一层层雾 */
function fog(c,T,y0,h,col,n){
  for(let i=0;i<n;i++){
    const x=((T*(8+i*5)+i*163)%(RW+240))-120;
    c.fillStyle=hexA(col,0.10-0.014*i);
    c.beginPath(); c.ellipse(x,y0+((i%3)-1)*h*0.7,120+i*16,h,0,0,7); c.fill();
  }
}
/* 一道光柱 */
function shaft(c,col,x,y,ang,len,wd,a){
  c.save(); c.translate(x,y); c.rotate(ang);
  c.fillStyle=hexA(col,a);
  c.beginPath(); c.moveTo(0,0); c.lineTo(len,-wd); c.lineTo(len,wd); c.closePath(); c.fill();
  c.restore();
}
/* 地上亮一下的裂缝 */
function cracks(c,col,T,xs){
  c.strokeStyle=hexA(col,0.28+0.16*Math.sin(T*2.2)); c.lineWidth=1.6;
  xs.forEach((x,i)=>{
    c.beginPath(); c.moveTo(x,RGY+2);
    c.lineTo(x+(i%2?10:-9),RGY+11);
    c.lineTo(x+(i%2?21:-18),RH-14);
    c.stroke();
  });
}
/* 风里啪啪响的破旗 */
function flag(c,x,y,w,h,col,T,ph){
  c.fillStyle=col; c.beginPath(); c.moveTo(x,y);
  for(let i=0;i<=5;i++){ const k=i/5; c.lineTo(x+w*k, y+Math.sin(T*5+ph+k*4.2)*3.4*k); }
  for(let i=5;i>=0;i--){ const k=i/5; c.lineTo(x+w*k, y+h+Math.sin(T*5+ph+k*4.2)*3.4*k); }
  c.closePath(); c.fill();
}

/* ---------- 第二章三位大王：方块丧尸风（焕宸从两两对比里挑的 1B / 2B / 3B） ----------

const BOSS_ZK={
  furnace:{art:'furnace',skin:'#616161',skinDark:'#424242',cloth:'#3e2723',clothDark:'#2b1a16',

let AC=null,BUS=null;
function ac(){
  if(!AC){
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C)return null;
    try{AC=new C();}catch(e){return null;}
    /* 音频总线：master ← { music ← bgm ← bgmBoss, sfx }。
       统一音量开关走 master；语音朗读时对 music 总线做 ducking；
       bgm 是 BGM 各层的总入口——drone/风声这类长音一旦排进时间线就停不掉，
       靠这条总线整体淡出才能把尾巴收干净；
       BOSS 战打击层走 bgmBoss（垂直分层，随战况淡入淡出）。
       语音本身是系统 TTS，不经过 WebAudio，所以不设 voice 总线。 */
    BUS={};
    BUS.master=AC.createGain();BUS.master.connect(AC.destination);
    BUS.master.gain.value=SND_ON?1:0;
    BUS.music=AC.createGain();BUS.music.connect(BUS.master);
    BUS.sfx=AC.createGain();BUS.sfx.connect(BUS.master);
    BUS.bgm=AC.createGain();BUS.bgm.connect(BUS.music);
    BUS.bgmBoss=AC.createGain();BUS.bgmBoss.connect(BUS.bgm);
    BUS.bgmBoss.gain.value=0;
  }
  if(AC.state==='suspended'){try{AC.resume();}catch(e){}}
  return AC;
}

function busGain(name,lin,tc){
  if(!AC||!BUS||!BUS[name])return;
  BUS[name].gain.setTargetAtTime(lin,AC.currentTime,tc==null?0.05:tc);

/* BGM：末日氛围版（对齐 APK 里的 voice/bgm.wav——低频 drone ＋ 风声铺底 ＋ 慢金属打击，
   原来的八音盒小旋律在末日场景里太“卡通”，整条换掉）。
   一个循环 16 步 × 250ms = 4 秒；和声、铃声这些长周期层按循环数轮换，避免听感单调。 */
const MELO={gap:250,steps:16,
  /* 55Hz 低音 pedal 之上只放没半音摩擦的音（避 G#/D#），三个双音循环：Am → G/C → Em */
  chords:[[220,261.6],[196,261.6],[164.8,220]]};
let bgmTimer=null;
function stopBgm(){
  if(bgmTimer){clearTimeout(bgmTimer);bgmTimer=null;}
  if(IN_APK){if(bgmA){try{bgmA.pause();}catch(e){}}return;}
  busGain('bgmBoss',0,0.2);
  busGain('bgm',0,0.6);   /* 排进时间线的长音靠 bgm 总线淡出收尾，不会在停播后继续轰鸣 */
}
/* BOSS 是否在场（自适应音乐的切换条件） */
function bossLive(){try{return G.zs.some(z=>z.boss&&!z.die&&z.hp>0);}catch(e){return false;}}
function startBgm(){
  if(IN_APK){if(bgmA&&SND_ON){const p=bgmA.play();if(p&&p.catch)p.catch(()=>{});}return;}
  if(bgmTimer)return;
  busGain('bgm',1,0.8);   // 上一次 stopBgm 淡出过，重新起来
  const CY=MELO.steps,SEC=MELO.gap/1000;
  let i=0;
  const step=()=>{
    if(SND_ON){
      try{
        const s=i%CY,cy=(i/CY)|0;
        /* 1) 低频 drone：55Hz 与 55.7Hz 两个正弦相差 0.7Hz，拍频一秒钟起伏不到一次，
              听起来像远处有台机器在震——氛围的底座，全程只有这一条不常换的东西 */
        if(s===0){
          tone({f:55,dur:CY*SEC+1.2,type:'sine',vol:0.13,atk:1.2,bus:'bgm'});
          tone({f:55.7,dur:CY*SEC+1.2,type:'sine',vol:0.10,atk:1.6,bus:'bgm'});
        }
        /* 2) 和声铺底：两音缓慢起落的长音，每两个循环（8 秒）换一次，给气氛一点推进 */
        if(s===0){
          MELO.chords[cy%MELO.chords.length].forEach((f,k)=>
            tone({f,dur:CY*SEC*2+0.6,type:'triangle',vol:k?0.020:0.032,atk:2.2,bus:'bgm'}));
        }
        /* 3) 风声：低通噪声“阵风”，长短和截止频率每次随机，才不会听出是同一处在响 */
        if(s%4===0)noise({dur:1+Math.random()*1.2,vol:0.028,f:400+Math.random()*500,bus:'bgm'});
        if(s===8&&cy%2===0)noise({dur:1.6,vol:0.012,f:3000,ftype:'highpass',bus:'bgm'});
        /* 4) 慢金属打击：0/6/10 步各一下（第一下最重），像有人在远处砸铁轨 */
        if(s===0||s===6||s===10){
          tone({f:112,f2:46,dur:0.22,type:'sine',vol:s===0?0.20:0.13,atk:0.004,bus:'bgm'});
          noise({dur:0.13,vol:0.045,f:2400,ftype:'highpass',bus:'bgm',delay:0.01});
        }
        /* 5) 每两个循环末尾一声很远的金属余响，给循环一个“句读” */
        if(s===13)tone({f:cy%2?261.6:220,dur:2.2,type:'triangle',vol:0.026,atk:0.02,bus:'bgm'});
        /* 自适应分层：BOSS 在场时 bgmBoss 淡入——打击加密成每一步、低音加倍、再加一层 41Hz 抖动；
           BOSS 死后淡出，回到只有氛围的铺底 */
        busGain('bgmBoss',bossLive()?1:0,0.35);
        if(bossLive()){
          if(s%2===0)tone({f:110,f2:44,dur:0.14,type:'sine',vol:0.30,atk:0.004,bus:'bgmBoss'});
          else noise({dur:0.05,vol:0.10,f:4200,ftype:'highpass',bus:'bgmBoss'});
          if(s===0){
            tone({f:41,f2:38,dur:CY*SEC+0.5,type:'sine',vol:0.16,atk:0.6,bus:'bgmBoss'});
            noise({dur:0.30,vol:0.06,f:520,bus:'bgmBoss'});
          }
        }
      }catch(e){}
    }
    i++;
    bgmTimer=setTimeout(step,MELO.gap);
  };
  step();
}

  if(v<1){
    /* v0 → v1：旧版用 moday_unlock=1 表示全解锁，统一并入 moday_map=3 */
    if(LS.get('moday_unlock','0')==='1')LS.set('moday_map','3');

       moday_map 存的是"已解锁到第几格"，旧第 4 格＝新第 4 格，数值不用换算；
       只有当前选中的战场要换个名字继续：valley → lava */
    if(LS.get('moday_bgcur','')==='valley')LS.set('moday_bgcur','lava');
    v=2;
  }
  if(v<3){
    /* v2 → v3：藏宝图第三章扩四格（机甲坟场／霓虹流水线／峡谷旧油库／机核深渊）。
       moday_map 存的仍是"已解锁到第几格"，数值不用换算，新格自然为锁——只扩容不迁移。 */
    v=3;
  }
  if(v<4){
    /* v3 → v4：第四章扩四格（落日废墟城／巨兽白骨地／机甲残骸长廊／世界尽头的王座），同样只扩容。
       唯一要补的是老玩家：当年表只有 11 格，moday_map 被封顶在 11，打赢机核深渊也存不下第 12 格，
       升级后新格永远锁着进不去。用"是否已解锁 lv3 衣服"认出他真打通了关 11，把格子抬到 12。 */
    if(/(^|,)3(,|$)/.test(LS.get('moday_unlocked',''))
       &&(parseInt(LS.get('moday_map','1'),10)||1)>=11)LS.set('moday_map','12');
    v=4;
  }
  /* 迁移完成后无条件写回当前版本号，保证下次启动不再重复迁移 */
  LS.set('moday_ver',String(SAVE_VER));
}

function weaponOf(id){for(const w of WEAPONS)if(w.id===id)return w;return null;}
/* ---------- 武器强化（焕宸：「加一个强化武器的选项，购买以后可以增加这个武器的速度」）----------
   WEAPONS 表里的 rate **一个都没改**：不买强化就和以前一模一样，提速只能靠金币。
   一把枪最多强化 3 级，每级把「两发间隔」乘 0.85（满级间隔＝出厂的 61.4%，同样时间多打约 63%）；只改节奏，不改威力和弹速，
   小朋友对「同一把枪打得更快」最有感，也不会顺手把平衡搞崩。价格跟着武器档位走：越贵的枪强化越贵。 */
const UP_MAX=3,UP_MUL=0.85;
function upLvl(id){const n=parseInt(OWN.up[id],10)||0;return Math.min(UP_MAX,Math.max(0,n));}
function upPrice(w,lvl){return Math.max(10,Math.round(w.price*0.5))*(lvl+1);}
function effRate(w){const l=upLvl(w.id);return l?Math.max(0.14,w.rate*Math.pow(UP_MUL,l)):w.rate;}
/* 拥有/持有存档：{sw:[买断的切换型 id], oc:{一次性 id:个数}, up:{武器 id:强化等级}}，坏档一律当空（防御性加载） */
let OWN={sw:[],oc:{},up:{}};
(function loadOwn(){
  /* 一次性武器（炸弹、防护盾…）全部按 WEAPONS 表建键，加新的一次性武器不用再改这里 */
  for(const w of WEAPONS)if(w.type==='once')OWN.oc[w.id]=0;
  let o=null;try{o=JSON.parse(LS.get('moday_own',''));}catch(e){}
  if(o&&Array.isArray(o.sw))for(const id of o.sw){const w=weaponOf(id);if(w&&w.type==='switch'&&!OWN.sw.includes(id))OWN.sw.push(id);}
  if(o&&o.oc&&typeof o.oc==='object')for(const id of Object.keys(OWN.oc)){const w=weaponOf(id);if(w&&w.type==='once')OWN.oc[id]=Math.max(0,parseInt(o.oc[id],10)||0);}
  /* 强化等级只认「已经买断的那把枪」：坏档/改档里给没买过的枪塞满级，不会白送一把满速枪 */
  if(o&&o.up&&typeof o.up==='object')for(const id of Object.keys(o.up)){const w=weaponOf(id);if(w&&w.type==='switch'&&hasWeapon(id))OWN.up[id]=Math.max(0,Math.min(UP_MAX,parseInt(o.up[id],10)||0));}
})();
function saveOwn(){LS.set('moday_own',JSON.stringify(OWN));}
function hasWeapon(id){const w=weaponOf(id);if(!w||w.type!=='switch')return false;return w.price===0||OWN.sw.indexOf(id)>=0;}
function onceCnt(id){return Math.max(0,parseInt(OWN.oc[id],10)||0);}
/* 当前装备：两个主角各存一份（免费默认武器＝thin 星星飞镖 / fat 小子弹） */

let curFat=loadCur('moday_cur_fat','bullet');

}

/* 数字→短句：关卡号用中文数字（一到三十九），分数按位读 */
function numClips(n){
  n=Math.floor(n);
  if(n>=1&&n<10)return['n'+n];
  if(n===10)return['n10'];
  if(n>10&&n<20)return['n10','n'+(n-10)];
  if(n===20||n===30)return['n'+n];
  if(n>20&&n<100){const t=Math.floor(n/10),r=n%10;return['n'+(t*10)].concat(r?['n'+r]:[]);}
  return null;
}
function digitsClips(n){const s=String(Math.max(0,Math.floor(n)));const out=[];for(const ch of s)out.push('n'+ch);return out;}
/* 台词统一入口：APK 播内置音频（多段连播），桌面拼回文字走系统 TTS。
   cb＝全部读完才触发（winVoiceDone 等节奏控制依旧卡准，不靠猜时长） */
let vq=[],vqi=0,vcb=null,curClipA=null,waiters=[];
function say(clips,cb){
  if(!SND_ON){if(cb)cb();return;}
  if(!IN_APK){speak(clips.map(c=>VTEXT[c]||'').join(''),cb);return;}
  cancelVoice();
  vq=clips.filter(c=>VOICES[c]);vqi=0;vcb=cb||null;
  if(!vq.length){if(cb)cb();return;}
  voiceBusy=true;
  if(bgmA)bgmA.volume=0.18;                    // 朗读时压低 BGM（等价桌面的 ducking）
  playClip();
}
function playClip(){
  if(vqi>=vq.length){
    const f=vcb;vq=[];vqi=0;vcb=null;curClipA=null;voiceBusy=false;
    if(bgmA)bgmA.volume=0.5;
    flushWaiters();
    if(f)f();
    return;
  }
  const a=VOICES[vq[vqi++]];curClipA=a;
  a.onended=playClip;
  try{a.currentTime=0;}catch(e){}
  const p=a.play();if(p&&p.catch)p.catch(()=>playClip());   // 个别浏览器拦 play 也继续往下走
}
function cancelVoice(){
  vq=[];vqi=0;const f=vcb;vcb=null;
  if(curClipA){curClipA.onended=null;try{curClipA.pause();}catch(e){}curClipA=null;}
  voiceBusy=false;
  if(bgmA)bgmA.volume=0.5;
  if(f)f();                                    // 被顶掉也要放行节奏回调（winVoiceDone 等）
}
/* 排队说：等当前这句读完再开口，不把它硬顶掉。ok()＝还值得说吗（等待期间战斗可能已经结束） */
function sayWhenFree(clips,ok){
  if(!SND_ON)return;
  if(!IN_APK){if(ok())speak(clips.map(c=>VTEXT[c]||'').join(''));return;}
  if(!voiceBusy){if(ok())say(clips);return;}
  let fired=false;
  const go=()=>{if(fired)return;fired=true;if(ok())say(clips);};
  waiters.push(go);
  setTimeout(go,6000);                         // 兜底：播放器万一卡死也别永远不开口
}
function flushWaiters(){const ws=waiters;waiters=[];ws.forEach(f=>f());}

function speakName(bgKey){
  if(!IN_APK){const t=VTEXT['bg_'+bgKey];speak(t+'。'+t);return;}
  say(['bg_'+bgKey,'bg_'+bgKey]);
}
/* 语音 ducking：朗读时把音乐总线压到 -12dB（attack 快），读完慢慢恢复（release 慢）。
   token 防竞态：连续朗读时，旧的 onend 不会把新 ducking 提前解除。 */
function duckMusic(on){busGain('music',on?db2lin(-12):1,on?0.02:0.30);}
let duckToken=0;
let voiceBusy=false,curUtt=null;   // 当前这句还在读吗（speakWhenFree 靠它决定要不要等）
function hookDuck(u,chars){
  const my=++duckToken;
  duckMusic(true);
  /* 音乐恢复和「读完了」是同一个时刻，所以合并成一个 restore；
     my===duckToken 保证被 cancel 掉的旧句子不会把新句子的状态清掉 */
  const restore=()=>{if(my===duckToken){duckToken++;duckMusic(false);voiceBusy=false;curUtt=null;}};
  u.onend=restore;u.onerror=restore;
  setTimeout(restore,1500+chars*420);   // 兜底：个别 WebView 不触发 onend（系数按慢引擎留足余量，防音乐提前变响）
}
/* ---------- 中文语音：部分平板 WebView 不显式挑 voice 就不读（华为常见），先挑一次中文引擎 ---------- */
let _zhVoice=null,_ttsWarned=false;
function zhVoice(){
  if(_zhVoice)return _zhVoice;             // 只有真找到了才记住
  try{
    const vs=speechSynthesis.getVoices()||[];
    /* 安卓首次调用常返回空数组（引擎异步加载），
       这时不能把"没找到"缓存下来，否则以后每次 speak 都不带中文 voice，平板上就永远不读 */
    if(!vs.length)return null;
    _zhVoice=vs.find(v=>/^zh|^cmn|^yue/i.test(v.lang))
           ||vs.find(v=>/Chinese|中文|普通话|讯飞|华为/i.test(v.name))||null;
  }catch(e){}
  return _zhVoice;
}
try{if('onvoiceschanged' in speechSynthesis)speechSynthesis.onvoiceschanged=()=>{_zhVoice=null}}catch(e){}
function ttsCheck(){                            // 首次发声后自检：真无声就给家长一条指引（每次打开只提示一次）
  if(_ttsWarned)return;
  _ttsWarned=true;
  setTimeout(()=>{
    try{
      const empty=!(speechSynthesis.getVoices()||[]).length;
      if(!speechSynthesis.speaking&&empty)
        banner('⚠️ 听不到声音？请在平板 设置→辅助功能→文字转语音(TTS) 里安装中文语音引擎');
    }catch(e){}
  },1600);
}
function speak(s,cb){                     // cb＝这句读完后的回调（用来卡准节奏，不靠猜时长）
  if(!SND_ON){if(cb)cb();return;}          // 静音时立刻回调，别让流程卡住
  try{
    /* 只在真的还有话没读完时才 cancel。
       安卓 WebView 上 cancel() 之后同一个 tick 里 speak()，新句子有概率被一起吞掉，
       表现就是"点了没反应"；空闲时不 cancel 就完全绕开这个竞态 */
    if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(s);
    u.lang='zh-CN';u.rate=0.95;u.pitch=1.15;
    const v=zhVoice();if(v)u.voice=v;
    u.__n=s.length;voiceBusy=true;curUtt=u;
    hookDuck(u,s.length);
    ttsCheck();
    /* 用 addEventListener 而非 onend：hookDuck 已占用 onend 属性，两者共存不互相覆盖 */
    if(cb){
      let done=false;
      const fire=()=>{if(done)return;done=true;cb()};
      u.addEventListener('end',fire);
      u.addEventListener('error',fire);
    }
    speechSynthesis.speak(u);
  }catch(e){voiceBusy=false;curUtt=null;if(cb)cb()}
}
