    if(pendBuy===w.id)card.classList.add('pend');
    card.onclick=()=>tapWeapon(w);
    g.appendChild(card);
  }
  renderUpgrades(g);                            // 下面是「强化武器」区：只列已经买断的切换型武器
}
/* ---------- 强化武器区：焕宸「购买以后可以增加这个武器的速度」。
   每张强化卡 = 一把已拥有的枪 + 3 格等级点 + 价格，点两下成交（和买枪同一套两段式确认）。
   强化只改射速（effRate），威力/弹速/价格表都不动，满级后卡片变灰不再收钱。 ---------- */
function renderUpgrades(g){
  const mine=WEAPONS.filter(w=>w.type==='switch'&&hasWeapon(w.id)&&w.rate);
  if(!mine.length)return;                       // 一把切换型武器都没有（只有免费默认枪时也要能强化，所以这里几乎不会为空）
  const sep=document.createElement('div');sep.className='arsep';
  sep.textContent='⚡ 强化武器（打得更快）';
  g.appendChild(sep);
  for(const w of mine){
    const lvl=upLvl(w.id),full=lvl>=UP_MAX,pr=upPrice(w,lvl);
    const card=document.createElement('div');
    card.className='wcard upc'+(full?' full':'');
    const dots='●'.repeat(lvl)+'○'.repeat(UP_MAX-lvl);
    card.innerHTML='<span class="wi">⚡</span><span class="wn">'+w.name+' 强化</span>'+
      '<span class="wvl">'+dots+'</span><span class="wp'+(full?' own':'')+'">'+(full?'✔ 已满级':'🪙 '+pr)+'</span>';
    if(pendBuy==='up:'+w.id)card.classList.add('pend');
    card.onclick=()=>tapUpgrade(w);
    g.appendChild(card);
  }
}
function tapUpgrade(w){
  const lvl=upLvl(w.id),key='up:'+w.id;
  if(lvl>=UP_MAX){sfx('click');say(['w_'+w.id]);return;}  // 满级：只报个枪名，不再报价
  const pr=upPrice(w,lvl);
  if(pendBuy===key){                            // 再点同一张＝确认强化
    pendBuy=null;
    if(coins<pr){sfx('click');say(['huancha'].concat(numClips(pr-coins),['gejb']));renderArsenal();return;}
    coins-=pr;LS.set('moday_coin',String(coins));
    OWN.up[w.id]=lvl+1;saveOwn();
    updateHUD();                                // 战斗中逛店：HUD 金币立刻同步
    sfx('win');say(['w_'+w.id,'jixu']);
    renderArsenal();return;
  }
  pendBuy=key;sfx('click');                     // 第一次点：语音报价「火箭弹，30个金币，再点一下就买啦」
  say(['w_'+w.id].concat(numClips(pr),['gejb','zaidian']));
  renderArsenal();
}
function tapWeapon(w){
  if(w.type==='switch'&&hasWeapon(w.id)){      // 已拥有：点一下直接装备并报名
    sfx('click');pendBuy=null;equipWeapon(w.id);renderArsenal();return;
  }
  if(pendBuy===w.id){                          // 再点同一张＝确认购买
    pendBuy=null;
    if(coins<w.price){                         // 钱不够：报「还差X个金币」
      sfx('click');
      say(['huancha'].concat(numClips(w.price-coins),['gejb']));
      renderArsenal();return;
    }
    coins-=w.price;LS.set('moday_coin',String(coins));
    if(w.type==='switch')OWN.sw.push(w.id);
    else OWN.oc[w.id]=onceCnt(w.id)+1;
    saveOwn();
    renderWbar();updateHUD();                    // 战斗中买的立即生效：武器栏多出新武器、HUD 金币同步
    sfx('win');
    say(['maidaola']);
    renderArsenal();return;
  }
  pendBuy=w.id;                                // 第一次点：语音报价「XX，X个金币，再点一下就买啦」
  sfx('click');
  say(['w_'+w.id].concat(numClips(w.price),['gejb','zaidian']));
  renderArsenal();
}
let shopFromBattle=false;                      // 武器库是从战斗中打开的吗：关闭时回战场而不是回主菜单
$('btnArsenal').onclick=()=>{sfx('click');pendBuy=null;renderArsenal();show('scrArsenal');say(['welcome']);};
/* 战斗中也能逛武器库：入口在底部武器栏最右边的 🛒。和 ⏸ 同一条暂停路径
   （update() 只在 play 下推进，僵尸/子弹/出怪全冻结），买完关店直接回战场继续打 */
function openBattleShop(){
  if(mode!=='play')return;                     // 只在战斗中有意义（暂停屏/菜单下点了不响应）
  sfx('click');
  shopFromBattle=true;pendBuy=null;
  $('btnArsClose').textContent='✖ 回战场';     // 关店按钮的文案跟着行为走，不误导小朋友
  mode='pause';stopBgm();                      // 停 BGM＋冻结战斗，同 #btnPause
  renderArsenal();show('scrArsenal');say(['welcome']);
}
$('btnArsClose').onclick=()=>{
  sfx('click');pendBuy=null;
  if(!shopFromBattle){toMenu();return;}        // 主菜单开的店：照旧回主菜单
  shopFromBattle=false;                        // 战斗中开的店：回战场继续
  $('btnArsClose').textContent='✖ 回主菜单';
  mode='play';show(null);startBgm();
  say(['jixu']);
};

/* ---------- 键盘控制（input-systems：命名 action + held 状态）----------
   电脑/平板外接键盘也能玩：← → 或 A D 左右移动，↑ ↓ 或 W S 换路。
   上下键长按会连续换路（带冷却），对小朋友更友好。 */
const KEY={left:false,right:false,up:false,down:false};
const KEY_ACT={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',
               ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down'};
let laneHoldT=0;                                 // 长按换路的重复冷却
function setKey(code,v){const a=KEY_ACT[code];if(a){KEY[a]=v;return true;}return false;}
window.addEventListener('keydown',e=>{
  if(setKey(e.code,true)){if(mode==='play')e.preventDefault();return;}
  /* 键盘快捷键：Esc / P 暂停·继续（接键盘或蓝牙手柄的电脑也能玩） */
  if(e.code==='Escape'||e.code==='KeyP'){
    if(mode==='play')$('btnPause').click();
    else if(mode==='pause'){if(shopFromBattle)$('btnArsClose').click();else $('btnResume').click();}   // 商店开着＝Esc 关店回战场，否则继续
  }
});
window.addEventListener('keyup',e=>setKey(e.code,false));

/* ---------- 拖动控制：单点触摸（只认第一根手指）+ 电脑鼠标 ---------- */
let activePid=null, activeMoveT=0;
function setTarget(e){
  if(mode!=='play')return;
  const r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left-OX)/S, y=(e.clientY-r.top-OY)/S;
  const h=G.hero;
  h.tx=Math.max(XMIN,Math.min(XMAX,x));
  h.lane=laneOf(y);                             // 自动吸到最近的一条路
  h.ty=laneY(h.lane);
}
cv.addEventListener('pointerdown',e=>{
  if(mode!=='play')return;
  // 第二根手指忽略；但旧手指按住 1.5 秒没动过（比如手掌压着屏幕）就让新手指接管
  if(activePid!==null&&performance.now()-activeMoveT<1500)return;
  activePid=e.pointerId;activeMoveT=performance.now();
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  setTarget(e); e.preventDefault();
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerId===activePid){activeMoveT=performance.now();setTarget(e);}
  else if(activePid===null&&e.pointerType==='mouse')setTarget(e);  // 电脑上鼠标移动就能控制
});
function endPointer(e){if(e.pointerId===activePid)activePid=null;}
cv.addEventListener('pointerup',endPointer);
cv.addEventListener('pointercancel',endPointer);
window.addEventListener('blur',()=>{activePid=null;KEY.left=KEY.right=KEY.up=KEY.down=false;});

/* ---------- 尺寸 / 横屏 ---------- */
let S=1,OX=0,OY=0;
function fit(){
  const cw=window.innerWidth,ch=window.innerHeight;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.max(1,Math.floor(cw*dpr));
  cv.height=Math.max(1,Math.floor(ch*dpr));
  cv.style.width=cw+'px';cv.style.height=ch+'px';
  S=Math.min(cw/GW,ch/GH);
  OX=(cw-GW*S)/2;OY=(ch-GH*S)/2;
  ctx.setTransform(dpr*S,0,0,dpr*S,dpr*OX,dpr*OY);
}
function checkOrient(){
  $('scrRotate').classList.toggle('hide',window.innerHeight<=window.innerWidth);
}
window.addEventListener('resize',()=>{fit();checkOrient();});
window.addEventListener('orientationchange',()=>{setTimeout(()=>{fit();checkOrient();},220);});

/* 触屏防护：禁滚动、禁双指缩放、禁长按菜单 */
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});

/* ---------- 启动 ---------- */
fit();
checkOrient();
pvA=setupPreview('cvA');
pvB=setupPreview('cvB');
document.querySelectorAll('.chc').forEach(el=>el.classList.toggle('sel',el.dataset.c===curChar));
renderFits();                                       // 衣服条首帧（4.12）
$('uiBest').textContent=best;
$('uiMenuCoin').textContent=coins;
syncSound();
renderMap();
show('scrMenu');
requestAnimationFrame(frame);
</script>
