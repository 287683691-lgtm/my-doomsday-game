function sceneIdx(){const i=BG_ORDER.indexOf(curBG);return i<0?0:i;}
function isBossStage(){return !!curStage().boss;}          // 本关结尾有大王（一章的关3／二章的关4~7）
function isFinalStage(){return !!curStage().finale;}       // 章终合体战：二章「三王合体」、三章「三机王合体」都算
/* 整个游戏打完＝打到 STAGES 的最后一条（第四章「世界尽头的王座」，关 15）。
   不能再用 finale＋ch 判断：finale 是"三王合体"多 BOSS 的专用闸门（给单大王写上会让它
   永远不出手，见 stepBoss 的 act 条件），第四篇章的终关是一只末日总王，所以按表尾判定。 */
function isGameEnd(){return curStage()===STAGES[STAGES.length-1];}
/* 篇章的最后一关＝表里下一条的 ch 和这条不一样（或已经是表尾）。
   lv N＝打完第 N 篇章按这条判定，不靠 finale 猜：第一章关 3、二章关 7、三章关 11、四章关 15。 */
function isChapterLast(){
  const i=Math.min(G.stage,STAGES.length)-1,n=STAGES[i+1];
  return !n||(n.ch||1)!==(STAGES[i].ch||1);
}
/* 打完这一关要不要停下来回藏宝图（规格 FR-21/23：一格一关、拆格不串关）。
   口径＝本格有没有大王：有大王就是这一格的最后一战，倒下去就庆祝＋解锁下一格＋把 ⭐ 挪过去，
   由孩子自己在地图上点下一块；第一章一块战场贯穿关 1~3，关 1、关 2 没有 boss，照旧横幅后自动进下一关。
   旧口径把二、三章的关 4/5/6、8/9/10 甩进自动串关，而解锁只在 celebrate 里做，
   结果孩子人已经打到白骨地/寒冰谷，地图上那两块还锁着、⭐ 还停在熔岩谷 —— 地图和实机对不上。
   终章一定带 boss，`||!!d.finale` 只是把"这一格打完了"这层意思写全，不额外改变判定。 */
function isChapterEnd(){const d=curStage();return !!d.boss||!!d.finale;}
/* 本关大王配置：第二/三章查 ZB，第一章仍按当前战场查 BOSSCFG */
function bossCfg(){
  const d=curStage();
  return (d.ch>=2&&ZB[d.boss])||BOSSCFG[sceneIdx()]||BOSSCFG[0];
}
/* 本关实际配置＝关卡基准 × 场景增量（每次返回新对象，只读属性，安全） */
function stCfg(){
  const b=curStage();
  /* 第二/三章：数值按定稿写死，不再乘场景系数、不随轮次加码——
     这两章的难度靠「血厚的小兵＋地面威胁＋大王招式」堆，不靠数字膨胀 */
  if(b.ch>=2)return {quota:b.quota,v:b.v,gap:b.gap,cap:b.cap,p2:b.p2,p3:b.p3,kind:b.kind,ch:b.ch};
  const s=SCENES[sceneIdx()]||SCENES[0];
  const lv=Math.max(1,Math.min(10,loopN));      // 每进一块新战场只加一点点
  return {
    quota:b.quota+s.quotaAdd+(lv-1),
    v:b.v*s.vmul*(1+(lv-1)*0.06),
    gap:(b.gap*s.gmul)/(1+(lv-1)*0.04),
    cap:b.cap+s.capAdd+Math.floor((lv-1)/2),
    p2:Math.min(0.60,b.p2+s.p2Add+(lv-1)*0.01),
    p3:Math.min(0.35,b.p3+s.p3Add+(lv-1)*0.005)
  };
}
function depthS(y,base,span){
  const d=(y-BAND_TOP)/(BAND_BOT-BAND_TOP);
  return base+d*span;
}
function heroS(){return depthS(G.hero.y,86,30);}   // 远近大小差拉大＝更立体（人物画法不变）

function resetGame(stage){
  G.score=0;G.hearts=3;G.bonus=0;G.stage=stage||1;G.kills=0;
  G.zs.length=0;G.bls.length=0;G.ps.length=0;G.ebs.length=0;
  G.bolts.length=0;G.cs.length=0;G.flash=0;G.laser=null;
  clearGts();
  G.bossOut=false;G.bossDone=false;G.spawnT=1.1;G.shake=0;
  G.seen={};                                  // 重开一局＝丧尸兵种重新报一遍名
  const h=G.hero;
  h.x=h.tx=230;h.lane=2;h.y=h.ty=laneY(2);h.inv=0;h.cd=0.5;h.fire=0;
  h.shield=0;h.shFx=0;h.shBr=0;                 // 重开一局＝盾清零（撑开的那一下已经消耗掉了，和炸弹一样不返）
  applyStageBG();                             // 重新玩＝回第 1 关（用选好的那个场景）
  G.quota=stCfg().quota;                      // 场景定好后再按本场景算血量配额
  resetFlags();                               // 5 面旗全部立回来
}
function nextStage(){
  G.stage++;G.kills=0;G.bossOut=false;G.bossDone=false;
  applyStageBG();                             // 同一场景内进入下一关
  G.quota=stCfg().quota;
  G.zs.length=0;G.bls.length=0;G.ebs.length=0;G.spawnT=1.1;
  G.bolts.length=0;G.cs.length=0;G.flash=0;G.laser=null;
  clearGts();
  G.hearts=Math.min(3,G.hearts+1);          // 过关奖励一颗心
  resetFlags();                             // 下一关旗子重新立满
}
/* 出一只丧尸。type 不传＝第一章的普通绿僵尸（血 1、只走直线），传了＝第二章的五种兵种。
   v 是「当前速度」：独眼丧尸进场先慢后快，靠 v0/v 两个值切换，不动公式。 */
function spawnZombie(lane,type){
  const c=stCfg();
  const k=type?KIND[type]:null;
  if(lane==null)lane=Math.floor(Math.random()*LANES);
  const y=laneY(lane),sB=k?k.s:70;
  const vm=k?(k.dash?k.vm0:k.vm):1,j=0.92+Math.random()*0.16;
  const z={x:GW+80,y,lane,sB,s:depthS(y,sB,30),ph:Math.random()*6,
    boss:false,type:type||'',hp:k?k.hp:1,hpMax:k?k.hp:1,v:c.v*vm*j,
    die:0,dieT:0,sq:0,id:zid++,frz:0};
  if(k){
    if(k.dash){z.v0=c.v*k.vm0*j;z.vH=c.v*k.vm*j;z.dashT=k.dash;}   // 冲刺兵：蓄力 k.dash 秒后猛地提速
    if(k.turn)z.turnT=k.turn*(0.7+Math.random()*0.8);              // 扭来扭去：每隔一会儿换一条路
  }
  /* 会吐的小兵不是每只都有：抽中才挂 SPIT（焕宸原话「小兵不是每个都吐，就有些小兵会吐」）。
     首发留 1.6~3.4 秒提前量——进场先走两步再吐，不至于落地就开炮。 */
  const sp=SPIT[type||'green'];
  if(sp&&Math.random()<sp.p){z.spit=type||'green';z.spitW=0;z.spitCd=1.6+Math.random()*1.8;}
  G.zs.push(z);
  /* 每种新兵种这一局第一次上场时报一次名（小朋友不识字，靠耳朵认人；报过就交给眼睛） */
  if(type&&!G.seen[type]){G.seen[type]=1;sayWhenFree(['zb_'+type],()=>mode==='play');}
}
/* 按本关 kind 权重抽一个兵种（第一章没有 kind，返回空＝老僵尸） */
function pickType(){
  const kd=curStage().kind;
  if(!kd)return '';
  let tot=0;for(const t in kd)tot+=kd[t];
  if(!tot)return '';
  let r=Math.random()*tot;
  for(const t in kd){r-=kd[t];if(r<0)return t;}
  return '';
}
/* 第二章兵种行为（见 KIND 表：每只只有「一条」机制，小朋友一眼看得懂）
   独眼丧尸＝进场蓄力 1 秒后猛地提速；缺牙丧尸＝每隔一会儿随机换一条路（扭来扭去）。
   第一章的僵尸两个计时器都不存在，这个函数直接什么都不做。 */
function stepMinion(z,dt){
  if(z.spit)stepSpit(z,dt);                         // 会吐的小兵：先走「张嘴预警 → 吐」的计时
  if(z.dashT>0){                                    // 独眼：蓄力中（先慢），时间到就蹿出去
    z.dashT-=dt;
    if(z.dashT<=0){
      z.v=z.vH;z.sq=0.18;                           // 提速＋猛地缩一下＝看得见的「它冲了」
      puffFX(G.ps,z.x+z.s*0.4,z.y-z.s*0.18,0.5);
    }
    return;
  }
  if(z.turnT>0){                                    // 缺牙：换路倒计时
    z.turnT-=dt;
    if(z.turnT<=0){
      let nl;do{nl=Math.floor(Math.random()*LANES);}while(nl===z.lane);
      z.tY=laneY(nl);z.turnT=KIND[z.type].turn*(0.7+Math.random()*0.8);   // 各按各的换路节奏（缺牙 1.4s、浮游探针 1.8s）
      puffFX(G.ps,z.x,z.y-z.s*0.4,0.5);             // 挪之前冒一团烟＝沿用大王「我要动了」那套预警语言
    }
  }
  if(z.tY!=null&&z.y!==z.tY){                       // 横着挪过去（比走路快一点，看得清它换了哪条路）
    const dy=z.tY-z.y,st=210*dt;
    z.y=Math.abs(dy)<=st?z.tY:z.y+(dy>0?st:-st);
    z.lane=laneOf(z.y);z.s=depthS(z.y,z.sB,30);     // 挪到哪条路就属于哪条路，体型跟着纵深变
  }
}
/* ---------- 小兵吐弹（见 SPIT 表）----------
   两道闸门是这套东西能不能给小朋友用的关键：
   · 距离闸门：离主角不足 260px 不吐（否则弹飞过来只有 0.2 秒反应＝欺负人）；
   · 预算闸门：场上红路已达安全路预算不吐（大王在封路时，小兵绝不再加一层）。
   预警那 0.5~0.6 秒里它一边张嘴发红一边"呜"一声，声音和画面都给足，听不见也能看见。 */
function stepSpit(z,dt){
  const c=SPIT[z.spit];
  if(z.spitW>0){                                      // 预警中：时间到就吐出去
    z.spitW-=dt;
    if(z.spitW<=0)minionSpit(z,c);
    return;
  }
  z.spitCd-=dt;
  if(z.spitCd>0)return;
  if(z.x-G.hero.x<260){z.spitCd=0.6;return;}            // 太近了：等它再往前走两步
  if(claimCount()>=laneBudget()){z.spitCd=0.9;return;}  // 路已经够红了：不跟大王抢
  z.spitW=c.warn;z.sq=0.16;
  puffFX(G.ps,z.x-z.s*0.24,z.y-z.s*0.30,z.s/80);
  sfx('spitwarn');
}
/* 小兵弹的视觉倍率：第四篇章（关 12~14）的降级体体型 s=96~112，弹还按第一章的小尺寸画，
   焕宸反馈「子弹太小不太清楚」。按体型等比放大弹体（70 为第一章基准，上限 1.6 倍免得糊屏）；
   只改绘制尺寸，命中判定与弹速不动 ⇒ 放大纯粹更易读，不会变相变难。 */
function bulletK(z){const s=z.s||70;return Math.max(1,Math.min(1.6,s/70));}
function minionSpit(z,c){
  const y=laneY(z.lane)-8;
  G.ebs.push({x:z.x-z.s*0.30,y,lane:z.lane,vx:-c.v,rot:0,shot:c.shot,k:bulletK(z)});
  z.spitCd=c.gap[0]+Math.random()*(c.gap[1]-c.gap[0]);
  puffFX(G.ps,z.x-z.s*0.34,y-2,z.s/90);

}
/* 出一波怪：按本关概率决定 1~3 只，且分别落在互不相同的路上（不叠路），受同屏上限约束 */
function spawnWave(){
  const c=stCfg();
  let alive=0;for(const z of G.zs)if(!z.die)alive++;
  const room=Math.max(0,c.cap-alive);
  if(room<=0)return;
  let n=1;const r=Math.random();
  if(c.p3&&r<c.p3)n=3;
  else if(c.p2&&r<c.p2+c.p3)n=2;
  if(n>room)n=room;
  const lanes=[];for(let i=0;i<LANES;i++)lanes.push(i);
  for(let i=lanes.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=lanes[i];lanes[i]=lanes[j];lanes[j]=t;}
  for(let k=0;k<n;k++)spawnZombie(lanes[k],pickType());
}
/* 生成一只大王（第一章每关 1 只；终章调三次，三只同场） */
function makeBoss(cfg,hp,lane,xOff){
  const y=laneY(lane);
  const z={x:GW+xOff,y,lane,s:depthS(y,138,40),ph:0,boss:true,hp,hpMax:hp,
    v:cfg.v||34,die:0,dieT:0,tY:y,swT:2.0,sq:0,lv:Math.max(1,Math.min(10,loopN)),id:zid++,frz:0,
    minX:GW*0.68,                                 // 靠右站位的下限；终章三只各自再往后挪，站成阶梯
    cfg,phase:1,fireT:1.6,tele:0,teleLanes:[],minionT:cfg.minionT,   // fireT＝几秒后开火，tele＝预警剩余
    /* 第二章招式状态：weakT/weakMul＝破绽窗口；furnT/emberT＝炉子；hopT/slamSt/slamLeft＝骨锤；
       swpSt＝长臂；aura/auraHp＝终章接力主攻。第一章大王没有 mech，这些字段只是躺着不动。 */
    weakT:0,weakMul:1,weakHits:0,furnT:0,emberT:1.2,
    atkT:(cfg.atkT||99)*0.7,hopT:1.6,slamSt:0,slamT:0,slamLeft:0,
    /* ovSeq＝总王「上一式」的序号，写死 2（火柱）→ 首招就是 (2+1)%3=0 骨锤连砸，
       和 FR-114 的一二三式顺序对上；其余大王不进这个轮换，字段只是躺着不动。 */
    ovSeq:2,
    swpSt:0,swpT:0,aura:0,auraHp:0,trioI:0};
  G.zs.push(z);
  return z;
}
function spawnBoss(){
  const d=curStage(),cfg=bossCfg();          // 第一章＝本战场 BOSSCFG；第二章＝ZB 里的大王
  const lv=Math.max(1,Math.min(10,loopN));   // 第一章 BOSS 随轮次略微加血；第二章数值写死，不加成
  for(const z of G.zs){                       // 场上普通僵尸转身撤退，不硬清
    if(!z.boss&&!z.die){z.leave=true;z.ph=0;}   // 只标记转身撤退，不当场冒烟（烟留到走出屏幕后再冒）
  }
  G.ebs.length=0;
  clearGts();                                 // 大王登场前把地面火苗/震波全部抹掉，进场那一下是干净的
  /* BOSS 战礼物：第一章按战场送 1/2/3 颗星星；第二/三章大王送 2 颗，终章三只合体送 3 颗。
     星星＝多出来的命（挨打先扣星星，扣完才扣红心），
     小朋友输得起才敢练走位，不会一挨打就崩 */
  const starN=d.ch>=2?(cfg.trio?3:2):sceneIdx()+1;
  if(cfg.trio){
    /* 终章：三只大王同场，上/中/下三路各一只，x 前后错开（谁当主攻由 stepFinale 轮换）。
       lanes 按 trio 的顺序取：火柱王→路 2、骨锤王→路 4、拖地长臂王→路 0。
       最上面那条路（路 0）离三条血条最近，所以让最矮的长臂王守它，
       最高的两只（背上骨件 72u）走中排和下排——站位与血条的算法见 BOSS_ZK 表头注释。 */
    const lanes=[2,4,0];
    for(let i=0;i<cfg.trio.length;i++){

      b.trioI=i;                                 // 接力主攻按这个编号轮换（stepFinale 每 12 秒或打掉 5 血换人）
      b.minX=GW*(0.68+i*0.07);                   // 越往下站得越靠右，三只错开成阶梯，一眼分得清谁是谁
    }
    /* 狂暴线用「开局三只的总血」当分母，不是「当前存活大王的总血」——
       否则先打死一只，存活总血从 54 掉到 38，一进场就已经过半，第二只还没打就突然狂暴。 */
    let finSum=0;for(const h of cfg.finHp)finSum+=h;

    G.bossName=cfg.name;
  }else{
    const hp=d.ch>=2?cfg.hp:Math.min(99,Math.round(cfg.hp*(1+(lv-1)*0.05)));
    makeBoss(cfg,hp,1+Math.floor(Math.random()*(LANES-2)),150);
    G.bossName=cfg.name;
  }
  G.bossOut=true;
  G.bonus=starN;
  updateHUD();
  /* 星星从主角身上炸开一小圈，让小朋友一眼看到"来星星了" */
  const hx=G.hero.x,hy=G.hero.y-heroS()*0.5,n=starN*4;
  for(let i=0;i<n;i++){
    const an=i/n*Math.PI*2+Math.random()*0.35,v=90+Math.random()*110;
    G.ps.push({kind:'star',x:hx,y:hy,vx:Math.cos(an)*v,vy:Math.sin(an)*v-60,
      life:0.7+Math.random()*0.35,t:0,c:'#ffd740',r:4.5+Math.random()*2.2,
    /* g 写 0＝不往下坠（引擎里 g 是开关不是数值，非 0 一律 300px/s² 猛掉）；
       星星原地炸开、转着圈淡出，像礼花纸屑 */
      rot:Math.random()*6,vr:(Math.random()-0.5)*14,g:0});
  }
  banner('💀 '+cfg.name+' 来啦！⭐×'+starN,3.5);   // 比原来 1.5 秒长一倍，名字看得清；但打斗中大字不能久留，免得挡住子弹
  sfx('boss');
  /* 台词缩短：原来 34 字要读 9.5 秒，期间打到半血就会被"狂暴"那句顶掉，安全提示听不完 */
  if(cfg.trio)say([bossVoiceKey(cfg.name),cfg.uniteKey||'unite','star'+starN]);   // 第二章合体＝boss_finale+unite，第三章＝boss_trio3+unite3
  else say([bossVoiceKey(cfg.name),cfg.warnKey,'star'+starN]);
}
/* ========== 安全路预算（2026-10-20 削弱大王的总闸）==========
   焕宸原话：「子弹是三个，而且还会三条路同时发出特殊攻击，没有躲避的空间」。
   病因不是哪个数字太大，而是两套系统互不知情：弹幕（stepBoss 的 fireT → bossFire）
   和地面招式（stepBossMech 的 atkT → 火柱/震波/横扫）各自计时、各自选路，
   而老版"留 2 条安全路"只约束自己出手的那一次——两边各占 3 条，并集就是 5 条全红。
   现在改成一个全局预算：同一瞬间最多只有 laneBudget() 条路是红的，
   谁要封路都得先来查一遍"哪些路已经红了"；预算用不完就挑干净路，
   用完了就借用已经红着的那条（那条路本来就站不了人，多压一颗子弹不多坑他一次）。
   大王弹幕、火柱、震波、横扫、小兵吐弹全走这一个口径，没有谁可以绕过去。 */
function laneBudget(){
  for(const z of G.zs)if(z.boss&&!z.die&&z.phase===2)return 3;  // 半血狂暴（含三王合体狂暴）也只封 3 条
  return 2;                          // 平时封 2 条＝场上始终有 3 条干净路可站
}
/* 此刻哪些路＝"站上去必挨打"。火星坑（pool）只在大王脚边那一小块、主角够不着，不算封路。 */
function laneClaimMask(){
  const mark=[];for(let i=0;i<LANES;i++)mark.push(0);
  for(const e of G.gts){
    if(e.kind==='pool')continue;
    for(const ln of (e.lanes||[e.lane]))if(ln>=0&&ln<LANES)mark[ln]=1;
  }
  for(const z of G.zs){
    if(z.die)continue;
    if(z.boss){if(z.tele>0)for(const ln of (z.teleLanes||[]))if(ln>=0&&ln<LANES)mark[ln]=1;}
    else if(z.spitW>0)mark[z.lane]=1;                    // 正在张嘴的小兵：这条路已经算红了
  }
  const hx=G.hero.x;
  for(const b of G.ebs)if(b.x>hx-10)mark[b.lane]=1;      // 还在主角右边、真追得到他的弹；飞过去的早不算
  return mark;
}
function claimCount(){const m=laneClaimMask();let n=0;for(let i=0;i<LANES;i++)n+=m[i];return n;}
/* 选目标路：先在预算内挑干净路，不够再借用已经红着的路；两种都是离主角近的优先。 */
function bossTargetLanes(count){
  const hl=G.hero.lane,mark=laneClaimMask(),free=[],hot=[];
  for(let i=0;i<LANES;i++)(mark[i]?hot:free).push(i);
  const byDist=(a,b)=>Math.abs(a-hl)-Math.abs(b-hl);
  free.sort(byDist);hot.sort(byDist);
  const n=Math.max(1,Math.min(count,LANES-2));
  const room=Math.max(0,laneBudget()-claimCount());      // 还允许新涂红几条路
  const pick=free.slice(0,Math.min(n,room));
  for(let i=0;pick.length<n&&i<hot.length;i++)pick.push(hot[i]);
  return pick;
}
/* BOSS 开火：在选定的路上各生成一颗向左飞的子弹（按路飞，切路就能躲） */
function bossFire(z){
  const bspd=z.cfg.bspd*(z.phase===2?1.05:1)*(1+Math.min(0.35,(z.lv||1)-1)*0.03);   // 狂暴只略微提速：变的是"多快"，不是"几条路"
  for(const ln of z.teleLanes){
    G.ebs.push({x:z.x-z.s*0.30,y:laneY(ln)-8,lane:ln,vx:-bspd,rot:0});
  }
  puffFX(G.ps,z.x-z.s*0.34,z.y-z.s*0.5,z.s/70);
  sfx('bossshoot');
}
/* ========== 第二章：地面威胁 + 三只大王的招式 ==========
   铁律（小朋友不识字，只能靠眼睛）：任何能伤到他的东西，都要先在路面「看得见地发红/变暗」够久。
   所以 addGt 把预警时长一律抬到 ≥0.5 秒兜底，谁写招式都别想漏。
   一条威胁的生命周期：warn（路面预警）→ dur（真的会伤人）→ 自己消失；hit 让它一次最多只扣一下。 */
function clearGts(){G.gts.length=0;G.bossHold=0;G.auraT=0;G.finRage=false;G.finTotal=0;}
function addGt(e){e.t=0;e.hit=0;e.warn=Math.max(0.5,e.warn||0.6);G.gts.push(e);return e;}
function gWarn(z,w){return (isFinalStage()&&z.phase===2)?Math.max(1.2,w):w;}   // 合体狂暴：地面预警一律拉到 1.2 秒
/* 骨锤震波：只砸它自己脚底下那 1 条路。
   原来是 ±1 共三条，而且判定是"铺满整条路即中"＝一次招封死三条必死路，
   再叠上同一时刻的弹幕，小朋友除了原地没地方可去——这是"骨锤最难"的真正原因。 */
function gtHit(e){
  const h=G.hero,ls=e.lanes||[e.lane];
  if(ls.indexOf(h.lane)<0)return false;
  if(e.kind==='quake')return true;                       // 震波：整条路裂开，只有换路才躲得掉
  if(e.kind==='sweep')return Math.abs(h.x-e.x)<=e.w;     // 长臂横扫：暗影扫到哪儿烧到哪儿，换路是唯一躲法
  return Math.abs(h.x-e.x)<=(e.kind==='pool'?40:48);     // 火柱／火苗：挪开身子或换条路都躲得掉
}
function stepGts(dt){
  const h=G.hero;
  for(let i=G.gts.length-1;i>=0;i--){
    const e=G.gts[i];e.t+=dt;
    const a=e.t-e.warn;
    if(e.kind==='sweep'&&a>0)e.x=GW+50-(GW+70-XMIN)*(a/e.dur);   // 手臂从右边一路拖到左边
    if(a>=0&&a<=e.dur&&mode==='play'&&h.inv<=0&&!e.hit&&gtHit(e)){
      e.hit=1;hurt();
      if(mode!=='play')return;                          // 已经 gameOver
    }
    if(e.t>=e.warn+e.dur)G.gts.splice(i,1);
  }
}
/* 弱点窗口＝招式打完露出的那 1~2 秒破绽，不是屏幕上某个像素。
   为什么不用「打中头部坐标」判定：主角的子弹只认同一条路、而且一律打在路中心线上，
   靠 y 偏移区分头/身子根本不可靠；规格原文本来也是时间语义（卡锤那 1.5 秒打头、收臂那一下打眼）。 */
function openWeak(z,mul,secs){z.weakMul=mul;z.weakT=Math.max(z.weakT||0,secs);}
function weakFx(z){
  const k=z.s/52,w=weakPos(z),cx=w.x,cy=w.y;            // 金星从真正露出来的那个零件上炸开

      life:0.45,t:0,c:i%2?'#fff176':'#ffd740',r:4.5*k+2,rot:Math.random()*6,vr:(Math.random()-0.5)*14,g:1});
  }
  G.ps.push({kind:'ring',x:cx,y:cy,vx:0,vy:0,life:0.26,t:0,c:'#ffd740',r:8,gr:250,g:0});
  sfx('coin');
}
/* 1B 背炉火柱王：往主角那条路吐火柱（地面先发红再窜火），走路一路掉火星。
   破绽＝吐完火柱炉门开着，这 1.8 秒打它背后发红的炉膛 ×2，攒够四次炉子「哐」地塌、火柱停 2 秒。 */
function mechFurnace(z,dt){
  if(z.furnT>0){z.furnT-=dt;}                           // 炉子塌了：这两秒吐不出火柱
  z.emberT-=dt;
  if(z.emberT<=0){
    z.emberT=(z.phase===2?0.7:1.25)*(0.8+Math.random()*0.5);
    addGt({kind:'pool',lane:z.lane,x:z.x-z.s*0.34,warn:0.6,dur:3.0});   // 火星落地先烫红一下，再窜火苗烧 3 秒
    for(let i=0;i<3;i++){
      G.ps.push({kind:'smoke',x:z.x+z.s*0.26,y:z.y-z.s*0.95,vx:-40-Math.random()*46,vy:-16+Math.random()*26,  // 从背上炉顶冒
        life:0.5,t:0,c:i%2?'#ffca28':'#ff7043',r:3+Math.random()*3,gr:10,g:1});
    }
  }
  if(z.furnT>0)return;
  z.atkT-=dt;
  if(z.atkT>0)return;
  z.atkT=(z.phase===2?z.cfg.atkT2:z.cfg.atkT)*(0.85+Math.random()*0.3);
  for(const ln of bossTargetLanes(z.phase===2?2:1))     // 狂暴＝一次烧两条路，而且柱更高（tall 交给绘制层定像素）
    addGt({kind:'pillar',lane:ln,x:Math.max(XMIN+40,Math.min(GW-80,G.hero.x)),warn:gWarn(z,z.cfg.warn),dur:z.phase===2?0.85:0.6,tall:z.phase===2?1:0});
  openWeak(z,2,1.8);
  sfx('bossshoot');
}
function furnaceBreak(z){
  z.furnT=2.0;z.weakHits=0;
  banner('💥 炉子塌啦！',1.8);sfx('boom');G.shake=Math.max(G.shake,0.8);addHitStop(0.1);
  const w=weakPos(z);                                       // 烟从背上那只炉子上冒，不是凭空冒
  for(let i=0;i<14;i++){
    G.ps.push({kind:'smoke',x:w.x+(Math.random()-0.5)*z.s*0.5,y:w.y-z.s*0.1,
      vx:(Math.random()-0.5)*70,vy:-30-Math.random()*70,life:0.6+Math.random()*0.3,t:0,
      c:i%3===0?'#ffca28':(i%3===1?'#ff7043':'#8d6e63'),r:5+Math.random()*6,gr:14,g:1});
  }

/* 2B 骨锤独腿王：不换路，只单脚蹦到隔壁那条路（蹦前先把骨锤往那边歪）。
   一式三步：举锤（它脚下那条路整条发红 1 秒）→ 砸下（只砸那 1 条路）→ 锤子卡地 1.5 秒＝打头 ×3。 */
function raiseHammer(z){
  /* 举锤前也得查安全路预算——震波判定是"整条路即中"，比谁都狠，绝不能偷偷多封一条。
     脚下这条路本来就红着（别人的火柱／弹幕压着）＝借用，不新增封路，照砸；
     路是干净的而红路已经占满预算＝砸不了，让 mechHammer 过一会儿再来问一次。
     终章三王同场最容易撞车，少了这道闸门就会出现实测到的"三条路一起红"。 */
  const m=laneClaimMask();
  if(m[z.lane]===0&&claimCount()>=laneBudget())return false;
  z.slamSt=1;z.slamT=gWarn(z,z.cfg.warn);
  addGt({kind:'quake',lanes:[z.lane],warn:z.slamT,dur:0.36});
  return true;
}
function mechHammer(z,dt){
  if(z.slamSt===1){                                   // 举锤中：这一步它什么都不干，小朋友只看得到「要砸哪」
    z.slamT-=dt;
    if(z.slamT<=0){
      z.slamSt=2;z.slamT=1.5;openWeak(z,3,1.5);       // 砸下去＝卡地 1.5 秒，打头 ×3 的窗口
      G.shake=Math.max(G.shake,0.8);addHitStop(0.06);sfx('boom');
      puffFX(G.ps,z.x-z.s*0.2,laneY(z.lane)-4,z.s/70);   // 碎烟只从砸下去那 1 条路上蹿
    }
    return;
  }
  if(z.slamSt===2){                                   // 卡地：站着挨打
    z.slamT-=dt;
    if(z.slamT<=0){
      z.slamSt=0;
      /* 半血狂暴＝连砸两下；第二锤要是赶上红路满了，就留着这一下、0.3 秒后再来问 */
      if(z.slamLeft>0){if(raiseHammer(z))z.slamLeft--;else z.atkT=0.3;}
      else z.atkT=(z.phase===2?z.cfg.atkT2:z.cfg.atkT)*(0.9+Math.random()*0.25);
    }
    return;
  }
  z.atkT-=dt;
  if(z.atkT<=0){if(raiseHammer(z))z.slamLeft=z.phase===2?1:0;else z.atkT=0.3;return;}
  /* 单脚蹦是骨锤王独有的移动方式；活塞重锤王是机甲双腿，不蹦——
     它出招间隙的换路交给 stepBoss 的通用随机换路（piston 不在 lock 名单里）。 */
  if(z.cfg.mech!=='hammer')return;
  z.hopT-=dt;
  if(z.hopT<=0&&z.y===z.tY){                          // 只蹦隔壁一条路，不会满场乱跳
    const nl=Math.max(0,Math.min(LANES-1,z.lane+(Math.random()<0.5?-1:1)));
    if(nl!==z.lane){z.tY=laneY(nl);z.hopT=2.4+Math.random()*1.4;}
    else z.hopT=0.6;
  }
}
/* 3B 拖地长臂王：贴地横扫（那条路整条压暗，右端一只越举越亮的臂爪标出起点和方向）。
   横扫从 x=1010 一路拖到 70，主角能站的区间（90~499）全在里面 ⇒ 预警只能报整条路，
   绝不允许"只画一截暗影"——那等于让小朋友站在一条看起来没危险、实际必挨打的路里。
   弹幕＝先亮 0.5 秒粉色瞄准光带标明要打哪几条路，再照着那几条发（选路仍追最近的主角，没有盲侧）。
   破绽＝手臂扫完收回那一下，打它头上唯一亮着的那只眼窝 ×2。 */
function mechDrag(z,dt){
  if(z.swpSt){                                        // 手臂甩出去＋收回来这段时间它腾不出手
    z.swpT-=dt;
    if(z.swpT<=0){
      z.swpSt=0;openWeak(z,2,1.2);
      z.atkT=(z.phase===2?z.cfg.atkT2:z.cfg.atkT)*(0.9+Math.random()*0.25);
    }
    return;
  }
  z.atkT-=dt;
  if(z.atkT>0)return;
  z.swpSt=1;
  const w=gWarn(z,z.cfg.warn);
  /* 平时和狂暴都只扫 2 条：横扫是"整条路都不能站"，封 3 条再叠弹幕就又是死局。
     狂暴体现在扫得更快（atkT2）和臂爪更亮，不体现在多封一条路。 */
  addGt({kind:'sweep',lanes:bossTargetLanes(2),x:GW+50,w:54,warn:w,dur:0.85});
  z.swpT=w+0.85+0.3;
  sfx('bossshoot');
}
/* 10B 机库王：背上库门先亮 0.8 秒红光（预警音），门开 2 秒＝打控制台窗口（×2），
   开门同时放浮游探针（常规 1 只、狂暴 2 只，全场 drone 同屏不超 minionCap=2）。
   门的状态复用锤王举/砸的 slamSt/slamT 字段：slamSt=1 红光预警、slamSt=2 门开挨打——
   「先预警后生效」的语言和其他大王一模一样，小朋友不用重新学。
   它不封任何路（威胁来自子弹和探针），所以不占安全路预算、也不需要查闸门。 */
function mechHangar(z,dt){
  if(z.slamSt===1){                                   // 库门红光预警中：它什么都不干，小朋友只听"呜——"
    z.slamT-=dt;
    if(z.slamT<=0){
      z.slamSt=2;z.slamT=2.0;openWeak(z,2,2.0);
      const w=weakPos(z);                             // 门开的瞬间红圈炸开＝看得见的"现在打这里"
      G.ps.push({kind:'ring',x:w.x,y:w.y,vx:0,vy:0,life:0.32,t:0,c:'#ff5252',r:10,gr:220,g:0});
      let m=0;for(const o of G.zs)if(!o.boss&&!o.die&&o.type==='drone')m++;
      const n=z.phase===2?2:1;
      for(let i=0;i<n;i++){
        if(m>=(isFinalStage()?1:z.cfg.minionCap))break;   // 终章机库王同场还有俩，探针只留 1 只
        spawnZombie(null,'drone');m++;
      }
    }
    return;
  }
  if(z.slamSt===2){                                   // 门开着：站着挨打
    z.slamT-=dt;
    if(z.slamT<=0){z.slamSt=0;z.atkT=(z.phase===2?z.cfg.atkT2:z.cfg.atkT)*(0.9+Math.random()*0.25);}
    return;
  }
  z.atkT-=dt;
  if(z.atkT>0)return;
  z.slamSt=1;z.slamT=gWarn(z,z.cfg.warn);sfx('spitwarn');
}
/* 关 15 末日总王：把前面三章的招牌招式串成一整套连击，三式按 ovSeq 轮换——
   一式骨锤连砸（照搬骨锤王／活塞王那套举→砸→卡地挨打）、二式灭世横扫（照搬长臂王／钻头臂王）、
   三式末日火柱（照搬火柱王那行 addGt，地面自己会先发红，不必再造第二阶段）。
   关键：正在进行中的招式交回原函数收尾，只在 slamSt／swpSt 为真时才进去，
   原函数的 idle 分支就永远不会跑——两套 atkT 计时器同一时刻只有一套在走，不会互相抢发招。
   破绽窗口都由原函数开（砸完 ×3、扫完 ×2、吐完 ×2），亮的都是冠心那颗红宝石。 */
function mechOverlord(z,dt){
  if(z.slamSt){mechHammer(z,dt);return;}
  if(z.swpSt){mechDrag(z,dt);return;}
  z.atkT-=dt;
  if(z.atkT>0)return;
  /* 狂暴连砸欠下来的第二锤：上一锤卡地结束时红路占满预算，raiseHammer 没举手，
     这一下记在 slamLeft 里没清掉。换招之前先把它补上——补锤不算换式，ovSeq 不动，
     补完下一轮照旧从横扫接上。少了这段，欠的这锤会被下面的轮换直接跳过。 */
  if(z.slamLeft>0){
    if(!raiseHammer(z)){z.atkT=0.3;return;}
    z.slamLeft--;return;
  }
  const nx=(z.ovSeq+1)%3;
  if(nx===0){                                     // 一式 末日骨锤：狂暴＝连砸两下
    /* 红路占满预算时举不了锤，0.3 秒后再来问一次；这一下不算它换招，轮换序号留着下次照砸 */
    if(!raiseHammer(z)){z.atkT=0.3;return;}
    z.ovSeq=0;z.slamLeft=z.phase===2?1:0;return;
  }
  if(nx===1){                                     // 二式 灭世横扫：整条路都不能站，只封 2 条
    z.ovSeq=1;z.swpSt=1;
    const w=gWarn(z,z.cfg.warn);
    addGt({kind:'sweep',lanes:bossTargetLanes(2),x:GW+50,w:54,warn:w,dur:0.85});
    z.swpT=w+0.85+0.3;sfx('bossshoot');return;
  }
  z.ovSeq=2;                                      // 三式 末日火柱：狂暴＝一次烧两条路，柱更高
  z.atkT=(z.phase===2?z.cfg.atkT2:z.cfg.atkT)*(0.9+Math.random()*0.25);
  for(const ln of bossTargetLanes(z.phase===2?2:1))
    addGt({kind:'pillar',lane:ln,x:Math.max(XMIN+40,Math.min(GW-80,G.hero.x)),warn:gWarn(z,z.cfg.warn),dur:z.phase===2?0.85:0.6,tall:z.phase===2?1:0});
  openWeak(z,2,1.8);
  sfx('bossshoot');
}
function stepBossMech(z,dt){
  if(z.cfg.mech==='overlord')mechOverlord(z,dt);                 // 关 15：三式连击，见 mechOverlord
  else if(z.cfg.mech==='furnace')mechFurnace(z,dt);
  else if(z.cfg.mech==='hammer'||z.cfg.mech==='piston')mechHammer(z,dt);  // 活塞重锤王＝锤王举/砸原样复用，去掉单脚蹦（见 mechHammer 内部分岔）
  else if(z.cfg.mech==='drag'||z.cfg.mech==='drill')mechDrag(z,dt);       // 钻头臂王＝长臂王的贴地横扫原样复用，只换皮
  else if(z.cfg.mech==='hangar')mechHangar(z,dt);
}
/* ---------- 终章：三只大王同场，接力当主攻；三只总血过半一起狂暴 ---------- */
function pickAura(cur){
  const bs=[];for(const z of G.zs)if(z.boss&&!z.die)bs.push(z);
  if(!bs.length)return null;
  if(!cur)return bs.reduce((a,b)=>b.trioI<a.trioI?b:a);          // 开场（或上一任刚被打倒）：轮次最靠前的先来
  let next=null,best=9;
  for(const z of bs){const d=(z.trioI-cur.trioI+3)%3;if(d>0&&d<best){best=d;next=z;}}
  return next||cur;                                              // 只剩它一只＝不用再换
}
function setAura(next,cur){
  if(cur)cur.aura=0;
  next.aura=1;next.auraHp=next.hp;G.auraT=12;
  if(!cur||!isFinalStage())return;
  /* 接力交接这 1.5 秒是刻意给的「喘息」：在飞的子弹清掉（ebs），刚冒烟还没射出的那发也一并撤销（tele）。
     小朋友这会儿该盯的是新主攻头顶那颗星＋听报名，不是旧主攻的烟；
     停手期内三只的 fireT 都不走（act 为假），交接后由新主攻自己重新倒计时、重新冒烟，不存在补射。
     单只大王的关卡走不到这里（isFinalStage 拦掉），它的预警照旧兑现，见 stepBoss。 */
  G.ebs.length=0;G.bossHold=1.5;                                 // 轮换那一下全场停手 1.5 秒：看得清是谁、听得清是谁
  for(const z of G.zs)if(z.boss)z.tele=0;
  banner('⭐ 现在是 '+next.cfg.name+' 主攻！',2.8);sfx('coin');
  sayWhenFree([bossVoiceKey(next.cfg.name),'zhugong'],()=>mode==='play'||mode==='pause');
}
function stepFinale(dt){
  if(G.bossHold>0)G.bossHold-=dt;
  G.auraT-=dt;
  let cur=null;const bs=[];
  for(const z of G.zs)if(z.boss&&!z.die){bs.push(z);if(z.aura)cur=z;}
  if(!bs.length)return;
  let hp=0;for(const z of bs)hp+=z.hp;
  if(!G.finRage&&hp<=G.finTotal/2){                              // 三只总血过半＝合体狂暴：三招连着来
    G.finRage=true;
    for(const z of bs){z.phase=2;z.fireT=Math.min(z.fireT,1.0);z.atkT=Math.min(z.atkT,1.2);}
    banner('🔥 '+G.bossName+'狂暴啦！',3.2);sfx('boss');   // 第二章＝三王合体、第三章＝三机王合体，名字跟着本关大王走
    sayWhenFree(['rage1',bossVoiceKey(bossCfg().name),'rage2'],()=>mode==='play'||mode==='pause');
  }
  if(!cur){const n=pickAura(null);if(n)setAura(n,null);}          // 主攻刚被打倒：安静交棒，不重复播报
  else if(G.auraT<=0||cur.auraHp-cur.hp>=5){                      // 12 秒到点，或它已被打掉 5 血＝换人
    const next=pickAura(cur);
    if(next!==cur)setAura(next,cur);
    else{cur.auraHp=cur.hp;G.auraT=12;}                           // 只剩它一只＝再给它 12 秒
  }
}

/* BOSS：走到场中就站住，随机换路；定期预警后发射子弹；半血狂暴；沙漠还会召唤小怪 */
function stepBoss(z,dt){
  /* 冻住时不会走到这里：主循环是 if(z.frz>0){计时} else {走路; stepBoss()}，
     所以 BOSS 被冻住时既不挪路也不开火，计时也由主循环统一扣，这里不用再判一次。 */
  z.x=Math.max(z.x,z.minX);                    // 靠右站位，贴脸时子弹也有反应时间（终章三只各停各的线）
  if(z.weakT>0)z.weakT-=dt;                    // 破绽窗口到点自己关上
  /* 终章：只有头顶星星的「主攻」会出手；交接那 1.5 秒全场停手。
     已经亮起的预警（tele）照旧兑现——小朋友看见烟了就一定要等到那发子弹，不能骗他。
     唯一例外是三王接力交接：setAura 会把没兑现的预警连同子弹一起清掉当作喘息（那里写明了理由）。 */
  const act=!isFinalStage()||(z.aura&&G.bossHold<=0);
  /* E：血量过半 → 狂暴（射得更快、路数更多） */
  if(z.phase===1&&z.hp<=z.hpMax/2){
    z.phase=2;z.fireT=Math.min(z.fireT,0.8);
    /* 终章不在这儿喊：三只各喊一遍小朋友只听到一片吵，改由 stepFinale 播「三王合体狂暴」 */
    if(!isFinalStage()){
      banner('💢 '+z.cfg.name+' 狂暴啦！',3.5);sfx('boss');   // 同上：打斗中横幅不久留，语音才是主要提醒
      /* 排队说，不顶掉登场那句：BOSS 只有 10 点血，几秒就打到半血，
         硬顶会让小朋友永远听不完"看到冒烟就赶紧换路"这个安全提示 */
      sayWhenFree(['rage1',bossVoiceKey(z.cfg.name),'rage2'],()=>mode==='play'||mode==='pause');
    }
  }
  /* A/B：预警 0.5 秒（冒烟）后发射；间隔与路数取决于是否狂暴 */
  if(z.tele>0){
    z.tele-=dt;
    if(z.tele<=0)bossFire(z);
  }else if(act){
    z.fireT-=dt;
    if(z.fireT<=0){
      z.fireT=(z.phase===2?z.cfg.p2Fire:z.cfg.fireT)*(0.85+Math.random()*0.3);
      z.teleLanes=bossTargetLanes(z.phase===2?z.cfg.p2Lanes:z.cfg.lanes);
      z.tele=0.5;
      puffFX(G.ps,z.x-z.s*0.30,z.y-z.s*0.5,z.s/60);   // 开火前冒烟预警，看得见
    }
  }
  /* D：沙漠 BOSS 定期召唤小怪（稀疏，同屏有上限，不至于压垮） */
  if(act&&z.cfg.minions){
    z.minionT-=dt;
    let m=0;for(const o of G.zs)if(!o.boss&&!o.die)m++;
    if(z.minionT<=0){
      z.minionT=z.cfg.minionT;
      /* 终章三只同场：每只最多留 1 个小兵（会召唤的只有骨锤/长臂，加起来＝全场 2 只，淹不死人） */
      if(m<(isFinalStage()?1:z.cfg.minionCap))spawnZombie(null,pickType());   // 第一章没有 kind 权重＝还是普通绿僵尸；第二章召的是本关兵种
    }
  }
  /* 第二章：各走各的招式（地面威胁＋破绽窗口） */
  if(act&&z.cfg.mech)stepBossMech(z,dt);
  /* 骨锤靠「蹦到隔壁路」移动；任何一只正在出招时也不换路——出招和走位分开，小朋友才读得懂 */
  const lock=z.cfg.mech==='hammer'||z.slamSt||z.swpSt;
  z.swT-=dt;
  if(act&&!lock&&z.swT<=0&&z.y===z.tY){         // 已经站稳了才换路
    let nl;do{nl=Math.floor(Math.random()*LANES);}while(nl===z.lane);
    z.tY=laneY(nl);z.swT=2.2+Math.random()*1.8;
    puffFX(G.ps,z.x,z.y-z.s*0.4,z.s/60);       // 换路前冒一团烟，看得见它要动
  }
  const dy=z.tY-z.y,st=170*dt;                 // 横着挪过去（比走路快，看得清）
  if(Math.abs(dy)<=st)z.y=z.tY;else z.y+=(dy>0?st:-st);
  z.lane=laneOf(z.y);                          // 挪到哪条路就属于哪条路（同路才打得到）
  z.s=depthS(z.y,138,40);                      // 越靠前的路越大＝更立体
}

/* ---------- 打击 / 受伤 ---------- */
/* 会炸兵种的死法（火焰丧尸／电焊兵共用）：原地炸一小团，只烧「同一条路 + 贴身范围」的主角。
   教的那件事：别等它走到脸上了才打死它——趁它还在右边就解决。 */
function fireBoom(z){
  const R=KIND[z.type].boom;
  const wl=z.type==='weld';                           // 电焊兵炸的是一簇白蓝焊花，火焰丧尸炸的是橙红火
  G.ps.push({kind:'ring',x:z.x,y:z.y,vx:0,vy:0,life:0.22,t:0,c:wl?'#b3e5fc':'#ff8a65',r:8,gr:150,g:0});
  for(let i=0;i<10;i++){                              // 贴地摊开的火舌＋往上蹿的火星
    const c=wl?(i%3===0?'#ffffff':(i%3===1?'#ffe082':'#81d4fa')):(i%3===0?'#ffca28':(i%3===1?'#ff7043':'#ff5722'));
    G.ps.push({kind:'smoke',x:z.x+(Math.random()-0.5)*R*0.7,y:z.y+(Math.random()-0.5)*10,
      vx:(Math.random()-0.5)*50,vy:-50-Math.random()*80,life:0.28+Math.random()*0.2,t:0,
      c,r:4+Math.random()*5,gr:14,g:0});
  }
  sfx('boom');
  const h=G.hero;
  if(mode==='play'&&h.inv<=0&&h.lane===z.lane&&Math.abs(z.x-h.x)<=R)hurt();
}
/* quiet＝爆炸类伤害专用开关。puffFX 是「一个白色光环＋9 团近白色烟雾」，单发子弹打一只僵尸时很好看；
   但爆炸一次能溅射到十来只，十来团白烟在同一帧一起炸开＝整屏白闪一下。爆炸自己有火光，不需要再配白烟。 */
function hitZ(z,bx,by,dmg,quiet){
  /* 破绽窗口（招式打完那 1~2 秒）：打身体照常，这期间伤害翻倍／三倍，还会冒金星＋叮一声。
     火柱王额外累计：窗口里打够 4 下＝背后炉子「哐」地塌，火柱停 2 秒。 */
  let d=dmg||1;
  if(z.boss&&z.weakT>0){
    d=Math.max(1,Math.round(d*z.weakMul));
    weakFx(z);
    if(z.cfg.mech==='furnace'&&++z.weakHits>=4){z.weakHits=0;furnaceBreak(z);}
  }
  z.hp-=d;
  z.sq=0.18;                                    // 命中即果冻抖一下（squash&stretch）
  if(z.hp>0){
    sfx('hit');
    if(!quiet)puffFX(G.ps,bx,by,0.8);
    z.x+=12;                                  // 击退一点点
    addHitStop(0.035);                        // 极短顿帧：打击更有分量，不打断节奏
    updateHUD();
    return;
  }
  z.die=z.boss?1.6:0.34; z.dieT=0;   // BOSS 倒下慢一点，庆祝动画才看得清
  /* 掉金币（弹出后飞进 HUD 金币盘）：普通＋1、厚血兵＋2、第一章 BOSS＋15、第二章大王＋20、终章每倒一只＋15 */
  /* 赏金：大王 15~20；第四章的大王降级体按 KIND.coin（4~6）；其余照旧（血厚 2 枚、血薄 1 枚） */
  coinBurst(z,z.boss?(curStage().ch>=2&&!isFinalStage()?20:15)
            :((KIND[z.type]&&KIND[z.type].coin)||(z.hpMax>1?2:1)));
  if(!z.boss&&KIND[z.type]&&KIND[z.type].boom)fireBoom(z);   // 会炸的兵种（火焰丧尸/电焊兵）：死时炸一团，站得近就打到（所以趁它在右边打死）
  const k=z.s/52;
  if(!quiet)puffFX(G.ps,z.x,z.y-z.s*0.5,k);   // 噗！一团烟
  G.kills++;
  if(z.boss){
    if(!quiet){                                 // BOSS 体积大，k*1.2 的白烟团能涨到近 100px，被火箭炸死时更要免掉
      puffFX(G.ps,z.x-z.s*0.3,z.y-z.s*0.72,k*1.2);
      puffFX(G.ps,z.x+z.s*0.2,z.y-z.s*0.34,k*1.2);
    }
    G.score+=10;G.shake=1;
    /* 终章三只同场：要全部倒下才算打完（单大王关这个表达式的结果和原来写 true 一样） */
    G.bossDone=G.zs.every(z=>!z.boss||z.die);
    G.ebs.length=0;                             // BOSS 一倒，它射出的子弹全部消失（松一口气）
    /* 地上的火柱/震波也跟着停。注意这里只清地面威胁：终章打死一只时如果连 finRage 一起复位，
       「三王合体狂暴」会重复播报；那些全局状态交给 clearGts（换关／大王登场时才用）。 */
    G.gts.length=0;
    addHitStop(0.16);                         // BOSS 倒下：长顿帧＋震屏，庆祝打击感
    sfx('boss');
  }else{
    G.score++;
    addHitStop(0.05);                         // 普通击杀：中等顿帧
    sfx('hit');
  }
  updateHUD();
}
/* ---------- 金币：从僵尸身上弹出，飞进 HUD 左上角的金币盘 ---------- */
function coinTarget(){
  const r=$('coinPlate').getBoundingClientRect();
  if(!r||r.width===0)return {x:80,y:40};       // HUD 隐藏（结算/菜单）时金币盘没有尺寸：兜底飞向左上角，别飞去 (0,0)
  return {x:(r.left+r.width/2-OX)/S,y:(r.top+r.height/2-OY)/S};   // 金币盘中心换算到逻辑画布坐标
}
function coinBurst(z,total){
  const n=z.boss?5:1,v=Math.ceil(total/n);      // BOSS 的大赏金分 5 枚、错峰起飞
  for(let i=0;i<n;i++)
    G.cs.push({x:z.x,y:z.y-z.s*0.5,vx:(Math.random()-0.5)*140,vy:-(240+Math.random()*120),
      t:-i*0.08,v,sp:0,tg:coinTarget()});
}
function stepCoins(dt){
  for(let i=G.cs.length-1;i>=0;i--){
    const c=G.cs[i];c.t+=dt;
    if(c.t<0)continue;                          // 还没轮到这枚起飞
    if(c.t<0.32){c.vy+=900*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;}   // 先往上蹦一下
    else{                                       // 再加速飞向金币盘，到了＋币＋叮一声
      const dx=c.tg.x-c.x,dy=c.tg.y-c.y,d=Math.hypot(dx,dy);
      c.sp+=1600*dt;
      const st=c.sp*dt;
      if(d<=Math.max(26,st)){
        G.cs.splice(i,1);coins+=c.v;LS.set('moday_coin',String(coins));
        sfx('coin');updateHUD();
      }else{c.x+=dx/d*st;c.y+=dy/d*st;}
    }
  }
}

/* ---------- 武器机制：每种武器生成什么样的子弹、命中后做什么 ---------- */
let tripleAlt=0,boomerAlt=0;                   // 中间路的交替标志：二连飞镖/回旋镖轮流选上、下相邻路
function fireWeapon(w,bx,by,ln){
  const h=G.hero;h.cd=effRate(w);                // 发射节奏由当前武器决定（买了强化就更快，见 effRate）
  if(w.id==='laser'){fireLaser(w.dmg);return;}  // 超级激光：无弹体，从枪口沿本路一道贯穿光束（本路全体各 dmg 伤）
  if(w.multi){                                  // 二连飞镖：本路＋一条相邻路各一颗（边路只有一条相邻路可配，中间路用交替标志轮换）
    tripleAlt=1-tripleAlt;
    const off=ln===0?1:(ln===LANES-1?-1:(tripleAlt?1:-1));
    for(const l of [ln,ln+off]){
      /* 两颗各沿自己那条路的高度飞（保持枪口相对路面的高度差），否则两颗叠成一颗、邻路是隐形的 */
      G.bls.push({kind:'star',x:bx,y:laneY(l)+(by-laneY(ln)),lane:l,vx:w.spd,rot:0,dmg:1,pierce:0,hit:{}});
    }
    sfx('shoot');return;
  }
  if(w.pellets){                                // 散弹枪＝最早版本冲锋战士那把冲锋枪：一梭子 3 发红弹，同一条线上前后错开，不穿透
    for(let i=0;i<w.pellets;i++)
      G.bls.push({kind:'smg',x:bx-i*15,y:by,lane:ln,vx:w.spd,rot:0,dmg:w.dmg,pierce:0,hit:{}});
    sfx('shoot');return;
  }
  const b={kind:w.id==='fast'?'spark':w.id,x:bx,y:by,lane:ln,vx:w.spd,rot:0,dmg:w.dmg,pierce:w.pierce?1:0,hit:{}};
  if(w.back){                                   // 回旋镖：去程本路穿透打全部，回程换相邻一条路再扫一遍
    b.back=1;
    if(ln===0)b.retOff=1;                       // 0 号路只能回下路
    else if(ln===LANES-1)b.retOff=-1;           // 4 号路只能回上路
    else{boomerAlt=1-boomerAlt;b.retOff=boomerAlt?1:-1;}   // 中间路：交替标志轮流回上/下路
  }
  if(w.frz)b.frz=w.frz;                         // 寒冰球：命中冻一片
  if(w.chain)b.chain=1;                         // 雷电球：链跳相邻两条路
  if(w.splash)b.splash=1;                       // 火箭弹：命中爆炸溅射
  if(w.blast)b.blast=1;                         // 大火球：命中就在爆点炸开，三条路前后一片都挨烧
  G.bls.push(b);
  sfx('shoot');
}
function explodeRocket(b){
  const R=180;                                  // 爆炸半径：只炸爆心附近的僵尸
  for(const z of G.zs){                         // 爆心同路 3 伤，相邻两条路各 2 伤
    if(z.die||z.leave)continue;
    if(Math.abs(z.x-b.x)>R)continue;            // 之前没限制＝全屏同路/邻路都挨打，太超模；现在按爆心距离裁剪
    const d=Math.abs(z.lane-b.lane);
    if(d===0)hitZ(z,z.x,z.y-z.s*0.4,3,true);   // quiet：下面这团火光就是它的受击表现，别再叠白烟
    else if(d===1)hitZ(z,z.x,z.y-z.s*0.4,2,true);
  }
  /* 视觉：只留一团紧凑的橙红火光。以前这里叠了 puffFX(1.6)（内含一个白色大光环）＋半径涨到 88px 的大橙环，
     在 960×540 的画面上看着就像整屏白闪一下——现在白环全删、橙环收小，火光只在爆点附近炸开。
     注意：光删这里还不够，溅射打中的每只僵尸原本都会各自喷一团白烟（见 hitZ 的 quiet），那才是白闪的主力。 */
  G.ps.push({kind:'ring',x:b.x,y:b.y,vx:0,vy:0,life:0.26,t:0,c:'#ff9e50',r:9,gr:150,g:0});
  for(let i=0;i<8;i++){                         // 一团橙红火光
    const an=Math.random()*Math.PI*2,v=60+Math.random()*90;
    G.ps.push({kind:'smoke',x:b.x,y:b.y,vx:Math.cos(an)*v,vy:Math.sin(an)*v-30,
      life:0.3+Math.random()*0.2,t:0,c:i%2?'#ff7043':'#ffca28',r:4+Math.random()*4,gr:18,g:0});
  }
  G.shake=Math.max(G.shake,0.35);addHitStop(0.05);sfx('boom');
}
/* 大火球：命中就在爆点炸开——爆点左右 110px、连同上下相邻路（三条路）里的僵尸全体挨烧。
   直接命中的那只吃弹体伤害(b.dmg)，其余吃 2 点溅射伤。和火箭弹的区别：范围窄但更疼、不带白闪。 */
function explodeFire(b,z0){
  const R=110;
  for(const z of G.zs){
    if(z.die||z.leave)continue;
    if(Math.abs(z.x-b.x)>R||Math.abs(z.lane-b.lane)>1)continue;
    hitZ(z,z.x,z.y-z.s*0.4,z===z0?b.dmg:2,true);   // quiet：同火箭弹，烧一片时不给每只各配一团白烟
  }
  /* 视觉：贴地横向摊开的火舌＋往上蹿的火星，全部橙红色，不用任何白光 */
  G.ps.push({kind:'ring',x:b.x,y:b.y,vx:0,vy:0,life:0.24,t:0,c:'#ff8a65',r:9,gr:170,g:0});
  for(let i=0;i<14;i++){
    const c=i%3===0?'#ffca28':(i%3===1?'#ff7043':'#ff5722');
    G.ps.push({kind:'smoke',x:b.x+(Math.random()-0.5)*R*1.6,y:b.y+(Math.random()-0.5)*12,
      vx:(Math.random()-0.5)*46,vy:-60-Math.random()*90,life:0.3+Math.random()*0.25,t:0,c,r:5+Math.random()*6,gr:14,g:0});
  }
  G.shake=Math.max(G.shake,0.45);addHitStop(0.05);sfx('boom');
}
function freezeAround(zc,ln,dur){               // dur＝武器表里的 frz（寒冰球 5 秒）；以前这里写死 3，改表根本没用
  const d=dur||3;
  let any=false;
  for(const z of G.zs){                         // 冻住命中点周围：|路差|≤1 且 x 距离 ≤170 的僵尸
    if(z.die||z.leave)continue;
    if(Math.abs(z.lane-ln)>1||Math.abs(z.x-zc.x)>170||z.frz>0)continue;
    // BOSS 只冻 1.0s（普通冻满 d 秒）：寒冰球冷却 1.6s，冻得比冷却还久会把 BOSS 永久定住
    // 破洞丧尸（胸口大洞）/ 冰封丧尸（一身冰壳）吃寒冰球冻得更久＝用对武器更划算
    const kf=KIND[z.type];
    z.frz=z.boss?1.0:d*(kf&&kf.frzMul?kf.frzMul:1);any=true;
    for(let i=0;i<5;i++){                       // 冻住时冒几粒冰晶
      const an=Math.random()*Math.PI*2,v=40+Math.random()*70;
      G.ps.push({kind:'smoke',x:z.x+(Math.random()-0.5)*z.s*0.6,y:z.y-z.s*0.5+(Math.random()-0.5)*z.s*0.7,
        vx:Math.cos(an)*v,vy:Math.sin(an)*v,life:0.5,t:0,c:'#b3e5fc',r:3+Math.random()*3,g:0});
    }
  }
  if(any)sfx('freeze');
}
function boltChain(zc,b){
  const pts=[[b.x,b.y]];
  for(const off of [-1,1]){                     // 闪电链跳到相邻两条路：各挑最近的一只
    const ln=zc.lane+off;if(ln<0||ln>=LANES)continue;
    let best=null;
    for(const z of G.zs){
      if(z.die||z.leave||z.lane!==ln)continue;
      if(!best||Math.abs(z.x-b.x)<Math.abs(best.x-b.x))best=z;
    }
    if(best){
      pts.push([best.x,best.y-best.s*0.5]);
      hitZ(best,best.x,best.y-best.s*0.5,2);
    }
  }
  if(pts.length>1)G.bolts.push({pts,t:0.16});   // 折线闪电，短暂特效
}
function fireLaser(dmg){
  const h=G.hero,s=heroS();
  G.laser={x:h.x+s*0.40,y:h.y-s*0.56,t:0.35};   // 光束必须从主角枪口发出
  for(const z of G.zs){                         // 沿他所在那条路贯穿，全体各 dmg 伤（默认 3）
    if(z.die||z.leave||z.lane!==h.lane)continue;
    hitZ(z,z.x,z.y-z.s*0.5,dmg||3);
  }
  sfx('laserz');G.shake=Math.max(G.shake,0.35);
}
/* ---------- 一次性武器：战斗中点了立刻用 ---------- */
function useOnce(id){
  if(mode!=='play')return;                     // 只有战斗中能用：庆祝/过渡/结算屏里点了无效（不然白闪会冻在定格画面上）
  const n=onceCnt(id);if(n<=0)return;
  OWN.oc[id]=n-1;saveOwn();renderWbar();
  const w=weaponOf(id);
  if(id==='bomb'){
    G.ebs.length=0;                             // 魔法炸弹：清空敌方子弹
    G.gts.length=0;                             // 连地上的火柱/震波一起炸灭（炸弹是「救命道具」，要真能救命）
    for(const z of G.zs){if(!z.die&&!z.leave)hitZ(z,z.x,z.y-z.s*0.5,3);}
    G.flash=0.3;                                // 全屏白闪一下
    sfx('boom');G.shake=1;addHitStop(0.08);
  }else if(w&&w.block){                         // 防护盾：撑开后由 hurt() 替焕宸挡掉 block 下攻击
    const h=G.hero;
    h.shield=Math.min(9,h.shield+w.block);      // 盾还残着就叠上去（封顶 9，盾面只有三颗铆钉，再多就只能靠金边表示）
    h.shBr=0;                                   // 新一面盾撑开＝把上一面的碎屑动画抹掉，别新旧叠在一起
    sfx('shield');G.flash=0.16;
    banner('🛡 防护盾撑开啦！还能挡 '+h.shield+' 下');
    sayWhenFree(['shieldup'],()=>mode==='play');
    updateHUD();
  }
}

function hurt(flag){
  const h=G.hero;
  /* 盾在最前面挡：挡一下只减盾的层数，星星红心都不动，红旗也不会被拔；
     无敌时间比挨一下短（0.9s vs 1.3s）——盾能连挡三下，但站原地不动照样会被打完 */
  if(h.shield>0){
    h.shield--;h.shFx=0.45;                     // shFx＝盾面被砸裂的闪白计时
    if(h.shield<=0)h.shBr=SH_BREAK;             // 最后一下打完＝整面盾炸开（碎片动画接着放，见 drawShield）
    h.inv=0.9;G.shake=0.55;
    addHitStop(0.05);
    sfx('block');
    banner(h.shield>0?(flag?'🛡 旗子保住了！还能挡 '+h.shield+' 下':'🛡 挡下啦！还能挡 '+h.shield+' 下')
                     :(flag?'🛡 旗子保住了！防护盾碎啦':'💔 防护盾碎啦！'));
    updateHUD();
    return;
  }
  /* BOSS 送的星星先挡伤害：星星扣完才扣红心，红心扣完才游戏结束 */
  if(G.bonus>0)G.bonus--;else G.hearts--;
  h.inv=1.3;G.shake=1;
  addHitStop(0.09);                           // 受伤：中等顿帧，强调“挨了一下”
  sfx('hurt');
  if(flag)banner('🚩 红旗被拔掉啦！');
  updateHUD();
  if(G.hearts<=0)gameOver();
}
/* 旗被拔 → 它的星星弹起飞起再落回旗座 → 星星长成新旗插回（旗总会回来，代价是上面那颗心） */
function pullFlag(lane){
  const f=FLAGS[lane];
  f.st=1;f.t=0;
  f.sy=f.y-58*f.k;f.svy=-200;          // 星星从旗顶脱落，轻轻弹一下再落回旗座
}
function stepFlags(dt){
  for(const f of FLAGS){
    if(f.st===0)continue;
    f.t+=dt;
    if(f.st===1){
      f.svy+=1500*dt;f.sy+=f.svy*dt;
      if(f.t>0.3&&f.svy>0&&f.sy>=f.y-26*f.k){   // 星星落地＝插回新旗
        f.st=2;f.t=0;
        G.ps.push({kind:'ring',x:FLAG_X+20*f.k,y:f.y-24*f.k,r:4,gr:70,c:'#fff59d',t:0,life:0.4,vx:0,vy:0,g:0});
        puffFX(G.ps,FLAG_X+16*f.k,f.y-30*f.k,0.5);
      }
    }else if(f.t>=0.5){f.st=0;f.t=0;}
  }
}

/* ---------- 关卡流程 ---------- */
/* 打赢一格 → 藏宝图解锁下一格（第一章＝打完本格 BOSS；第四章前三格没有 BOSS，由 stageClear 补） */
function unlockNextMapSlot(){
  const bi=MAP_ORDER.indexOf(curBG);             // 打败哪块战场，就解锁地图下一块
  if(bi>=0&&bi+2>mapN){mapN=Math.min(MAP_ORDER.length,bi+2);LS.set('moday_map',String(mapN));}
}
function stageClear(){
  if(G.score>best){best=G.score;LS.set('moday_best',String(best));}
  const wasBoss=isChapterEnd();                    // 打完本格的最后一战（第一章＝关3大王；二、三章＝每格自己的大王）
  if(!wasBoss){
    sfx('win');
    /* 同格内的普通关打赢（第一章关 1→2→3、第四章关 12→13→14 会走到这儿）：不弹任何页面，大字横幅＋语音，约 2 秒后自动进下一关 */
    mode='inter';interT=2.2;
    G.zs.length=0;G.bls.length=0;G.ps.length=0;G.ebs.length=0;    // 清场，过渡画面干净
    G.gts.length=0;
    banner('🎉 第 '+G.stage+' 关打赢啦！',2.6);   // 2.2 秒后就进下一关，字幕跟着收尾即可（语音不会被下一句顶掉）
    const c1=numClips(G.stage),c2=numClips(G.stage+1);
    say(c1&&c2?['di'].concat(c1,['guanwin'],c2,['guan']):['next']);
    /* 第四章一格一关：串关的同时要把藏宝图跟着推进一格，否则打完 12，地图上 13 还锁着点不进去 */
    if(curStage().ch>=4)unlockNextMapSlot();
    return;
  }
  celebrate();                                     // 打完 BOSS：定格＋烟花＋面板浮现
}
/* 第一章宝藏：打完第一章的大王当场开箱——40 金币飞进金币盘 ＋ 1 面防护盾进库存。
   第一章打完把武器库的货全买得起，再送一把已有武器等于没送，
   所以宝藏给的是库里买不到的防护盾；只开一次，moday_gift 落盘后再打第一章不重复发。 */
function openChapterGift(){
  /* STAGES 里第一章三关没写 ch（第二、三章写 ch:2 / ch:3）：宝藏只属于第一章那 40 金币＋1 面盾。
     celebrate 现在每格大王倒下都触发（一格一关），这里必须自己按 ch 挡住，
     否则关 4、关 5……每打赢一格都开一次箱。第一章只有关 3 有大王，所以这里＝第一章打完。 */
  if(giftN||curStage().ch>=2)return false;
  giftN=1;LS.set('moday_gift','1');
  OWN.oc.shield=onceCnt('shield')+GIFT_SHIELD;saveOwn();
  const bz=G.zs.find(z=>z.boss);                 // 大王此刻还在仰倒动画里，金币就从它身上弹出
  if(bz)coinBurst(bz,GIFT_COIN);                 // BOSS 大赏金分 5 枚错峰起飞：40÷5＝每枚 8
  else{coins+=GIFT_COIN;LS.set('moday_coin',String(coins));}
  renderMap();                                   // 藏宝图那格 💰 立刻从虚线涂鸦变成金色已开箱
  return true;
}
/* BOSS 被打倒：决斗画面定格（大王射出的子弹停在半空当作定格剪影）、BOSS 往后仰倒＋冒大烟、
   烟花持续升空炸开；等「恭喜你打败了XX」读完，结算面板边放烟花边浮现，等小朋友选 */
function celebrate(){
  mode='win';winT=0;fwT=0.25;winPanelOn=false;freezeT=T;
  G.flash=0;G.laser=null;G.bolts.length=0;      // 定格画面不再推进 update，特效清干净别冻在屏上
  G.gts.length=0;
  /* win 模式只跑 stepWin，小兵不会走路也不会倒下——留着就是几只僵在原地的木桩。
     让它们「啪」冒一团烟退场，只留下正在仰倒的大王（stepWin 逐个冒烟收尾）。 */
  for(let i=G.zs.length-1;i>=0;i--){
    const z=G.zs[i];
    if(z.boss)continue;
    G.zs.splice(i,1);
    puffFX(G.ps,z.x,z.y-z.s*0.4,z.s/60);
  }
  stopBgm();sfx('win');
  G.hero.inv=0;                                  // 防止定格时主角正处在受伤闪烁的"灭"帧
  unlockNextMapSlot();
  giftNow=openChapterGift();                      // 第一章的大王倒下＝当场开宝藏（只开这一次）
  /* 衣服层发放（4.12）：只有篇章的最后一战才发 lv——一格一关（FR-23）后关 4/5/6、8/9/10 的
     大王也会走到这里，照关卡 ch 发会把 lv2 在篇章第一格（关 4）就发出去。
     lv N＝打完第 N 篇章：关 3→lv1、关 7 终章→lv2、关 11 终章→lv3、关 15 末日总王→lv4；
     只记录不自动穿上，回首页自由换。哪些是篇章末由 isChapterLast() 按表判定。 */
  outfitNew='';
  const sd=curStage();
  if(isChapterLast()){
    const oLv=sd.ch||1;
    if(unlockOutfit(oLv)){
      for(const k in OUTFITS)if(OUTFITS[k].lv===oLv)outfitNew=k;
      renderFits();
    }
  }
  confetti(70);
  const bname=G.bossName||'大BOSS';              // 终章是三王合体，不能用 find(z=>z.boss) 只认一只
  banner('🎉 恭喜你打败了 '+bname+'！',5.5);   // 定格画面没有打斗，字幕陪着语音读完（实测 4.2 秒，慢引擎更久）
  winVoiceDone=false;
  /* 读完置位，stepWin 看到才弹结算面板：语音引擎有快有慢，猜秒数一定会被打断 */
  say(['congrats',bossVoiceKey(bname)],()=>{winVoiceDone=true});
  /* 章终全通关：恭喜那句读完再补一句"全部打完"，横幅不抢「恭喜你打败了」的字幕；
     第二、三章终章各念各的（'丧尸山谷全部打完' / '机核深渊全部打完'），第四篇章念'世界尽头全部打完' */
  if(isFinalStage()||isGameEnd())
    sayWhenFree([isGameEnd()?'allok4':curStage().ch>=3?'allok3':'allok'],()=>mode==='win');
}
/* 烟花继续放，结算面板浮现：回首页 或 进下一关 */
function showWinPanel(){
  const ni=BG_ORDER[(BG_ORDER.indexOf(curBG)+1)%BG_ORDER.length];
  $('winSub').textContent='分数 '+G.score+' · 还剩 '+G.hearts+' 颗心'+(G.bonus>0?'、'+G.bonus+' 颗星':'')+' · 最高分 '+best;
  /* 刚开过宝藏就补一行战利品，再撒一拨彩花；数字跟着常量走，以后改奖励不会说错 */
  const loot=[];
  if(giftNow)loot.push('🎁 宝藏开箱：🪙×'+GIFT_COIN+' ＋ 🛡 防护盾×'+GIFT_SHIELD);
  if(outfitNew)loot.push('👕 新衣服解锁：'+OUTFITS[outfitNew].name);
  $('winGift').textContent=loot.join('　');
  $('winGift').classList.toggle('show',loot.length>0);
  if(loot.length>0)confetti(60);
  /* 二~四章一格一关：每打赢一格都是"回藏宝图点下一块"；只有最后一格（关 15 末日总王）才说"全通关"——
     前面每一格后面都还有关，说全通关会把小朋友劝退 */
  $('btnWinNext').textContent=isGameEnd()?'🏆 全通关啦 · 回藏宝图'
    :(curStage().ch>=2?'🗺 回藏宝图 · 点下一块':'➡ 进下一关 · '+BG_NAME[ni]);
  $('scrWin').classList.add('show');
  /* 开箱那句先念，再接「选一个吧」：say 会顶掉当前语音，所以一次把两句排进同一条队列 */
  const vs=[];
  if(giftNow)vs.push('gift');
  if(outfitNew)vs.push('unlock_'+'abcd'[OUTFITS[outfitNew].lv-1]);
  vs.push(curStage().ch>=2?(isGameEnd()?'chooseend':'choosewin'):'choose');
  say(vs);
}
function hideWinPanel(){$('scrWin').classList.remove('show');winPanelOn=false;}
/* 定格庆祝期间：BOSS 仰倒冒烟、烟花先密后疏一直放、彩花飘，恭喜语音读完后面板浮现 */
function stepWin(dt){
  winT+=dt;
  for(let i=G.zs.length-1;i>=0;i--){              // 终章三只一起倒下：逐个冒烟、逐个消失
    const b=G.zs[i];
    if(!b.boss)continue;
    b.dieT+=dt;
    if(b.dieT<b.die&&Math.random()<0.4)              // 倒下过程不断冒烟
      puffFX(G.ps,b.x+(Math.random()-0.5)*b.s*0.8,b.y-Math.random()*b.s*0.9,b.s/56);
    if(b.dieT>=b.die+0.6)G.zs.splice(i,1);   // 倒完淡出就消失
  }
  fwT-=dt;
  if(fwT<=0){                                    // 先密后疏，一直放
    fwT=winT<5?0.34+Math.random()*0.3:0.9+Math.random()*0.8;
    launchFw();
  }
  for(let i=G.ps.length-1;i>=0;i--){
    const p=G.ps[i];
    if(p.kind==='fwR'&&p.y<=p.ty){G.ps.splice(i,1);boomFw(p);}   // 火箭到高度＝炸
  }
  if(winT<6&&Math.random()<0.5)confetti(2);
  updParts(G.ps,dt);
  G.shake=Math.max(0,G.shake-dt*3);
  /* 「恭喜你打败了XX」读完（winVoiceDone）才弹结算，不然面板那句会把它顶掉；
     最少先看 2.2 秒烟花，8 秒是兜底——万一语音引擎不回调 end 也不会卡在这里 */
  if(!winPanelOn&&winT>=2.2&&(winVoiceDone||winT>=8)){winPanelOn=true;showWinPanel();}
}
function gameOver(){
  mode='over';stopBgm();sfx('over');
  if(G.score>best){best=G.score;LS.set('moday_best',String(best));}
  $('ovSub').textContent='这一局得了 '+G.score+' 分，打到第 '+G.stage+' 关';
  $('ovBest').textContent=best;
  show('scrOver');
  say(['over'].concat(digitsClips(G.score),['fen']));
}
function startPlay(){
  mode='play';
  renderWbar();                                // 战斗武器栏：列出已拥有的切换型＋一次性魔法炸弹
  hideWinPanel();
  show(null);
  updateHUD();
  banner('第 '+G.stage+' 关');
  startBgm();
}
function startRun(){
  loopN=1;
  /* 藏宝图点在「丧尸山谷」＝从第二章第 4 关起步（山谷里的四块背景由关卡决定）；
     点前三块战场仍是第一章：第 1 关起，一块战场贯穿三关＋BOSS */
  resetGame(MAP_STAGE[pickBG]||1);   // 第一章三格都从第 1 关起，第二章一格一关
  startPlay();
}
function retryStage(){
  const wasFacingBoss=(G.bossOut||G.bossDone)&&isBossStage();   // 死在大王面前才直接重开大王
  /* 重打这一关＝除关卡号以外和开一局完全一样，所以直接复用 resetGame 把关卡号原样递回去。
     以前这里逐行抄了一遍 resetGame，抄漏了 G.seen={}：重试后丧尸兵种不再报名，
     小朋友听不见「破洞丧尸／独眼丧尸」是谁，只能自己猜。 */
  resetGame(G.stage);
  if(wasFacingBoss){                          // BOSS战输了：数量打满后直接重开BOSS
    G.kills=G.quota;
    startPlay();
    spawnBoss();
  }else{
    startPlay();
  }
}
function restartRun(){retryStage();}          // 失败/暂停重开＝从当前关卡开始
function toMenu(){
  mode='menu';stopBgm();
  hideWinPanel();
  $('uiBest').textContent=best;
  $('uiMenuCoin').textContent=coins;           // 菜单上的金币数也要刷新
  renderMap();
  show('scrMenu');
}

/* ---------- 主循环 ---------- */
function update(dt){
  const h=G.hero;
  h.fire=Math.max(0,h.fire-dt*2.6);
  h.inv=Math.max(0,h.inv-dt);
  h.shFx=Math.max(0,h.shFx-dt);               // 盾面被砸裂的闪白计时
  h.shBr=Math.max(0,h.shBr-dt);               // 盾炸开的碎片动画计时
  const k=Math.min(1,dt*9);                    // 手指拖动，小人跟上
  h.x+=(h.tx-h.x)*k;
  h.y+=(h.ty-h.y)*k;

  // 键盘：←→ 连续移动（held），↑↓ 换路（长按每 0.16s 换一条）
  const KSPD=340;
  if(KEY.left)h.tx=Math.max(XMIN,h.tx-KSPD*dt);
  if(KEY.right)h.tx=Math.min(XMAX,h.tx+KSPD*dt);
  if(KEY.up||KEY.down){
    laneHoldT-=dt;
    if(laneHoldT<=0){
      const nl=h.lane+(KEY.up?-1:1);
      if(nl>=0&&nl<LANES){h.lane=nl;h.ty=laneY(h.lane);}
      laneHoldT=0.16;
    }
  }else laneHoldT=0;

  h.cd-=dt;                                    // 自动向前连发（节奏由当前装备的武器决定）
  if(h.cd<=0){
    h.fire=1;
    const s=heroS(),bx=h.x+s*0.40,by=h.y-s*0.56,ln=laneOf(h.y);
    fireWeapon(weaponOf(curWeaponId()),bx,by,ln);
  }

  for(let i=G.bls.length-1;i>=0;i--){
    const b=G.bls[i];
    b.x+=b.vx*dt;b.rot+=dt*(b.kind==='boomer'?13:11);
    if(b.kind==='rocket'){                      // 火箭弹：机尾持续喷火焰尾迹粒子（节流，别刷爆粒子池）
      b.tt=(b.tt||0)+dt;
      if(b.tt>0.045){b.tt=0;
        G.ps.push({kind:'smoke',x:b.x-20,y:b.y+(Math.random()-0.5)*5,vx:-70-Math.random()*70,
          vy:(Math.random()-0.5)*40,life:0.2+Math.random()*0.12,t:0,
          c:Math.random()<0.5?'#ffca28':'#ff7043',r:3+Math.random()*3,gr:-14,g:0});
      }
    }
    if(b.kind==='bolt'){                        // 雷电球：身后甩小电花（节流，别刷爆粒子池）
      b.tt=(b.tt||0)+dt;
      if(b.tt>0.05){b.tt=0;
        G.ps.push({kind:'star',x:b.x-10,y:b.y+(Math.random()-0.5)*8,vx:-60-Math.random()*40,
          vy:(Math.random()-0.5)*60,life:0.18+Math.random()*0.12,t:0,c:'#fff176',
          r:2.5+Math.random()*2,rot:Math.random()*6,vr:0,g:0});
      }
    }
    if(b.back){                                 // 回旋镖：飞到尽头折返，回程换相邻一条路再各吃一次伤害
      if(b.vx>0&&b.x>GW+30){
        b.vx=-b.vx*0.72;b.hit={};
        const oy=b.y-laneY(b.lane);             // 保留枪口相对路面的高度差
        b.lane=Math.max(0,Math.min(LANES-1,b.lane+b.retOff));   // 0 号回下路、4 号回上路、中间路按发射时的交替标志
        b.y=laneY(b.lane)+oy;                   // 换路发生在画面外，直接落位即可
      }
      else if(b.vx<0&&b.x<-40){G.bls.splice(i,1);continue;}
    }else if(b.x>GW+40){G.bls.splice(i,1);continue;}
    let dead=false;
    for(const z of G.zs){
      if(z.die||z.leave||z.lane!==b.lane||b.hit[z.id])continue;   // 只打同一条路上的
      if(b.x>z.x-z.s*0.55&&b.x<z.x+z.s*0.26){
        if(b.splash){explodeRocket(b);dead=true;break;}           // 火箭弹：一碰就炸
        if(b.blast){explodeFire(b,z);dead=true;break;}            // 大火球：一碰就在爆点炸开三条路
        hitZ(z,b.x,b.y,b.dmg);
        b.hit[z.id]=1;                          // 穿透弹/回旋镖：同一只每趟只吃一次伤害
        if(b.frz)freezeAround(z,b.lane,b.frz);  // 寒冰球：本路这只直接打死，周围（含上下路）冻住 b.frz 秒
        if(b.chain)boltChain(z,b);
        if(!b.pierce){dead=true;break;}
      }
    }
    if(dead)G.bls.splice(i,1);
  }

  /* 终章先决定「这会儿谁是主攻」，再走地面威胁：交接那 1.5 秒三只都停手 */
  if(G.bossOut&&isFinalStage())stepFinale(dt);
  stepGts(dt);                                   // 地上的火柱/震波/横扫：到点才真的烫人
  if(mode!=='play')return;                       // 被地上的火烧没了：这一帧不用再往下走

  const hs=heroS();
  for(let i=G.zs.length-1;i>=0;i--){
    const z=G.zs[i];
    if(z.die){z.dieT+=dt;if(z.dieT>=z.die)G.zs.splice(i,1);continue;}
    if(z.leave){                                // BOSS 登场：普通僵尸转身撤退
      z.x+=260*dt;z.ph+=dt*4.6;
      /* 整只走出右边缘后消散：烟必须生成在画面内（x≤GW），否则玩家看不见 */
      if(z.x-z.s*0.5>GW){z.die=0.25;z.dieT=0;puffFX(G.ps,GW-18,z.y-z.s*0.5,z.s/52);}
      continue;
    }
    if(z.sq>0)z.sq=Math.max(0,z.sq-dt);         // 果冻抖动衰减
    if(z.frz>0){z.frz-=dt;}                     // 被寒冰球冻住：位置不前进、不开火、走路动画停，只留冰霜外观（BOSS 同样冻住）
    else{
      if(!z.boss)stepMinion(z,dt);                // 兵种行为：独眼提速／缺牙换路（冻住时全停）
      z.x-=z.v*dt;z.ph+=dt*(z.boss?3.2:4.6);    // 走路：前进＋迈步动画（冻住时全停）
      if(z.boss)stepBoss(z,dt);                 // BOSS：站到场中＋随机换路
      else if(z.x-z.s*0.40<BASE_X){             // 走到最左边＝拔掉这条路的红旗！
        /* 盾撑着（且此刻没在无敌里）就把僵尸撞碎在旗外：旗子保住，判定口径和下面 hurt(true) 一致 */
        if(!(h.inv<=0&&h.shield>0))pullFlag(z.lane);   // 旗倒下 → 星星落回来变成新旗
        if(h.inv<=0)hurt(true);                   // 同一帧多只拔旗也只掉一颗心
        z.die=0.28;z.dieT=0;
        puffFX(G.ps,BASE_X+14,z.y-z.s*0.5,z.s/52);
        if(mode!=='play')return;                  // 已经 gameOver
        continue;
      }
      else if(z.x<-100){G.zs.splice(i,1);continue;}
    }
    if(h.inv<=0&&z.lane===h.lane&&z.x>h.x-hs*0.55&&z.x-z.s*0.40<h.x+hs*0.16&&Math.abs(z.y-h.y)<LANE_H*0.55){
      hurt();
      if(z.boss){z.x+=80;}                      // BOSS 碰人不会自己死，只被 knock 退一点
      else{
        z.die=0.3;z.dieT=0;
        puffFX(G.ps,z.x,z.y-z.s*0.5,z.s/52);
      }
      if(mode!=='play')return;                  // 已经 gameOver
    }
  }
  /* BOSS 子弹：向左飞，撞到同路的主角就掉一颗心；切到别的路就能躲开 */
  for(let i=G.ebs.length-1;i>=0;i--){
    const b=G.ebs[i];
    b.x+=b.vx*dt;b.rot+=dt*9;
    if(b.x<-40){G.ebs.splice(i,1);continue;}
    if(h.inv<=0&&b.lane===h.lane&&Math.abs(b.x-h.x)<hs*0.42&&Math.abs(b.y-h.y)<LANE_H*0.5){
      G.ebs.splice(i,1);
      hurt();
      if(mode!=='play')return;                  // 已经 gameOver
    }
  }
  updParts(G.ps,dt);
  G.shake=Math.max(0,G.shake-dt*3);
  for(let i=G.bolts.length-1;i>=0;i--){G.bolts[i].t-=dt;if(G.bolts[i].t<=0)G.bolts.splice(i,1);}
  if(G.laser){G.laser.t-=dt;if(G.laser.t<=0)G.laser=null;}
  G.flash=Math.max(0,G.flash-dt);

  /* 出怪 */
  const bossStage=isBossStage();
  if(bossStage&&G.kills>=G.quota&&!G.bossDone){
    if(!G.bossOut)spawnBoss();
  }else{
    G.spawnT-=dt;
    let alive=0;
    for(const z of G.zs)if(!z.die)alive++;
    if(G.spawnT<=0&&alive<stCfg().cap){
      G.spawnT=stCfg().gap;
      spawnWave();
    }
  }

  if(G.bossDone||(!bossStage&&G.kills>=G.quota))stageClear();
}

function drawZombie(z){
  ctx.save();ctx.translate(z.x,z.y);
  if(z.die){
    const pr=Math.min(1,z.dieT/z.die);
    if(z.boss){                                  // BOSS：往后仰倒＋慢慢变淡（不是转圈）
      ctx.rotate(pr*Math.PI*0.48);
      ctx.translate(0,pr*z.s*0.18);
      ctx.globalAlpha=1-pr*0.85;
    }else{
      const kk=1-pr*0.88;
      ctx.rotate(pr*Math.PI*2);ctx.scale(kk,kk);ctx.globalAlpha=1-pr*0.25;
    }
  }else if(z.sq>0){
    /* squash & stretch：被击中果冻抖动，带 overshoot 回弹，很快回到静止（只动视觉，不动模拟） */
    const p=Math.min(1,1-z.sq/0.18);
    const wob=Math.sin(p*Math.PI*2)*0.22*(1-p);
    ctx.scale(1+wob,1-wob);
  }
  if(z.leave)ctx.scale(-1,1);                   // 撤退中：水平镜像＝真的转身朝右走，而不是倒着滑
  if(z.boss){                                   // 第二/三章大王各有画法；第一章没有 mech，照旧画圆角绿大王
    const rzk=RBOSS_SK[z.cfg.mech];
    if(rzk)drawRobotBoss(ctx,0,0,z.s,rzk,T,z.ph);                       // 第三章：方块机器人大王（自带地面影子）
    else{
      const bzk=BOSS_ZK[z.cfg.mech];
      if(bzk)drawBlockBoss(ctx,0,0,z.s,bzk,T,z.ph);                     // 第二章：方块丧尸风大王
      else drawZombieV(ctx,0,0,z.s,BOSS_SK[curBG]||BOSS_SK.forest,T,z.ph);
    }
  }
  else if(KIND[z.type]&&KIND[z.type].src){        // 第四章：大王降级体，照搬它当大王时的画法
    const b=KIND[z.type].src;
    if(RBOSS_SK[b])drawRobotBoss(ctx,0,0,z.s,RBOSS_SK[b],T,z.ph);
    else if(BOSS_ZK[b])drawBlockBoss(ctx,0,0,z.s,BOSS_ZK[b],T,z.ph);
    else drawZombieV(ctx,0,0,z.s,BOSS_SK[b],T,z.ph);
  }
  else if(KIND_SK[z.type])drawBlockZombie(ctx,0,0,z.s,KIND_SK[z.type],T,z.ph);   // 第二章：直角方块丧尸，五种各有记号
  else if(ROBOT_SK[z.type])drawRobotUnit(ctx,0,0,z.s,ROBOT_SK[z.type],T,z.ph);   // 第三章：四种机器人（探针自带悬空）
  else drawZombieV(ctx,0,0,z.s,ZK,T,z.ph);                                       // 第一章：圆角绿僵尸，一字不变
  /* 罩子（冰罩／吐弹红罩）的顶高：写死的 0.98 只够第一章圆角僵尸（头 56u），
     大王降级体背着炉子、举着骨棒，剪影能到 72u，得按 KIND.frzH 单独抬。 */

function drawBossBar(){
  const bs=G.zs.filter(z=>z.boss&&!z.die&&z.hp>0);

/* ---------- 防护盾：一面立在焕宸身前的盾板 ----------
   样子：上平下尖的纹章盾，蓝面＋浅色金属框＋一道斜高光，底边贴地、地上带淡投影；
   读数：盾面竖排三颗金铆钉＝还能挡几下，挡一下灭一颗、盾面多一道裂纹、整面往回震一下；
   用完：三下打完整面盾先原样裂到底，再崩成六片朝敌人那边飞散落地，SH_BREAK 秒里一直画，
        小朋友不用看数字也知道"盾是怎么没的"。 */
const SH_BREAK=0.5;                        // 整面盾炸开的动画时长（秒）
const SH_HW=15,SH_HH=30;                   // 盾的半宽/半高，单位同人物（人高 84u），比人矮一大截不挡视线

const SH_CRACKS=[
  [[1,.5],[.42,.26],[.06,.02],[-.28,-.16]],
  [[1,-.22],[.5,-.06],[.16,.28]],
  [[.92,-.86],[.34,-.62],[-.1,-.52]]

/* 炸开的六块盾片：起点就是它在盾面上的位置（3 列 2 行），方向统一偏右——盾是被从正面砸碎的，
   碎片该朝敌人那边崩出去、同时往下坠，不能往小人身上一片一片糊；
   大小、自转一次性算死，每帧现随机会让碎屑跳成一片噪点，小朋友只看得见闪 */
/* 三种茬口形状（归一化到碎片自己的半宽/半高）：全是带尖角的不规则片，
   六块一块样会崩成一堆复制粘贴的卡片，换着来才像一面盾被砸碎 */
const SH_SHAPES=[
  [[-.5,-.42],[.44,-.16],[-.02,.5]],
  [[.06,-.5],[.5,.1],[-.3,.48],[-.5,-.06]],
  [[-.46,-.24],[.12,-.5],[.48,.14],[-.16,.44]]
];
const SHARDS=(()=>{const out=[];
  for(let r=0;r<2;r++)for(let c=0;c<3;c++){
    const gx=(c-1)*0.62,gy=-0.55+r*1.1;
    out.push({gx,gy,a:Math.atan2(gy,gx)*0.45+0.25,
              sp:0.85+0.35*Math.abs(gx)+(c===1?0.25:0),
              rot:(r+c)%2?4.4:-3.6,sc:0.5+0.07*((r*3+c)%3),b:(r+c)%3===0,
              v:SH_SHAPES[(r*3+c)%3]});

function drawShield(h){
  const s=heroS(),u=s/84,t=(mode==='win'?freezeT:T);
  const hw=SH_HW*u,hh=SH_HH*u;
  const sx=h.x+24*u,sy=h.y-34*u+Math.sin(t*2.4)*1.2*u;   // 立在身前偏右（敌人那边），微微呼吸
  const dead=h.shield<=0;                                // 三下用完，正在演炸开的动画
  const k=dead?Math.max(0,1-h.shBr/SH_BREAK):0;          // 炸开进度 0→1
  const white=h.shFx>0?Math.min(1,h.shFx/0.45):0;        // 刚挡下那一下的闪白
  ctx.save();
  ctx.globalAlpha=0.2*(dead?Math.max(0,1-k*2.5):1);ctx.fillStyle='#000';   // 落地投影：让盾"站"在地上而不是飘着
  ctx.beginPath();ctx.ellipse(sx,h.y-u,hw*0.78,3.2*u,0,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
  ctx.translate(sx,sy);                                    // 之后一律用盾自己的坐标系：原点＝盾面中心
  const path=(sc)=>{                                       // 盾面轮廓（上平下尖），sc>1 是往外扩的那道影子
    const w=hw*sc,h2=hh*sc,rp=Math.min(4*u,w*0.3);

    ctx.moveTo(-w+rp,-h2);ctx.lineTo(w-rp,-h2);ctx.quadraticCurveTo(w,-h2,w,-h2+rp);
    ctx.lineTo(w*0.96,h2*0.12);
    ctx.quadraticCurveTo(w*0.6,h2*0.9,0,h2);
    ctx.quadraticCurveTo(-w*0.6,h2*0.9,-w*0.96,h2*0.12);
    ctx.lineTo(-w,-h2+rp);ctx.quadraticCurveTo(-w,-h2,-w+rp,-h2);ctx.closePath();
  };
  const face=(sc,fl)=>{                            // 盾面本体：竖向渐变＋描边＋一道斜高光（sc 胀大，fl 是叠在上面的白光）
    const w=hw*sc,h2=hh*sc,g=ctx.createLinearGradient(0,-h2,0,h2);
    g.addColorStop(0,'rgba(179,229,252,.90)');g.addColorStop(.5,'rgba(79,195,247,.78)');g.addColorStop(1,'rgba(2,119,189,.70)');
    path(sc);ctx.fillStyle=g;ctx.fill();
    if(fl>0){path(sc);ctx.fillStyle='rgba(255,255,255,'+(0.72*fl).toFixed(3)+')';ctx.fill();}
    ctx.strokeStyle=fl>0?'#ffffff':'#e0f7fa';ctx.lineWidth=Math.max(1.6,2.3*u);path(sc);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.18)';

  };
  const cracks=(n,fl)=>{                           // 从迎敌的右边缘往盾内裂，挡掉几下就裂几条
    ctx.strokeStyle='rgba(255,255,255,'+(0.5+0.45*fl).toFixed(3)+')';ctx.lineWidth=Math.max(1,1.3*u);
    for(let i=0;i<n;i++){

      ctx.moveTo(cr[0][0]*hw,cr[0][1]*hh);
      for(let j=1;j<cr.length;j++)ctx.lineTo(cr[j][0]*hw,cr[j][1]*hh);
      ctx.stroke();
    }
  };
  if(white>0)ctx.rotate(-0.06*white*Math.sin((1-h.shFx/0.45)*Math.PI*2));  // 被砸得往回一顿
  if(dead){                                       // 用完：整面盾先原样裂到底，再崩成六片朝敌人那边飞散落地
    const e=Math.min(1,k/0.3);                    // 前 30% 还看得见"这面盾"，小朋友才知道碎屑是从哪儿崩出来的
    const fl=k<0.12?1-k/0.12:0;                   // 炸开头一瞬的白光：先亮一下再碎，比直接消失有劲儿
    ctx.globalAlpha=(1-e)*(1-e);face(1+0.12*e,fl);cracks(SH_CRACKS.length,fl);   // 盾面褪得比轮廓快，中间那几帧才不会糊成一块脏灰
    ctx.globalAlpha=(1-e)*0.9;ctx.strokeStyle='#e0f7fa';ctx.lineWidth=Math.max(1.5,4.5*u*(1-e));
    path(1+0.45*e);ctx.stroke();                  // 沿盾形轮廓往外扩的一道浅青白影，比一圈细椭圆环贴题

      ctx.rotate(q.rot*k);

      g.addColorStop(0,'rgba(255,255,255,.95)');
      g.addColorStop(.42,q.b?'rgba(2,136,209,.95)':'rgba(129,212,250,.95)');
      g.addColorStop(1,'rgba(2,119,189,.92)');

      for(let i=1;i<q.v.length;i++)ctx.lineTo(q.v[i][0]*w,q.v[i][1]*h2);
      ctx.closePath();

    }
    for(let i=0;i<4;i++){                         // 几点火星窜得快、灭得也快
      const a=-0.95+i*0.62,d=(1+4.6*k)*hw;

      ctx.beginPath();ctx.arc(Math.cos(a)*d,Math.sin(a)*d*0.55-6*u,Math.max(1,2.2*u*(1-k)),0,6.283);ctx.fill();

  if(h.shield>3){                                          // 叠了第二面盾：外面再描一道金圈表示更厚
    ctx.strokeStyle='rgba(255,213,79,.85)';ctx.lineWidth=Math.max(1.2,1.6*u);
    ctx.beginPath();ctx.ellipse(0,0,hw*1.18,hh*1.1,0,0,Math.PI*2);ctx.stroke();

  for(let i=0;i<3;i++){                                    // 三颗铆钉＝还剩三下，用完一颗暗一颗

    }
  }
}
/* ---------- 守护红旗：每条路一面；被拔后星星落下来变成新旗插回 ---------- */
function eob(x){const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);}  // 带一点回弹的长出
function drawFlagBody(i,wave,withStar){
  ctx.fillStyle='#6d4c41';ctx.fillRect(-2.5,-64,5,64);    // 旗杆
  ctx.save();
  ctx.translate(2.5,-62);
  ctx.rotate(wave);
  ctx.fillStyle='#e53935';
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(40,3);ctx.lineTo(40,27);ctx.lineTo(0,24);ctx.closePath();ctx.fill();
  ctx.fillStyle='#c62828';ctx.fillRect(0,0,4,24);         // 靠杆一侧深一点
  if(withStar)star(ctx,22,13.5,7.5,'#ffd600');            // 黄色五角星（被拔时星已脱落）
  ctx.restore();
}
function drawFlags(){
  for(let i=0;i<LANES;i++){
    const f=FLAGS[i];
    ctx.save();
    ctx.translate(FLAG_X,f.y);
    ctx.scale(f.k,f.k);
    ctx.fillStyle='#4e342e';ctx.fillRect(-5,-4,10,5);     // 底座一直在＝旗位
    if(f.st===0||f.st===1){
      const p=f.st===1?Math.min(1,f.t/0.35):0;
      ctx.save();
      if(p>0){ctx.rotate(p*1.75);ctx.globalAlpha=1-p;}    // 被拔：倒向场地并消失
      drawFlagBody(i,Math.sin(T*2.2+i*1.7)*0.07*(1-p),f.st===0);
      ctx.restore();
    }else if(f.st===2){
      const g=Math.max(0.05,eob(Math.min(1,f.t/0.5)));
      ctx.save();ctx.scale(g,g);
      drawFlagBody(i,Math.sin(T*2.2+i*1.7)*0.07*g,true);
      ctx.restore();
    }
    ctx.restore();
    if(f.st===1&&f.t>0.1)                                 // 脱落的星星：飞起再落回
      star(ctx,FLAG_X+20*f.k,f.sy,9,'#ffd600',f.t*7);
  }
  ctx.globalAlpha=1;
}

/* ========== 地面威胁画在地上（旗子之后、小人之前）：先看得见，才伤得到 ==========
   预警期＝路面发红/压暗＋一条会爬的亮边；生效期＝真的有火、真的有冲击。
   全部用压扁的椭圆和贴地的扁条，不立起来挡视线，小朋友随时看得见自己的小人。 */
function groundEllipse(x,y,rx,ry,c){
  ctx.save();ctx.beginPath();ctx.ellipse(x,y,Math.max(1,rx),Math.max(1,ry),0,0,Math.PI*2);
  ctx.fillStyle=c;ctx.fill();ctx.restore();
}
/* 一簇火苗：底下宽、顶上尖，左右随时间晃（h＝高，w＝底宽） */
function gtFlame(x,y,h,w,c1,c2){
  const k=w*(0.92+0.12*Math.sin(T*13+x*0.7));
  ctx.fillStyle=c1;
  ctx.beginPath();
  ctx.moveTo(x-k,y);
  ctx.quadraticCurveTo(x-k*0.55,y-h*0.62,x-k*0.16,y-h*0.42);
  ctx.quadraticCurveTo(x,y-h*1.02,x+k*0.2,y-h*0.46);
  ctx.quadraticCurveTo(x+k*0.6,y-h*0.66,x+k,y);
  ctx.closePath();ctx.fill();
  ctx.fillStyle=c2;                                  // 芯子更亮，看着就烫
  ctx.beginPath();
  ctx.moveTo(x-k*0.45,y);ctx.quadraticCurveTo(x,y-h*0.68,x+k*0.45,y);
  ctx.closePath();ctx.fill();
}
function gtPulse(){return 0.72+0.28*Math.sin(T*15);}   // 预警的"眨眼"节奏：快，看得出在倒计时
function drawGts(){
  for(const e of G.gts){
    const a=e.t-e.warn,p=e.warn>0?Math.min(1,e.t/e.warn):1;   // a<0 预警中，0..dur 真会伤人
    const ls=e.lanes||[e.lane];
    if(a<0){                                        // 预警画在生效之前，两帧交接时不会重复叠色
      if(e.kind==='pillar'||e.kind==='pool'){       // 火系：地上先烫出一圈红
        const y=laneY(e.lane),r=e.kind==='pool'?20:32;
        ctx.save();ctx.globalAlpha=0.24+0.42*p;
        groundEllipse(e.x,y-6,r+8*p,11+4*p,'#ff5030');
        ctx.globalAlpha=(0.3+0.45*p)*gtPulse();
        groundEllipse(e.x,y-6,(r+8*p)*0.6,7,'#ffd54f');ctx.restore();
      }else if(e.kind==='quake'){                   // 骨锤：它脚下那 1 条整路压成暗红，越举越深
        for(const ln of ls){const y=laneY(ln);
          ctx.save();ctx.globalAlpha=0.10+0.30*p*gtPulse();
          ctx.fillStyle='#8e1b12';ctx.fillRect(0,y-LANE_H*0.44,GW,LANE_H*0.88);
          ctx.globalAlpha=0.22+0.35*p;ctx.fillStyle='#ff5252';
          for(let x=GW-24;x>0;x-=44)ctx.fillRect(x,y-LANE_H*0.30,18,LANE_H*0.60);   // 斜着退的条纹＝"要塌了"
          ctx.restore();}
      }else{                                        // 长臂：整条路压暗——横扫会一路扫到最左边，预警只能报整条
        for(const ln of ls){const y=laneY(ln);
          ctx.save();
          ctx.globalAlpha=0.11+0.24*p*gtPulse();ctx.fillStyle='#150618';
          ctx.fillRect(0,y-LANE_H*0.42,GW,LANE_H*0.84);
          /* 右端那只越举越亮的臂爪＝"手在这边、往左扫"，方向和起点一眼读得出 */
          const k=(9+15*p);
          ctx.globalAlpha=0.55+0.45*p;ctx.fillStyle='#b388ff';
          rrect(ctx,GW-k+4,y-k,k*2,k*2,6);ctx.fill();
          ctx.restore();}
      }
      continue;
    }
    if(a>e.dur)continue;
    const g=Math.max(0,Math.min(Math.min(1,a/0.1),Math.min(1,(e.dur-a)/0.18)));   // 起势→收势
    if(e.kind==='pillar'){                          // 火柱：又高又亮，站这条路必挨一下
      /* 半血狂暴那版更高更粗（招式侧只给 tall 这个语义标记，像素留在绘制层）。
         最坏情况是火柱落在最上面那条路（laneY(0)=282）：焰尖约在 0.73h 处，
         282-8-190*0.73≈135，仍在单王血条底边 116 之下，不会被切顶。 */
      const y=laneY(e.lane),h=(e.tall?190:156)*g,w=e.tall?34:28;
      ctx.save();ctx.globalAlpha=0.55*g;groundEllipse(e.x,y-4,w+2,12,'#ff7043');ctx.restore();
      gtFlame(e.x,y-8,h,w,'#ff6d30','#ffd54f');
      ctx.save();ctx.globalAlpha=0.85;gtFlame(e.x,y-8,h*0.6,w*0.53,'#fff59d','#ffffff');ctx.restore();
    }else if(e.kind==='pool'){                       // 火星坑：一小片烫红的地，窜几苗小火，3 秒自己灭
      const y=laneY(e.lane);
      ctx.save();ctx.globalAlpha=0.5*g;groundEllipse(e.x,y-5,24,9,'#bf360c');ctx.restore();
      for(let i=0;i<3;i++)gtFlame(e.x-14+i*14,y-4,(20+10*Math.sin(T*11+i*2.1))*g,9,'#ff8a50','#ffe082');
    }else if(e.kind==='quake'){                      // 震波：那一条路闪一道光＋地面裂纹
      for(const ln of ls){const y=laneY(ln);
        /* 亮度克制：生效帧小朋友必须还能看见自己在哪条路、大王在哪——
           0.85 的整路白条铺满三条路等于一记全屏白闪，既晃眼又把"我已经挨了一下"糊掉了 */
        ctx.save();ctx.globalAlpha=0.34*g;ctx.fillStyle='#ffab91';
        ctx.fillRect(0,y-4,GW,8);ctx.restore();
        ctx.save();ctx.globalAlpha=g;ctx.strokeStyle='#efebe9';ctx.lineWidth=3;
        ctx.beginPath();
        for(let x=GW;x>-10;x-=52){ctx.moveTo(x,y-LANE_H*0.34);ctx.lineTo(x-24,y+LANE_H*0.30);}
        ctx.stroke();ctx.restore();}
    }else{                                           // 横扫：身后一条暗痕，前爪发光，跟着 x 往左拖
      for(const ln of ls){const y=laneY(ln);
        ctx.save();ctx.globalAlpha=0.32*g;ctx.fillStyle='#0d0410';
        ctx.fillRect(e.x,y-LANE_H*0.40,GW+40-e.x,LANE_H*0.80);ctx.restore();
        const cy=y-8;
        ctx.save();ctx.globalAlpha=g;
        ctx.fillStyle='#4a148c';rrect(ctx,e.x-30,cy-19,60,38,12);ctx.fill();
        ctx.fillStyle='#7b1fa2';rrect(ctx,e.x-78,cy-11,64,22,10);ctx.fill();   // 手臂本体，看得清是"拖"过来的
        ctx.fillStyle='#ea80fc';rrect(ctx,e.x-20,cy-11,40,22,9);ctx.fill();
        ctx.restore();}
    }
  }
  for(const z of G.zs){                        // 长臂王开火前的瞄准光带：画在实体之下，绝不挡住小朋友的小人
    if(!z.boss||z.die||z.cfg.mech!=='drag'||z.tele<=0)continue;
    const e=weakPos(z);
    for(const ln of (z.teleLanes.length?z.teleLanes:[z.lane])){
      const y=laneY(ln);
      ctx.save();ctx.globalAlpha=0.30*gtPulse();
      ctx.fillStyle='#ff4081';ctx.fillRect(0,y-9,e.x,18);ctx.restore();
      ctx.save();ctx.globalAlpha=0.14;ctx.fillStyle='#ff80ab';ctx.fillRect(0,y-LANE_H*0.36,e.x,LANE_H*0.72);ctx.restore();
    }
  }
}
/* ========== 大王身上的状态标记 ==========
   破绽圈＝招式打完的那 1~2 秒，打这里翻倍；星星＝终章轮到谁主攻。
   （长臂王的瞄准光带在 drawGts 里画——弹幕那几条路的粉色提示，必须压在小人底下，不能挡住他） */
function weakPos(z){
  const k=BOSS_ZK[z.cfg.mech],u=z.s/58;       // 弱点位置只写在 BOSS_ZK.weak 一处（零件中心，跟着外形走）
  return{x:z.x+k.weak[0]*u,y:z.y+k.weak[1]*u};
}
function drawWeak(z){
  const w=weakPos(z),r=z.s*0.20,p=0.75+0.25*Math.sin(T*11);
  ctx.save();
  ctx.globalAlpha=0.9;ctx.strokeStyle='#ffd740';ctx.lineWidth=5;
  ctx.beginPath();ctx.arc(w.x,w.y,r*1.5*p,0,7);ctx.stroke();
  ctx.globalAlpha=0.55;ctx.strokeStyle='#fff176';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.arc(w.x,w.y,r*2.1*p,0,7);ctx.stroke();
  ctx.restore();
  for(let i=0;i<4;i++)                                        // 四颗转着的亮点：一眼认得出"这会儿打它有用"
    spark4(ctx,w.x+Math.cos(T*4+i*1.57)*r*2.4,w.y+Math.sin(T*4+i*1.57)*r*2.4,r*0.55,T*2+i,'#fff59d');
}
function drawBossMarks(){
  for(const z of G.zs){
    if(!z.boss||z.die)continue;
    if(z.weakT>0)drawWeak(z);
    if(z.aura&&isFinalStage()){                         // 主攻头顶一颗转着的星：全屏幕只找得到这一只会出手
      const s=z.s;
      star(ctx,z.x-s*0.05,z.y-s*1.12,s*0.16+2*Math.sin(T*6),'#ffd740',T*1.4);
      ctx.save();ctx.globalAlpha=0.25+0.12*Math.sin(T*7);groundEllipse(z.x,z.y-4,s*0.42,s*0.14,'#ffd740');ctx.restore();
    }
  }
}

function render(){
  ctx.save();ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.restore();

  bgx.clearRect(0,0,W,H);
  BG[curBG](bgx,T);
  ctx.drawImage(bgc,BX,BY,W*BS,H*BS);
  drawField();
  drawFlags();
  drawGts();          // 地面威胁压在小人底下：看得见火，也永远看得见自己

  ctx.save();
  if(G.shake>0)ctx.translate((Math.random()-0.5)*12*G.shake,(Math.random()-0.5)*12*G.shake);

  const list=[];
  for(const z of G.zs)list.push([z.y,z]);
  list.push([G.hero.y,null]);
  list.sort((a,b)=>a[0]-b[0]);
  for(const it of list){ if(it[1])drawZombie(it[1]); else drawHero(); }
  drawBossMarks();    // 破绽圈与主攻星星盖在实体之上，一眼找得到该打哪儿

  for(const b of G.bls){
    if(b.kind==='star'){                        // 星星飞镖：黄星星＋淡尾
      ctx.save();ctx.globalAlpha=.35;
      star(ctx,b.x-15,b.y,7,'#fff176',b.rot);
      ctx.restore();
      star(ctx,b.x,b.y,10,'#ffd54f',b.rot);
    }else if(b.kind==='bullet'){                // 小子弹：红色小圆弹（不穿透）
      ctx.fillStyle='#ef5350';ctx.beginPath();ctx.arc(b.x,b.y,4.6,0,7);ctx.fill();
      ctx.fillStyle='#ffcdd2';ctx.beginPath();ctx.arc(b.x+1.5,b.y-1.5,1.7,0,7);ctx.fill();
    }else if(b.kind==='smg'){                   // 散弹枪弹丸＝最早版本冲锋战士的红色小圆弹＋短尾（照原样搬回来）
      ctx.save();ctx.globalAlpha=.3;ctx.fillStyle='#ef5350';
      rrect(ctx,b.x-13,b.y-2.2,11,4.4,2.2);ctx.fill();ctx.restore();
      ctx.fillStyle='#ef5350';ctx.beginPath();ctx.arc(b.x,b.y,4.6,0,7);ctx.fill();
      ctx.fillStyle='#ffcdd2';ctx.beginPath();ctx.arc(b.x+1.5,b.y-1.5,1.7,0,7);ctx.fill();
    }else if(b.kind==='fire'){                  // 大火球：大、稍慢，砸中就在爆点炸开三条路
      ctx.save();ctx.globalAlpha=.30;ctx.fillStyle='#ff7043';
      ctx.beginPath();ctx.arc(b.x-14,b.y,15,0,7);ctx.fill();ctx.restore();
      ctx.fillStyle='#ff7043';ctx.beginPath();ctx.arc(b.x,b.y,13,0,7);ctx.fill();
      ctx.fillStyle='#ffca28';ctx.beginPath();ctx.arc(b.x+2,b.y,8.5,0,7);ctx.fill();
      ctx.fillStyle='#fff59d';ctx.beginPath();ctx.arc(b.x+4,b.y,4,0,7);ctx.fill();
    }else if(b.kind==='ice'){                   // 寒冰球：冰蓝光球＋雪花芯
      ctx.save();ctx.globalAlpha=.35;ctx.fillStyle='#81d4fa';
      ctx.beginPath();ctx.arc(b.x,b.y,13,0,7);ctx.fill();ctx.restore();
      ctx.fillStyle='#b3e5fc';ctx.beginPath();ctx.arc(b.x,b.y,9,0,7);ctx.fill();
      star(ctx,b.x,b.y,5,'#ffffff',b.rot);
    }else if(b.kind==='bolt'){                  // 雷电球：真闪电⚡——锯齿电光＋每帧抖闪＋紫色电晕＋电花尾迹
      const fl=.7+Math.random()*.3;             // 亮度随机抖动＝电流噼里啪啦的感觉
      ctx.save();ctx.globalAlpha=.32*fl;ctx.fillStyle='#b388ff';
      ctx.beginPath();ctx.arc(b.x,b.y,13,0,7);ctx.fill();ctx.restore();
      ctx.save();ctx.translate(b.x,b.y);
      ctx.lineJoin='round';ctx.lineCap='round';
      ctx.strokeStyle='#fff176';ctx.lineWidth=4;
      ctx.beginPath();
      ctx.moveTo(-14,(Math.random()-.5)*3);
      ctx.lineTo(-6,-5+(Math.random()-.5)*3);
      ctx.lineTo(0,2+(Math.random()-.5)*3);
      ctx.lineTo(7,-4+(Math.random()-.5)*3);
      ctx.lineTo(14,1+(Math.random()-.5)*3);
      ctx.stroke();
      ctx.strokeStyle='#ffffff';ctx.lineWidth=1.6;ctx.stroke();   // 白芯叠一道＝更亮更电
      ctx.restore();
    }else if(b.kind==='spark'){                 // 快快飞镖：黄色四角闪星，缩放脉动＋微拖尾（和五角星星星飞镖区分）
      const r=9*(1+0.22*Math.sin(b.rot*2.6));
      ctx.save();ctx.globalAlpha=.28;spark4(ctx,b.x-14,b.y,r*0.7,b.rot*0.7,'#ffd740');ctx.restore();
      spark4(ctx,b.x,b.y,r,b.rot,'#ffd740');
    }else if(b.kind==='rocket'){                // 火箭弹：34px 小火箭（红尖头＋机身＋尾翼）＋尾焰粒子，慢速也看得清
      ctx.fillStyle='#90a4ae';rrect(ctx,b.x-12,b.y-5,22,10,5);ctx.fill();   // 机身
      ctx.fillStyle='#e53935';                                              // 红尖头＋上下尾翼
      ctx.beginPath();ctx.moveTo(b.x+10,b.y-5);ctx.lineTo(b.x+22,b.y);ctx.lineTo(b.x+10,b.y+5);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(b.x-12,b.y-5);ctx.lineTo(b.x-20,b.y-9);ctx.lineTo(b.x-9,b.y-1);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(b.x-12,b.y+5);ctx.lineTo(b.x-20,b.y+9);ctx.lineTo(b.x-9,b.y+1);ctx.closePath();ctx.fill();
      ctx.fillStyle='#fff59d';ctx.beginPath();ctx.arc(b.x-3,b.y-1.5,2,0,7);ctx.fill();   // 舷窗
    }else{                                      // 回旋镖：旋转的 L 形双翼，飞出去再飞回来
      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.rot);
      ctx.fillStyle='#8d6e63';
      rrect(ctx,-3,-16,6,18,3);ctx.fill();
      rrect(ctx,-3,-2,15,6,3);ctx.fill();
      ctx.fillStyle='#a1887f';rrect(ctx,-1.5,-14,3,14,1.5);ctx.fill();
      ctx.restore();
    }
  }
  for(const b of G.ebs){                        // 空中飞来的东西：大王弹＝橙红大星；小兵吐的按弹种各画各的
    if(!b.shot){
      ctx.save();ctx.globalAlpha=.35;
      star(ctx,b.x+15,b.y,7,'#ff8a65',b.rot);
      ctx.restore();
      star(ctx,b.x,b.y,11,'#ff5722',b.rot);
      continue;
    }
    /* 焕宸：「12、13、14 关敌人发射出来的子弹太小、不太清楚，敌人题型较大」。
       做法：把弹心平移到原点再按体型缩放（k 见 bulletK），四种弹全部改用局部坐标绘制，
       并统一加「同色柔光底 + 一圈亮色描边」——小兵弹最远只放大到 1.6 倍，BOSS 的大星弹不动。
       只动像素，命中判定/弹速/伤害都不在这里，所以放大只会更好认，不会变相更难躲。 */
    const k=b.k||1;
    ctx.save();ctx.translate(b.x,b.y);if(k!==1)ctx.scale(k,k);
    ctx.lineWidth=2.2;
    if(b.shot==='fireball'){                    // 火焰丧尸的小火球：橙核黄心，尾巴一跳一跳
      const f=Math.sin(T*16+b.x*0.06)*1.6;
      ctx.globalAlpha=.5;ctx.fillStyle='#ff8a65';
      ctx.beginPath();ctx.arc(8,f*0.3,6.4+f*0.3,0,7);ctx.fill();
      ctx.globalAlpha=1;ctx.fillStyle='#ff7043';ctx.strokeStyle='#fff176';
      ctx.beginPath();ctx.arc(0,0,7.4,0,7);ctx.fill();ctx.stroke();
      ctx.fillStyle='#ffe082';ctx.beginPath();ctx.arc(-1.6,-1.4,3.8,0,7);ctx.fill();
    }else if(b.shot==='bone'){                  // 破洞丧尸扔的骨头：白条条两头圆球，一边飞一边转（深灰描边才衬得出来）
      ctx.globalAlpha=.4;ctx.fillStyle='#b0bec5';
      ctx.beginPath();ctx.arc(0,0,10.5,0,7);ctx.fill();
      ctx.globalAlpha=1;ctx.rotate(b.rot);
      ctx.fillStyle='#f5f7f8';ctx.strokeStyle='#37474f';ctx.lineWidth=1.8;
      rrect(ctx,-7.4,-2.4,14.8,4.8,2.4);ctx.fill();ctx.stroke();
      [[-7.4,-3],[-7.4,3],[7.4,-3],[7.4,3]].forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],2.7,0,7);ctx.fill();ctx.stroke();});
      ctx.fillStyle='#90a4ae';ctx.fillRect(-1.4,-1.6,2.8,3.2);
    }else if(b.shot==='icicle'){                // 冰封丧尸的冰棱：尖头朝左的淡蓝锥子
      ctx.globalAlpha=.42;ctx.fillStyle='#4fc3f7';
      ctx.beginPath();ctx.arc(0,0,10,0,7);ctx.fill();
      ctx.globalAlpha=1;ctx.fillStyle='#4fc3f7';ctx.strokeStyle='#ffffff';
      ctx.beginPath();ctx.moveTo(-10.5,0);ctx.lineTo(5,-6);ctx.lineTo(5,6);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.fillStyle='#e1f5fe';ctx.fillRect(2.4,-4.4,5,8.8);
    }else{                                      // 僵尸的绿口水：晃悠的黏液滴
      ctx.globalAlpha=.5;ctx.fillStyle='#aed581';
      ctx.beginPath();ctx.arc(7,0,6,0,7);ctx.fill();
      ctx.globalAlpha=1;ctx.fillStyle='#64dd17';ctx.strokeStyle='#ffffff';
      ctx.beginPath();ctx.ellipse(0,0,7.4,5.6,0,0,7);ctx.fill();ctx.stroke();
      ctx.fillStyle='#f1f8e9';ctx.beginPath();ctx.arc(-2,-1.6,2,0,7);ctx.fill();
    }
    ctx.restore();
  }
  for(const b of G.bolts){                      // 雷电链：亮黄折线，中点抖一下更像闪电
    ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,b.t/0.16));
    ctx.strokeStyle='#fff176';ctx.lineWidth=5;ctx.lineJoin='round';
    ctx.beginPath();
    for(let i=0;i<b.pts.length;i++){
      const p=b.pts[i];
      if(i===0)ctx.moveTo(p[0],p[1]);
      else{
        ctx.lineTo((b.pts[i-1][0]+p[0])/2+(Math.random()-0.5)*22,(b.pts[i-1][1]+p[1])/2+(Math.random()-0.5)*26);
        ctx.lineTo(p[0],p[1]);
      }
    }
    ctx.stroke();ctx.restore();
  }
  if(G.laser){                                  // 超级激光：从枪口到屏幕右缘的亮白光束
    const a=Math.max(0,Math.min(1,G.laser.t/0.35));
    ctx.save();ctx.globalAlpha=a;
    ctx.fillStyle='rgba(255,241,118,.35)';ctx.fillRect(G.laser.x,G.laser.y-14,GW-G.laser.x,28);
    ctx.fillStyle='#ffffff';ctx.fillRect(G.laser.x,G.laser.y-4,GW-G.laser.x,8);
    ctx.restore();
  }
  for(const c of G.cs){                         // 金币：转着飞的小金币
    if(c.t<0)continue;
    ctx.save();ctx.translate(c.x,c.y);ctx.scale(Math.max(0.25,Math.abs(Math.cos(c.t*12))),1);
    ctx.fillStyle='#f9a825';ctx.beginPath();ctx.arc(0,0,8,0,7);ctx.fill();
    ctx.fillStyle='#ffd54f';ctx.beginPath();ctx.arc(0,0,6,0,7);ctx.fill();
    ctx.fillStyle='#fff59d';ctx.fillRect(-2,-4,3,3);
    ctx.restore();
  }
  drawParts(ctx,G.ps);
  ctx.restore();
  if(G.flash>0){                                // 魔法炸弹：全屏白闪
    ctx.fillStyle='rgba(255,255,255,'+(G.flash/0.3*0.85).toFixed(3)+')';
    ctx.fillRect(0,0,GW,GH);
  }
  drawFG();                                     // 萤火虫/落叶飘在最前面
  drawBossBar();                                // BOSS 血条固定在最前层，始终可见
}

/* ---------- 菜单里的角色预览 ---------- */
let pvA=null,pvB=null;
function setupPreview(id){
  const c=$(id),dpr=Math.min(window.devicePixelRatio||1,2);
  c.width=200*dpr;c.height=230*dpr;
  const x=c.getContext('2d');
  x.setTransform(dpr,0,0,dpr,0,0);
  return x;
}
function drawPreview(x,ch){
  const PW=200,PH=230;
  x.clearRect(0,0,PW,PH);
  const g=x.createLinearGradient(0,0,0,PH);
  g.addColorStop(0,'#0a2c23');g.addColorStop(1,'#14483c');
  x.fillStyle=g;x.fillRect(0,0,PW,PH);
  for(let i=0;i<6;i++){
    const px=(i*37+18)%PW, py=34+((i*53)%126), a=.3+.7*Math.abs(Math.sin(T*2+i));
    x.save();x.globalAlpha=a;x.shadowColor='#fff59d';x.shadowBlur=8;x.fillStyle='#ffee58';
    x.beginPath();x.arc(px+Math.sin(T+i)*7,py,2,0,7);x.fill();x.restore();
  }
  x.fillStyle='#14382a';x.fillRect(0,198,PW,PH-198);
  x.fillStyle='#1d4c37';x.fillRect(0,198,PW,4);
  const c=curLook(ch);
  c.draw(x,PW/2,208,124,c.sk,T,0);
}
/* 衣服条渲染（4.12）：每件衣服一枚 chip，静态立绘冻结在 t=0；
   未解锁＝置灰＋🔒＋「打完第N篇章解锁」。整行 dim＝当前选的是爸爸（衣服只给焕宸穿） */
function renderFits(){
  const row=$('fitRow');
  row.innerHTML='<span class="tag">👕 衣服 · 焕宸</span>';
  for(const id in OUTFITS){
    const o=OUTFITS[id],unl=outfitUnl.has(o.lv);
    const d=document.createElement('div');
    d.className='fit'+(unl&&id===curOutfit?' sel':'')+(unl?'':' lock');
    d.dataset.o=id;
    const cv=document.createElement('canvas');
    cv.width=104;cv.height=120;
    const x=cv.getContext('2d');
    x.setTransform(2,0,0,2,0,0);
    o.draw(x,26,57,54,o.sk,0,0);
    d.appendChild(cv);

    fn.className='fn';
    fn.textContent=unl?o.name:'打完第'+'一二三四'[o.lv-1]+'篇章解锁';
    d.appendChild(fn);

  }

}

let last=0,hitStop=0;
function addHitStop(t){hitStop=Math.max(hitStop,t);}   // 顿帧：打击瞬间短暂定格，更有分量（用真实时间恢复）
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
  if(hitStop>0){hitStop-=dt;if(mode!=='menu')render();return;}   // 定格期间不推进模拟，只画这一帧（含震屏）
  T+=dt;
  stepFlags(dt);                                // 拔旗动画（星星落回插旗）在暂停/结束时也要走完
  stepCoins(dt);                                // 金币飞行：任何模式下都飞完，进账叮声不丢
  if(mode==='play')update(dt);
  else if(mode==='inter'){interT-=dt;if(interT<=0){nextStage();startPlay();}}  // 关卡间自动过渡
  else if(mode==='win')stepWin(dt);               // 打败BOSS：定格＋放烟花，1.9秒后浮现面板等选择
  if(mode==='menu'){drawPreview(pvA,'thin');drawPreview(pvB,'fat');}
  else render();
}

/* ---------- 家长诊断：把这台平板的音频真相读出来 ---------- */
function diagEnv(){
  const L=[],push=(k,v)=>L.push(k+'：'+v);
  push('① 声音开关',SND_ON?'开 ✅':'关 ❌ ← 点首页那个 🔇 按钮打开');
  const C=window.AudioContext||window.webkitAudioContext;
  push('② WebAudio',C?'支持':'❌ 不支持');
  push('③ AudioContext',AC?(AC.state+(AC.state==='running'?' ✅':' ❌ suspended＝音效发不出')):'还没创建（点一下「测音效」）');
  if(AC&&BUS)push('④ 主音量',(SND_ON?'gain='+BUS.master.gain.value.toFixed(2):'已静音'));
  const hasSS=('speechSynthesis' in window);
  push('⑤ 语音接口',hasSS?'存在':'❌ 不存在 ← WebView 没开放 TTS');
  if(hasSS){
    let vs=[];try{vs=speechSynthesis.getVoices()||[];}catch(e){}
    push('⑥ 语音引擎数',vs.length+(vs.length?'':' 个 ❌ ← 这台平板没装 TTS 引擎'));
    push('⑦ 引擎列表',vs.length?vs.map(v=>v.name+'['+v.lang+']').join('\n            '):'—');
    const zv=zhVoice();
    push('⑧ 挑中的中文引擎',zv?zv.name+' ✅':'❌ 没挑到');
  }
  let cap='否（浏览器直接打开）';
  try{if(window.Capacitor)cap='是 · '+Capacitor.getPlatform();}catch(e){cap='是（读平台失败）'}
  push('⑨ 运行在APK里',cap);
  push('⑩ 内置语音',IN_APK?('已打包 '+Object.keys(VTEXT).length+' 句台词＋'+SFX_KEYS.length+' 个音效 ✅ 不依赖平板TTS'):'未使用（桌面走系统TTS）');
  push('⑪ UA',navigator.userAgent);
  return L.join('\n');
}
